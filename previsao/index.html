<!--
FLUXOGRAMA: entrada (o link pessoal ?c=CÓDIGO, ou celular + nascimento) -> validação (a página só confere o formato; quem decide é o servidor: funções pmarc_* do Supabase, supabase/previsao-marcacao-parte2-paciente.sql; NADA aqui barra a pessoa: "não sei" e "seguimos" valem como resposta)
  -> lógica (mostra a PREVISÃO das marcações abertas no Klingo, pergunta se está certo, anota o que a pessoa disser, abre a conversa com a equipe)

<style>

<body>
<header class="topo"><div class="topo-in"><img class="topo-logo" src="../img/logo-csi-simbolo.svg" alt="CSI - Clínica de Saúde e Imagem" width="84" height="28"><b>Previsão de marcação</b></div></header>
<main id="app" aria-live="polite"><p class="sub">Carregando…</p></main>
<script src="../nomes-exame.js"></script>
<script>
'use strict';
/* ===== Servidor (Supabase) =====
   A chave é a PÚBLICA do projeto (a mesma do chat e do acesso rápido). Quem protege os dados são as funções pmarc_* do banco:
   as tabelas são fechadas e a credencial é o código secreto do link (ou celular + nascimento, com limite de tentativas). */
const SUPABASE_URL='https://nrvuynjwcgwpjdptkiay.supabase.co';
const SUPABASE_KEY='sb_publishable_e2GK1YGEj06STa_ESCevow_nvtATB-y';
const VERSAO_PREVISAO='2026.11.18-1';
async function rpc(nome,args){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify(args||{}),signal:ctl.signal});
    if(!r.ok)return{ok:false,motivo:'rede'};
    return await r.json();
  }catch(e){return{ok:false,motivo:'rede'}}
  finally{clearTimeout(t)}
}

/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');
const fmtTel=d=>{d=digits(d).slice(0,11);if(d.length<=2)return d?'('+d:'';if(d.length<=7)return`(${d.slice(0,2)}) ${d.slice(2)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};
const guardar=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const ler=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
// 13/05/1990 ou 1990-05-17 -> 1990-05-17 (vazio se não for data)
const dataIso=t=>{t=String(t||'').trim();let m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t);if(m)return`${m[3]}-${m[2]}-${m[1]}`;m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t);return m?t:''};
const UNID={'CSI':'CSI','DESENVOAR':'Desenvoar','RM/TC':'CSI RM/TC'};
const quandoFmt=iso=>{const d=new Date(iso);if(isNaN(d))return{dia:'',hora:''};const o={timeZone:'America/Sao_Paulo'};
  return{dia:d.toLocaleDateString('pt-BR',{...o,weekday:'short',day:'2-digit',month:'2-digit'}).replace('.',''),hora:d.toLocaleTimeString('pt-BR',{...o,hour:'2-digit',minute:'2-digit'})}};
const horaMsg=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'})};
const nomeExame=n=>{try{const a=window.NomesExame&&window.NomesExame.apresentar(n);if(a&&a.titulo)return{titulo:a.titulo,detalhe:a.detalhe||''}}catch(e){}return{titulo:String(n||'Atendimento'),detalhe:''}};
const app=$('#app');
const E={codigo:null,v:null,passo:'inicio',resposta:null,ultimaMsg:0,msgs:[],timer:null};

/* ===== Aviso fixo: aparece em TODA tela ===== */
const avisoHtml=()=>`<div class="aviso" role="note"><b>Previsão</b>${esc((E.v&&E.v.aviso)||'Importante: esta é uma PREVISÃO de marcação. Ela ainda vai ser vista e confirmada pela nossa equipe, pelo webchat, pelo WhatsApp e por telefone.')}</div>`;
const passosHtml=n=>`<div class="passos" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
const mostrar=(h,foco)=>{app.innerHTML=h;const f=foco&&$(foco);if(f)f.focus({preventScroll:false})};
const erroRede='Não foi possível falar com a clínica agora. Tente de novo em instantes.';

/* ===== Tela: sem link (achar pelo celular e nascimento) ===== */
function telaAchar(msg){
  parar();
  mostrar(`<h1>Previsão de marcação</h1>
  <p class="sub">Aqui você vê o que está previsto para você na CSI, responde se está certo e fala com a nossa equipe.</p>
  <div class="aviso" role="note"><b>Previsão</b>Importante: esta é uma PREVISÃO de marcação. Ela ainda vai ser vista e confirmada pela nossa equipe, pelo webchat, pelo WhatsApp e por telefone.</div>
  <form class="card" id="fAchar" novalidate>
    <h2 style="margin-top:0">Ache a sua previsão</h2>
    <label for="cel">Celular com DDD</label><input id="cel" inputmode="tel" autocomplete="tel-national" placeholder="(71) 90000-0000">
    <label for="nasc">Data de nascimento</label><input id="nasc" inputmode="numeric" autocomplete="bday" placeholder="dd/mm/aaaa" maxlength="10">
    <p class="msg-erro" id="erro" role="alert">${esc(msg||'')}</p>
    <button class="btn" type="submit">Ver a minha previsão</button>
  </form>
  <button class="btn" id="btnPedir" type="button">Escolher um exame ou consulta e ver a disponibilidade</button>
  <button class="btn linha" id="btnSem" type="button">Não achei / quero falar com a equipe</button>
  <p class="rodape">Se a clínica mandou um link pelo WhatsApp, é só tocar nele: não precisa digitar nada.</p>`,'#cel');
  $('#cel').addEventListener('input',e=>{e.target.value=fmtTel(e.target.value)});
  $('#nasc').addEventListener('input',e=>{const d=digits(e.target.value).slice(0,8);e.target.value=d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d});
  $('#btnSem').onclick=()=>telaNovo();
  $('#btnPedir').onclick=()=>telaPedidoExame(()=>telaAchar());
  $('#fAchar').onsubmit=async ev=>{
    ev.preventDefault();
    const cel=digits($('#cel').value),nasc=dataIso($('#nasc').value),er=$('#erro'),b=ev.submitter||$('#fAchar button[type=submit]');
    if(cel.length<10){er.textContent='Digite o celular com DDD.';return}
    if(!nasc){er.textContent='Digite a data de nascimento no formato dia/mês/ano.';return}
    b.disabled=true;er.textContent='';
    const r=await rpc('pmarc_identificar',{p_celular:cel,p_nascimento:nasc});
    b.disabled=false;
    if(r.motivo==='rede')return void(er.textContent=erroRede);
    if(r.motivo==='desligado')return telaDesligado();
    if(r.motivo==='muitas_tentativas')return telaNovo('Tentamos várias vezes e não achamos. Sem problema: deixe seus dados aqui e a equipe encontra a sua previsão.');
    if(r.motivo==='celular_invalido')return void(er.textContent='Confira o celular: precisa do DDD e dos números.');
    if(r.achou&&r.pessoas&&r.pessoas.length===1)return abrir(r.pessoas[0].codigo);
    if(r.achou&&r.pessoas&&r.pessoas.length>1)return telaEscolher(r.pessoas);
    telaNovo('Não encontramos uma previsão com esses dados — mas isso não impede nada. Deixe seus dados e a equipe procura para você.');
  };
}
function telaEscolher(pessoas){
  mostrar(`<h1>Para quem é a previsão?</h1><p class="sub">Achamos mais de uma pessoa com esse celular e esse nascimento.</p>
  <div class="opcoes">${pessoas.map((p,i)=>`<button class="btn linha" data-i="${i}" type="button">${esc(p.primeiro_nome||'Pessoa '+(i+1))}</button>`).join('')}</div>`);
  app.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>abrir(pessoas[+b.dataset.i].codigo));
}
/* ===== Tela: não achou / quer falar com a equipe (entra assim mesmo) ===== */
function telaNovo(msg){
  parar();
  mostrar(`<h1>Fale com a equipe</h1>
  ${msg?`<p class="sub" role="status">${esc(msg)}</p>`:'<p class="sub">Deixe o que você tiver. Não precisa estar completo.</p>'}
  <div class="aviso" role="note"><b>Previsão</b>Importante: esta é uma PREVISÃO de marcação. Ela ainda vai ser vista e confirmada pela nossa equipe, pelo webchat, pelo WhatsApp e por telefone.</div>
  <form class="card" id="fNovo" novalidate>
    <label for="nome">Seu nome <span class="opc">(como estiver no cadastro)</span></label><input id="nome" autocomplete="name">
    <label for="cel2">Celular com DDD</label><input id="cel2" inputmode="tel" autocomplete="tel-national" placeholder="(71) 90000-0000">
    <label for="nasc2">Data de nascimento <span class="opc">(se quiser)</span></label><input id="nasc2" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10">
    <label for="txt">O que você tem marcado ou quer marcar? <span class="opc">(se quiser)</span></label><textarea id="txt" maxlength="1000" placeholder="Ex.: marquei um ultrassom por telefone para sexta"></textarea>
    <p class="msg-erro" id="erro" role="alert"></p>
    <button class="btn" type="submit">Enviar para a equipe</button>
  </form>
  <button class="btn sec" id="voltar" type="button">Voltar</button>`,'#nome');
  $('#cel2').addEventListener('input',e=>{e.target.value=fmtTel(e.target.value)});
  $('#nasc2').addEventListener('input',e=>{const d=digits(e.target.value).slice(0,8);e.target.value=d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d});
  $('#voltar').onclick=()=>telaAchar();
  $('#fNovo').onsubmit=async ev=>{
    ev.preventDefault();
    const cel=digits($('#cel2').value),er=$('#erro'),b=$('#fNovo button[type=submit]');
    if(cel.length<10){er.textContent='Precisamos do celular com DDD para a equipe poder responder.';return}
    b.disabled=true;er.textContent='';
    const nasc=dataIso($('#nasc2').value);
    const r=await rpc('pmarc_novo',{p_nome:$('#nome').value,p_celular:cel,p_nascimento:nasc||null,p_texto:$('#txt').value});
    b.disabled=false;
    if(r.motivo==='rede')return void(er.textContent=erroRede);
    if(r.motivo==='desligado')return telaDesligado();
    if(r.motivo==='celular_invalido')return void(er.textContent='Confira o celular: precisa do DDD e dos números.');
    if(r.motivo==='muitos')return void(er.textContent='Muita gente está enviando agora. Tente de novo em alguns minutos.');
    if(!r.ok)return void(er.textContent=erroRede);
    guardar('pmarc.codigo',r.codigo);E.codigo=r.codigo;E.v=r;
    // quem já escreveu o texto vira mensagem para a equipe
    const t=$('#txt').value.trim();
    await rpc('pmarc_responder',{p_codigo:r.codigo,p_dados:{nome:$('#nome').value.trim()||undefined,observacao:t||undefined}});
    abrir(r.codigo);
  };
}
function telaDesligado(){
  parar();
  mostrar(`<h1>Previsão de marcação</h1><div class="card"><p>Este canal ainda não está disponível.</p><p class="sub">Você pode falar com a clínica pelo chat do site.</p><a class="btn" style="text-align:center;text-decoration:none" href="../">Ir para o chat</a></div>`);
}
function telaCodigoInvalido(){
  guardar('pmarc.codigo',null);
  telaAchar('Esse link não está mais valendo. Digite seu celular e sua data de nascimento para achar a previsão.');
}

/* ===== Abrir pelo código ===== */
async function abrir(codigo){
  E.codigo=codigo;
  mostrar('<p class="sub">Carregando a sua previsão…</p>');
  const r=await rpc('pmarc_abrir',{p_codigo:codigo});
  if(r.motivo==='rede')return mostrar(`<div class="card"><p>${esc(erroRede)}</p><button class="btn" id="tentar" type="button">Tentar de novo</button></div>`),$('#tentar').onclick=()=>abrir(codigo);
  if(r.motivo==='desligado')return telaDesligado();
  if(!r.ok)return telaCodigoInvalido();
  guardar('pmarc.codigo',codigo);E.v=r;E.resposta=r.resposta;
  limparEndereco();
  // quem já respondeu volta direto para a conversa
  if(r.respondeu||r.conversa)return telaConversa();
  telaPrevisao();
}

/* ===== Passo 1: a previsão e a pergunta ===== */
function itensHtml(itens){
  if(!itens||!itens.length)return`<p class="sub">Não achamos uma marcação aberta no seu nome agora. A equipe vai conferir com você.</p>`;
  return itens.map(i=>{const q=quandoFmt(i.quando),n=nomeExame(i.procedimento);
    return`<div class="item"><div class="quando">${esc(q.dia)}<small>${esc(q.hora)}</small></div><div><span class="tag${i.tipo==='consulta'?' c':''}">${i.tipo==='consulta'?'Consulta':'Exame'}</span><span class="nome">${esc(n.titulo)}</span>
    <small>${esc(UNID[i.unidade]||i.unidade||'')}${n.detalhe?' · '+esc(n.detalhe):''}</small></div></div>`}).join('');
}
function telaPrevisao(){
  parar();const v=E.v;
  mostrar(`${passosHtml(1)}<h1>Olá${v.primeiro_nome?', '+esc(v.primeiro_nome):''}!</h1>
  <p class="sub">Veja o que está previsto para você na CSI.</p>
  ${avisoHtml()}
  <section class="card" aria-label="Marcações previstas">${itensHtml(v.itens)}</section>
  <h2>Está certo?</h2>
  <div class="opcoes">
    <button class="btn" data-r="sim" type="button">Sim, está certo</button>
    <button class="btn linha" data-r="nao" type="button">Tem algo diferente</button>
    <button class="btn sec" data-r="nao_sei" type="button">Não sei / pode seguir</button>
  </div>

  $('#btnPedir').onclick=()=>telaPedidoExame(()=>telaPrevisao());
  app.querySelectorAll('button[data-r]').forEach(b=>b.onclick=async()=>{

  });
}

/* ===== Passo 2: pré-cadastro (só o que falta; tudo opcional) ===== */
function telaDados(resposta){
  parar();const v=E.v,f=v.faltam||[];
  const campos=[];
  if(f.includes('celular'))campos.push(`<label for="d-cel">Seu celular com DDD <span class="opc">(para a equipe te responder)</span></label><input id="d-cel" inputmode="tel" autocomplete="tel-national" placeholder="(71) 90000-0000">`);
  if(f.includes('email'))campos.push(`<label for="d-email">E-mail <span class="opc">(se quiser)</span></label><input id="d-email" type="email" inputmode="email" autocomplete="email">`);
  if(f.includes('nascimento'))campos.push(`<label for="d-nasc">Data de nascimento <span class="opc">(se quiser)</span></label><input id="d-nasc" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10">`);
  if(f.includes('cpf'))campos.push(`<label for="d-cpf">CPF <span class="opc">(se quiser)</span></label><input id="d-cpf" inputmode="numeric" autocomplete="off" maxlength="14">`);
  const pergunta=resposta==='nao'?'O que está diferente?':'Quer deixar alguma informação para a equipe?';
  mostrar(`${passosHtml(2)}<h1>${resposta==='nao'?'Conte o que está diferente':'Quase pronto'}</h1>
  ${avisoHtml()}
  <form class="card" id="fDados" novalidate>
    <label for="d-obs">${pergunta} <span class="opc">(se quiser)</span></label>
    <textarea id="d-obs" maxlength="1000" placeholder="${resposta==='nao'?'Ex.: o exame é em outro dia / não é para mim':'Ex.: prefiro de manhã'}"></textarea>
    ${campos.length?`<p class="sub" style="margin-top:14px">Para agilizar o seu pré-cadastro (tudo é opcional):</p>${campos.join('')}`:''}
    <p class="msg-erro" id="erro" role="alert"></p>
    <button class="btn" type="submit">Enviar e continuar</button>
    <button class="btn sec" id="pular" type="button">Pular por agora</button>
  </form>`,'#d-obs');
  const tel=$('#d-cel');if(tel)tel.addEventListener('input',e=>{e.target.value=fmtTel(e.target.value)});
  const nasc=$('#d-nasc');if(nasc)nasc.addEventListener('input',e=>{const d=digits(e.target.value).slice(0,8);e.target.value=d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d});
  $('#pular').onclick=()=>telaConversa();
  $('#fDados').onsubmit=async ev=>{
    ev.preventDefault();
    const dados={observacao:$('#d-obs').value.trim()||undefined,celular:tel&&tel.value.trim()||undefined,email:$('#d-email')&&$('#d-email').value.trim()||undefined,
      cpf:$('#d-cpf')&&$('#d-cpf').value.trim()||undefined,nascimento:nasc&&dataIso(nasc.value)||(nasc&&nasc.value.trim()?nasc.value.trim():undefined)};
    const b=$('#fDados button[type=submit]');
    if(!Object.values(dados).some(Boolean))return telaConversa();
    b.disabled=true;
    const x=await rpc('pmarc_responder',{p_codigo:E.codigo,p_dados:dados});
    b.disabled=false;
    if(x.motivo==='rede'||x.ok===false)return void($('#erro').textContent=erroRede);
    E.v=x;telaConversa();
  };
}

/* ===== Passo 3: conversa com a equipe ===== */
function bolhaHtml(m){const eu=m.autor==='cliente';
  return`<div class="bolha ${eu?'eu':'eles'}">${esc(m.texto)}<small>${eu?'Você':esc(m.agente||'CSI')} · ${esc(horaMsg(m.criado_em))}</small></div>`}
function parar(){if(E.timer){clearInterval(E.timer);E.timer=null}}
// O link pessoal (?c=) não deve ficar no endereço nem no histórico do navegador depois de aceito.
function limparEndereco(){try{const u=new URL(location.href);if(u.searchParams.has('c')){u.searchParams.delete('c');history.replaceState(null,'',u.pathname+(u.search||'')+u.hash)}}catch(e){}}
// Aparelho de outra pessoa: esquece o código guardado e volta para a tela de achar a previsão.
function sairDoAparelho(){parar();guardar('pmarc.codigo',null);E.codigo=null;E.v=null;E.resposta=null;E.msgs=[];E.ultimaMsg=0;limparEndereco();telaAchar()}
async function atualizarMsgs(primeira){
  const r=await rpc('pmarc_mensagens',{p_codigo:E.codigo,p_apos:E.ultimaMsg});
  if(!r.ok||!r.mensagens)return;
  if(!r.mensagens.length&&!primeira)return;
  const box=$('#conversa');if(!box)return;
  const colado=box.scrollHeight-box.scrollTop-box.clientHeight<60;
  r.mensagens.forEach(m=>{if(m.id>E.ultimaMsg){E.ultimaMsg=m.id;E.msgs.push(m);box.insertAdjacentHTML('beforeend',bolhaHtml(m))}});
  if(primeira||colado)box.scrollTop=box.scrollHeight;
  const vazio=$('#vazio');if(vazio&&E.msgs.length)vazio.remove();
}
function telaConversa(){

  ${v.respondeu?`<p class="ok-linha">✓ Anotamos o que você nos contou.</p>`:''}

  <form class="compor" id="fEnviar" novalidate><label for="texto" style="position:absolute;left:-9999px">Sua mensagem</label><textarea id="texto" rows="1" maxlength="4000" placeholder="Escreva sua mensagem"></textarea><button class="btn" type="submit">Enviar</button></form>
  <p class="msg-erro" id="erro" role="alert"></p>
  <button class="btn sec" id="btnSair" type="button">Sair deste aparelho</button>
  <p class="rodape">Versão ${esc(VERSAO_PREVISAO)} · <a href="../privacidade.html" target="_blank" rel="noopener">Privacidade</a></p>`);
  $('#btnPedir').onclick=()=>telaPedidoExame(()=>telaConversa());
  $('#btnSair').onclick=sairDoAparelho;
  atualizarMsgs(true);

  const area=$('#texto');
  area.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#fEnviar').requestSubmit()}});
  $('#fEnviar').onsubmit=async ev=>{
    ev.preventDefault();const t=area.value.trim();if(!t)return;
    const b=$('#fEnviar button');b.disabled=true;$('#erro').textContent='';
    const r=await rpc('pmarc_enviar',{p_codigo:E.codigo,p_texto:t});
    b.disabled=false;

    if(r.motivo==='sem_celular')return void telaCelular(t);
    $('#erro').textContent=r.motivo==='muitas_mensagens'?'Muitas mensagens em pouco tempo. Espere um instante.':erroRede;
  };
}
/* Sem celular no cadastro não dá para abrir a conversa: pede o celular (a mensagem digitada é enviada junto) */
function telaCelular(texto){
  parar();
  mostrar(`${passosHtml(3)}<h1>Qual o seu celular?</h1>${avisoHtml()}
  <form class="card" id="fCel" novalidate><p class="sub">A equipe precisa do número para responder a você.</p>

/* ===== Pedir uma previsão: escolher o exame/consulta, o turno ou horário (ou nada) e ver a disponibilidade =====
   Nada aqui reserva ou confirma: os horários vêm da agenda da clínica como PREVISÃO e a equipe confirma (webchat, WhatsApp e telefone). */
const ABAS=[['','Tudo'],['consulta','Consultas'],['exame','Exames'],['outro','Outros']];
const TURNOS=[['qualquer','Sem preferência'],['manha','Manhã'],['tarde','Tarde'],['noite','Noite']];
const NOME_TURNO={manha:'manhã',tarde:'tarde',noite:'noite'};
const horasOpc=(vazio,sel)=>`<option value="">${vazio}</option>`+Array.from({length:31},(_,i)=>{const m=360+i*30,h=String(Math.floor(m/60)).padStart(2,'0'),v=h+':'+(m%60?'30':'00');return`<option value="${v}"${v===sel?' selected':''}>${v}</option>`}).join('');
const hojeIso=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const diaFmt=iso=>{const d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})};
const voltarDaqui=()=>(E.volta||(E.codigo?()=>abrir(E.codigo):telaAchar))();
let seqLista=0,tBusca=null;

function telaPedidoExame(volta){
  parar();if(volta)E.volta=volta;E.pe=E.pe||{};if(E.tipo===undefined)E.tipo='';
  mostrar(`<h1>Pedir uma previsão</h1>
  <p class="sub">Escolha o exame ou a consulta. Depois diga quando prefere — ou não escolha nada — e veja a disponibilidade.</p>
  ${avisoHtml()}
  <section class="card" aria-label="Escolher o exame ou a consulta">
    <h2 style="margin-top:0">1. O que você quer?</h2>
    <div class="chips" role="group" aria-label="Tipo">${ABAS.map(([v,t])=>`<button class="chip" type="button" data-tipo="${v}" aria-pressed="${E.tipo===v}">${t}</button>`).join('')}</div>
    <label for="busca">Buscar pelo nome <span class="opc">(se quiser)</span></label>
    <input id="busca" type="search" autocomplete="off" maxlength="60" placeholder="Ex.: ultrassom, ressonância, pediatria">
    <div class="lista-proc" id="lista" role="list" aria-live="polite"></div>
    <p class="msg-erro" id="erro" role="alert"></p>
  </section>
  <p class="rodape">Aqui aparece o que a clínica fez nos últimos 30 dias. Cobertura, autorização e valor dependem do seu plano ou convênio: a nossa equipe confirma com você.</p>
  <button class="btn linha" id="naoAchei" type="button">Não achei o que procuro</button>
  <button class="btn sec" id="voltar" type="button">Voltar</button>`,'#busca');
  const carregar=async()=>{
    const box=$('#lista'),meu=++seqLista;box.innerHTML='<p class="sub">Buscando…</p>';
    const r=await rpc('pmarc_catalogo',{p_busca:$('#busca').value.trim()||null,p_tipo:E.tipo||null});
    if(meu!==seqLista)return;
    if(r.motivo==='desligado')return telaDesligado();
    if(r.ok===false||!r.itens){box.innerHTML='';return void($('#erro').textContent=erroRede)}
    $('#erro').textContent='';
    if(!r.itens.length){box.innerHTML='<p class="sub">Nada encontrado com esse nome. Tente outra palavra ou toque em “Não achei o que procuro”.</p>';return}
    E.lista=r.itens;
    box.innerHTML=r.itens.map((i,n)=>{const nm=nomeExame(i.nome);return`<button class="proc" type="button" role="listitem" data-i="${n}"><span class="tag${i.tipo==='consulta'?' c':''}">${i.tipo==='consulta'?'Consulta':i.tipo==='exame'?'Exame':'Outro'}</span><b>${esc(nm.titulo)}</b>${nm.detalhe?`<small>${esc(nm.detalhe)}</small>`:''}</button>`}).join('');
    box.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const i=E.lista[+b.dataset.i];E.pe={...E.pe,proc:{id:i.id,nome:i.nome,tipo:i.tipo,agenda:!!i.agenda},texto:undefined,horario:undefined};telaQuando()});
  };
  app.querySelectorAll('button[data-tipo]').forEach(b=>b.onclick=()=>{E.tipo=b.dataset.tipo;app.querySelectorAll('button[data-tipo]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));carregar()});
  $('#busca').addEventListener('input',()=>{clearTimeout(tBusca);tBusca=setTimeout(carregar,350)});
  $('#naoAchei').onclick=()=>telaTextoLivre();
  $('#voltar').onclick=()=>voltarDaqui();
  carregar();
}
/* Não achou na lista: descreve com as próprias palavras (vale como pedido) */
function telaTextoLivre(){
  mostrar(`<h1>O que você procura?</h1>${avisoHtml()}
  <form class="card" id="fLivre" novalidate>
    <label for="livre">Escreva o exame, a consulta ou o assunto</label><input id="livre" maxlength="200" value="${esc((E.pe&&E.pe.texto)||'')}" placeholder="Ex.: exame de sangue, consulta com cardiologista">
    <p class="msg-erro" id="erro" role="alert"></p>
    <button class="btn" type="submit">Continuar</button>
    <button class="btn sec" id="voltar" type="button">Voltar</button>

  $('#fLivre').onsubmit=ev=>{ev.preventDefault();const t=$('#livre').value.trim();if(!t)return void($('#erro').textContent='Escreva o que você procura.');E.pe={...E.pe,proc:null,texto:t,horario:undefined};telaQuando()};
}
/* Passo 2: quando? (turno, a partir de, até, até o dia, unidade) — ou nada */
function telaQuando(){
  const pe=E.pe,nome=pe.proc?nomeExame(pe.proc.nome).titulo:pe.texto,semAgenda=!pe.proc||!pe.proc.agenda;
  mostrar(`<h1>Quando você prefere?</h1>
  <p class="sub"><b>${esc(nome)}</b> · <a href="#" id="trocar">trocar</a></p>
  ${avisoHtml()}
  <form class="card" id="fQuando" novalidate>

    <label for="plano">Seu plano ou convênio <span class="opc">(se souber)</span></label><input id="plano" maxlength="80" autocomplete="off" value="${esc(pe.plano||'')}" placeholder="Ex.: particular, nome do convênio">
    <p class="sub" style="margin-top:12px">${semAgenda?'Para este item a nossa equipe olha a agenda e fala com você. Se quiser, diga quando prefere.':'Não precisa escolher nada: é só tocar em “Ver a disponibilidade”.'} Cobertura, autorização e valor dependem do plano: a equipe confirma.</p>
    <p class="msg-erro" id="erro" role="alert"></p>
    ${semAgenda?'':'<button class="btn" type="submit">Ver a disponibilidade</button>'}
    <button class="btn ${semAgenda?'':'linha'}" id="pedirJa" type="button">${semAgenda?'Pedir para a equipe':'Pedir para a equipe sem ver os horários'}</button>
    <button class="btn sec" id="voltar" type="button">Voltar</button>
  </form>`);
  const ler=()=>{pe.apos=$('#apos').value||undefined;pe.ate=$('#ate').value||undefined;pe.dia=$('#dia').value||undefined;pe.unid=$('#unid').value||undefined;pe.plano=$('#plano').value.trim()||undefined};
  app.querySelectorAll('button[data-turno]').forEach(b=>b.onclick=()=>{pe.turno=b.dataset.turno;app.querySelectorAll('button[data-turno]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  $('#trocar').onclick=ev=>{ev.preventDefault();telaPedidoExame()};
  $('#voltar').onclick=()=>telaPedidoExame();
  $('#pedirJa').onclick=()=>{ler();pe.horario=undefined;enviarPedido()};
  $('#fQuando').onsubmit=ev=>{ev.preventDefault();ler();
    if(pe.apos&&pe.ate&&pe.ate<pe.apos)return void($('#erro').textContent='O horário “até” precisa ser depois do “a partir das”.');
    verDisponibilidade()};
}
/* Passo 3: a disponibilidade prevista */
async function verDisponibilidade(){
  const pe=E.pe;mostrar('<p class="sub">Consultando a agenda…</p>');
  const r=await rpc('pmarc_disponibilidade',{p_procedimento:pe.proc.id,p_dados:{turno:pe.turno||'qualquer',hora_apos:pe.apos,hora_ate:pe.ate,data_ate:pe.dia,unidade:pe.unid}});
  if(r.motivo==='desligado')return telaDesligado();
  if(r.ok!==true){
    const msg=r.motivo==='muitos'?'Muita gente consultando agora. Tente de novo em instantes.':erroRede;
    return mostrar(`<div class="card"><p>${esc(msg)}</p><button class="btn" id="tentar" type="button">Tentar de novo</button><button class="btn sec" id="voltar" type="button">Voltar</button></div>`),$('#tentar').onclick=verDisponibilidade,$('#voltar').onclick=telaQuando;
  }
  telaDisponibilidade(r);
}
function filtrosTexto(pe){
  const f=[];if(pe.turno&&pe.turno!=='qualquer')f.push('turno: '+NOME_TURNO[pe.turno]);if(pe.apos)f.push('a partir das '+pe.apos);if(pe.ate)f.push('até as '+pe.ate);
  if(pe.dia)f.push('até '+pe.dia.split('-').reverse().join('/'));if(pe.unid)f.push(UNID[pe.unid]||pe.unid);
  return f.length?f.join(' · '):'sem preferência (todos os horários)';
}
function telaDisponibilidade(r){
  const pe=E.pe,sel=pe.horario,dias=r.dias||[];
  const chave=(d,s)=>d+'|'+s.hora+'|'+(s.unidade||'')+'|'+(s.profissional||'');
  mostrar(`<h1>Disponibilidade prevista</h1>
  <p class="sub"><b>${esc(nomeExame(pe.proc.nome).titulo)}</b></p><p class="resumo-f">Seu pedido: ${esc(filtrosTexto(pe))} · <a href="#" id="mudar">mudar</a></p>
  <div class="aviso" role="note"><b>Previsão</b>${esc(r.aviso||'Estes horários são uma PREVISÃO e ainda serão confirmados pela nossa equipe.')}</div>
  <section class="card" aria-label="Horários previstos">${dias.length?dias.map(d=>`<div class="dia-h">${esc(diaFmt(d.data))}</div><div class="chips">${d.slots.map(s=>`<button class="chip" type="button" data-k="${esc(chave(d.data,s))}" data-d="${esc(d.data)}" aria-pressed="${!!sel&&chave(sel.data,sel)===chave(d.data,s)}" title="${esc([UNID[s.unidade]||s.unidade,s.profissional].filter(Boolean).join(' · '))}">${esc(s.hora)}${s.unidade?`<small style="display:block;font-weight:400;font-size:.7rem">${esc(UNID[s.unidade]||s.unidade)}</small>`:''}</button>`).join('')}</div>`).join('')
    :'<p class="sub">Não achamos horário previsto com essa escolha. Você pode mudar o turno ou os horários — ou pedir assim mesmo, e a equipe procura para você.</p>'}
    ${r.total>dias.reduce((n,d)=>n+d.slots.length,0)?`<p class="rodape">Mostrando os primeiros horários (${r.total} no total na janela até ${esc(String(r.ate).split('-').reverse().join('/'))}). Use os filtros para ver outros.</p>`:''}
  </section>
  ${dias.length?'<p class="sub">Se quiser, toque em um horário para a equipe saber qual você viu. Não é obrigatório.</p>':''}
  <p class="msg-erro" id="erro" role="alert"></p>
  <button class="btn" id="pedir" type="button">Pedir esta previsão para a equipe</button>
  <button class="btn linha" id="mudar2" type="button">Mudar quando</button>
  <button class="btn sec" id="outro" type="button">Escolher outro exame ou consulta</button>`);
  app.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,ja=pe.horario&&chave(pe.horario.data,pe.horario)===k;
    app.querySelectorAll('button[data-k]').forEach(x=>x.setAttribute('aria-pressed','false'));
    if(ja){pe.horario=undefined;return}
    const [data,hora,unidade,profissional]=k.split('|');pe.horario={data,hora,unidade:unidade||undefined,profissional:profissional||undefined};b.setAttribute('aria-pressed','true');
  });
  $('#mudar').onclick=ev=>{ev.preventDefault();telaQuando()};$('#mudar2').onclick=telaQuando;$('#outro').onclick=()=>telaPedidoExame();
  $('#pedir').onclick=()=>enviarPedido();
}
/* Enviar o pedido à equipe (quem não tem link deixa nome e celular antes; nada barra) */
function dadosPedido(){
  const pe=E.pe;
  return{procedimento_id:pe.proc?pe.proc.id:undefined,procedimento_texto:pe.proc?undefined:pe.texto,turno:pe.turno&&pe.turno!=='qualquer'?pe.turno:undefined,hora_apos:pe.apos,hora_ate:pe.ate,data_ate:pe.dia,unidade:pe.unid,plano:pe.plano,horario:pe.horario};
}
async function enviarPedido(){
  if(!E.codigo)return telaIdentPedido();
  const botoes=app.querySelectorAll('button');botoes.forEach(b=>b.disabled=true);
  const x=await rpc('pmarc_pedido',{p_codigo:E.codigo,p_dados:dadosPedido()});
  botoes.forEach(b=>b.disabled=false);
  const er=$('#erro');
  if(x.motivo==='desligado')return telaDesligado();
  if(x.motivo==='codigo_invalido'){guardar('pmarc.codigo',null);E.codigo=null;return telaIdentPedido()}
  if(x.motivo==='muitos'){const m='Você já enviou vários pedidos agora. Espere um pouco ou escreva para a equipe.';return void(er?er.textContent=m:alert(m))}
  if(x.ok===false||x.motivo==='rede'){return void(er?er.textContent=erroRede:alert(erroRede))}
  E.v=x;
  if(x.sem_celular)return telaCelularPedido();
  telaPedidoEnviado();
}
function telaPedidoEnviado(){
  parar();E.pe={};E.tipo='';
  mostrar(`<h1>Pedido enviado</h1>${avisoHtml()}
  <section class="card"><p class="ok-linha">✓ A nossa equipe recebeu o seu pedido de previsão.</p><p class="sub">${esc((E.v&&E.v.final)||'A previsão vai ser vista e confirmada pela nossa equipe pelo webchat, pelo WhatsApp e por telefone.')}</p></section>
  <button class="btn" id="conversa" type="button">Falar com a equipe</button>
  <button class="btn linha" id="outro" type="button">Pedir outra previsão</button>`);
  $('#conversa').onclick=()=>telaConversa();$('#outro').onclick=()=>telaPedidoExame(()=>telaConversa());
}
/* Sem link: nome e celular (nada é obrigatório além do celular, para a equipe responder) */
function telaIdentPedido(msg){
  parar();
  mostrar(`<h1>Para a equipe responder</h1>${avisoHtml()}
  <form class="card" id="fId" novalidate>
    ${msg?`<p class="sub" role="status">${esc(msg)}</p>`:'<p class="sub">Deixe o seu celular. O resto é opcional.</p>'}
    <label for="i-nome">Seu nome <span class="opc">(se quiser)</span></label><input id="i-nome" autocomplete="name">
    <label for="i-cel">Celular com DDD</label><input id="i-cel" inputmode="tel" autocomplete="tel-national" placeholder="(71) 90000-0000">
    <label for="i-nasc">Data de nascimento <span class="opc">(se quiser)</span></label><input id="i-nasc" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10">
    <p class="msg-erro" id="erro" role="alert"></p>
    <button class="btn" type="submit">Enviar o pedido</button>
    <button class="btn sec" id="voltar" type="button">Voltar</button>
  </form>`,'#i-nome');
  $('#i-cel').addEventListener('input',e=>{e.target.value=fmtTel(e.target.value)});
  $('#i-nasc').addEventListener('input',e=>{const d=digits(e.target.value).slice(0,8);e.target.value=d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d});
  $('#voltar').onclick=()=>E.pe&&E.pe.proc?telaQuando():telaPedidoExame();
  $('#fId').onsubmit=async ev=>{
    ev.preventDefault();const cel=digits($('#i-cel').value),er=$('#erro'),b=$('#fId button[type=submit]');
    if(cel.length<10)return void(er.textContent='Precisamos do celular com DDD para a equipe poder responder.');
    b.disabled=true;er.textContent='';
    const r=await rpc('pmarc_novo',{p_nome:$('#i-nome').value,p_celular:cel,p_nascimento:dataIso($('#i-nasc').value)||null,p_texto:null});
    b.disabled=false;
    if(r.motivo==='rede')return void(er.textContent=erroRede);
    if(r.motivo==='desligado')return telaDesligado();
    if(r.motivo==='celular_invalido')return void(er.textContent='Confira o celular: precisa do DDD e dos números.');
    if(r.motivo==='muitos')return void(er.textContent='Muita gente está enviando agora. Tente de novo em alguns minutos.');
    if(!r.ok)return void(er.textContent=erroRede);
    guardar('pmarc.codigo',r.codigo);E.codigo=r.codigo;E.v=r;
    enviarPedido();
  };
}
/* Quem tem o link mas nunca teve celular no cadastro: o pedido ficou guardado, falta o número para abrir a conversa */
function telaCelularPedido(){
  parar();
  mostrar(`<h1>Qual o seu celular?</h1>${avisoHtml()}
  <form class="card" id="fCel" novalidate><p class="sub">Guardamos o seu pedido. A equipe precisa do número para responder a você.</p>
  <label for="c-cel">Celular com DDD</label><input id="c-cel" inputmode="tel" autocomplete="tel-national" placeholder="(71) 90000-0000">
  <p class="msg-erro" id="erro" role="alert"></p><button class="btn" type="submit">Enviar</button></form>`,'#c-cel');
  $('#c-cel').addEventListener('input',e=>{e.target.value=fmtTel(e.target.value)});
  $('#fCel').onsubmit=async ev=>{
    ev.preventDefault();const cel=digits($('#c-cel').value),er=$('#erro');
    if(cel.length<10)return void(er.textContent='Digite o celular com DDD.');
    const x=await rpc('pmarc_responder',{p_codigo:E.codigo,p_dados:{celular:cel}});
    if(x.motivo==='rede'||x.ok===false||x.sem_celular)return void(er.textContent=x.sem_celular?'Confira o celular.':erroRede);
    E.v=x;const y=await rpc('pmarc_pedido',{p_codigo:E.codigo,p_dados:dadosPedido()});
    if(y.ok!==false)E.v=y;telaPedidoEnviado();
  };
}

/* ===== Início ===== */
(function iniciar(){
  const url=new URL(location.href);
  const c=(url.searchParams.get('c')||'').trim();
  if(/^[A-Za-z0-9]{10,40}$/.test(c))return abrir(c);
  const g=ler('pmarc.codigo');
  if(g&&/^[A-Za-z0-9]{10,40}$/.test(g))return abrir(g);
  telaAchar();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&E.timer)atualizarMsgs(false)});
</script>
