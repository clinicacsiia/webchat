<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atendimento</title>
<meta name="theme-color" content="#10302B">
<meta name="description" content="Fale com a nossa equipe de atendimento.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --verde-escuro: #10302b;
    --verde: #146b50;
    --verde-claro: #d4efdd;
    --fundo: #e8efea;
    --papel: #ffffff;
    --texto: #16231f;
    --texto-suave: #5b6b65;
    --linha: #cfdad3;
    --erro: #b3261e;
    --aviso: #8a5a00;
    --raio: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.4; color: var(--texto); background: var(--fundo);
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #2f9e78; outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app { height: 100dvh; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; background: var(--fundo); position: relative; }
  @media (min-width: 800px) { .app { border-left: 1px solid var(--linha); border-right: 1px solid var(--linha); } }

  /* Cabeçalho */
  .topo {
    background: var(--verde-escuro); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 12px 10px 14px;
    display: flex; align-items: center; gap: 12px; flex: none;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: var(--verde); display: grid; place-items: center;
    font-weight: 700; font-size: 18px; flex: none;
  }
  .topo-info { flex: 1; min-width: 0; }
  .topo-nome { font-weight: 650; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topo-status { font-size: 13px; opacity: .85; display: flex; align-items: center; gap: 6px; }
  .ponto { width: 8px; height: 8px; border-radius: 50%; background: #9aa9a3; flex: none; }
  .ponto.aguardando { background: #f2b84b; }
  .ponto.atendendo { background: #4ade80; }
  .btn-menu {
    background: transparent; border: 0; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 22px; line-height: 1;
  }
  .btn-menu:hover { background: rgba(255,255,255,.12); }
  .menu {
    position: absolute; right: 10px; top: calc(58px + env(safe-area-inset-top)); background: var(--papel); border: 1px solid var(--linha);
    border-radius: 12px; box-shadow: 0 8px 24px rgba(16,48,43,.18); z-index: 20; min-width: 190px; overflow: hidden;
  }
  .menu button { display: block; width: 100%; text-align: left; padding: 13px 16px; background: none; border: 0; cursor: pointer; }
  .menu button:hover { background: #f1f6f3; }

  /* Formulário inicial */
  .inicio { flex: 1; overflow-y: auto; padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); }
  .inicio h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 6px; }
  .inicio p.sub { margin: 0 0 18px; color: var(--texto-suave); }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; }
  .campo .opc { font-weight: 400; color: var(--texto-suave); }
  .campo input[type=text], .campo input[type=tel], .campo input[type=email], .campo textarea {
    width: 100%; padding: 12px 13px; border: 1.5px solid var(--linha); border-radius: 10px; background: var(--papel);
  }
  .campo input:focus, .campo textarea:focus { border-color: var(--verde); outline: none; box-shadow: 0 0 0 3px rgba(20,107,80,.18); }
  .campo textarea { min-height: 92px; resize: vertical; }
  .campo select { width: 100%; padding: 12px 12px; font: inherit; border: 1.5px solid var(--linha); border-radius: 12px; background: var(--papel); color: inherit; }
  .campo select:focus { border-color: var(--verde); outline: none; box-shadow: 0 0 0 3px rgba(20,107,80,.18); }
  .unidades { display: grid; gap: 8px; }
  .unidade { text-align: left; border: 1.5px solid var(--linha); background: var(--papel); border-radius: 12px; padding: 11px 14px; cursor: pointer; font: inherit; color: inherit; }
  .unidade strong { display: block; font-size: 15px; }
  .unidade span { display: block; font-size: 13px; color: var(--texto-suave); margin-top: 1px; }
  .unidade[aria-checked="true"] { border-color: var(--verde); background: var(--verde-claro); box-shadow: 0 0 0 2px rgba(20,107,80,.18); }
  .aceite { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--texto-suave); margin: 4px 0 18px; }
  .aceite input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--verde); flex: none; }
  .btn-primario {
    width: 100%; background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 650; font-size: 16px; cursor: pointer;
  }
  .btn-primario:hover { background: #0f5a42; }
  .btn-primario:disabled { opacity: .6; cursor: default; }
  .erro-form { color: var(--erro); font-size: 14px; margin: 0 0 12px; min-height: 0; }

  /* Conversa */
  .msgs { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 4px; overscroll-behavior: contain; }
  .dia { align-self: center; background: rgba(16,48,43,.1); color: var(--texto-suave); font-size: 12px; padding: 3px 11px; border-radius: 999px; margin: 10px 0 6px; }
  .msg { max-width: 82%; padding: 8px 11px 6px; border-radius: var(--raio); background: var(--papel); box-shadow: 0 1px 1px rgba(16,48,43,.08); word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.agente { align-self: flex-start; border-top-left-radius: 4px; }
  .msg.cliente { align-self: flex-end; background: var(--verde-claro); border-top-right-radius: 4px; }
  .msg.pendente { opacity: .6; }
  .msg .quem { display: block; font-size: 12.5px; font-weight: 650; color: var(--verde); margin-bottom: 2px; }
  .msg .hora { display: block; text-align: right; font-size: 11px; color: var(--texto-suave); margin-top: 2px; white-space: normal; }
  .msg a { color: #0b5cad; }
  .msg.sistema { align-self: center; background: rgba(16,48,43,.08); box-shadow: none; color: var(--texto-suave); font-size: 13px; text-align: center; max-width: 90%; padding: 5px 12px; }
  .msg.sistema .hora { display: none; }
  .boas-vindas { align-self: center; max-width: 88%; text-align: center; color: var(--texto-suave); font-size: 14px; margin: 6px 0 10px; }

  .compor { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #f4f8f5; border-top: 1px solid var(--linha); }
  .compor textarea {
    flex: 1; resize: none; border: 1.5px solid var(--linha); border-radius: 22px; padding: 11px 16px; max-height: 140px; min-height: 44px; background: var(--papel); line-height: 1.35;
  }
  .compor textarea:focus { outline: none; border-color: var(--verde); }
  .btn-enviar { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--verde); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
  .btn-enviar:hover { background: #0f5a42; }
  .btn-enviar:disabled { opacity: .5; cursor: default; }
  .btn-enviar svg { width: 22px; height: 22px; fill: currentColor; }

  .aviso-encerrado { background: #fff7e5; color: var(--aviso); text-align: center; font-size: 13.5px; padding: 8px 12px; border-top: 1px solid #f0dfb8; flex: none; }

  .toast {
    position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2b2f2e; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); text-align: center;
  }

  /* Widgets dentro das mensagens */
  .widget { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--linha); white-space: normal; }
  .widget .w-titulo { font-weight: 650; font-size: 14px; margin: 0 0 6px; }
  .widget fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .widget .w-op { display: flex; gap: 10px; align-items: center; padding: 9px 4px; border-radius: 8px; cursor: pointer; }
  .widget .w-op:hover { background: #f1f6f3; }
  .widget .w-op input { width: 20px; height: 20px; accent-color: var(--verde); flex: none; }
  .widget .w-outro { width: 100%; margin: 4px 0 8px; padding: 10px 12px; border: 1.5px solid var(--linha); border-radius: 10px; background: var(--papel); }
  .widget .w-outro:focus { border-color: var(--verde); outline: none; }
  .btn-w { background: var(--verde); color: #fff; border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 650; cursor: pointer; }
  .btn-w:hover { background: #0f5a42; }
  .btn-w:disabled { opacity: .5; cursor: default; }
  .btn-w.sec { background: var(--papel); color: var(--verde); border: 1.5px solid var(--verde); }
  .widget.respondido { opacity: .6; }
  .widget .w-nota { font-size: 12.5px; color: var(--texto-suave); margin: 6px 0 0; }

  /* Folha (modal em tela cheia no celular) */
  .folha { position: fixed; inset: 0; background: rgba(16,48,43,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .folha-caixa { background: var(--fundo); width: 100%; max-width: 760px; height: min(100dvh, 880px); display: flex; flex-direction: column; border-radius: 16px 16px 0 0; overflow: hidden; }
  @media (min-width: 800px) { .folha { align-items: center; } .folha-caixa { height: min(92dvh, 860px); border-radius: 16px; } }
  .folha-topo { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--verde-escuro); color: #fff; flex: none; }
  .folha-topo h2 { flex: 1; margin: 0; font-size: 17px; line-height: 1.25; }
  .folha-fechar { background: transparent; border: 0; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer; }
  .folha-fechar:hover { background: rgba(255,255,255,.14); }
  .folha-corpo { flex: 1; overflow-y: auto; padding: 14px; overscroll-behavior: contain; }
  .folha-rodape { flex: none; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #f4f8f5; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 8px; }
  .folha-rodape .linha { display: flex; gap: 8px; flex-wrap: wrap; }
  .folha-rodape .linha > * { flex: 1; min-width: 130px; }
  .p-dica { font-size: 13.5px; color: var(--texto-suave); margin: 0 0 10px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .chip { border: 1.5px solid var(--linha); background: var(--papel); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .chip[aria-pressed="true"], .chip.ativo { background: var(--verde); border-color: var(--verde); color: #fff; }
  .chip:disabled { opacity: .45; cursor: default; }

  /* Mapa do corpo */
  .corpo-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .corpo-svg { width: min(100%, 300px); height: auto; touch-action: manipulation; }
  .corpo-svg .parte { fill: #dfe9e3; stroke: #7d9a8e; stroke-width: 1.4; cursor: pointer; transition: fill .12s; }
  .corpo-svg .parte:hover { fill: #bfe3cf; }
  .corpo-svg .parte:focus-visible { outline: none; stroke: #0b5cad; stroke-width: 3; }
  .corpo-svg .parte.sel { fill: var(--verde); stroke: #0f5a42; }
  .corpo-svg .parte.off { fill: #eef1ef; stroke: #c6cfca; cursor: not-allowed; stroke-dasharray: 3 2; }
  .corpo-svg text { font-size: 11px; fill: #3b4b45; pointer-events: none; font-weight: 700; }
  .corpo-svg text.letra { fill: #fff; font-size: 12px; }
  .corpo-cap { font-size: 12.5px; color: var(--texto-suave); text-align: center; max-width: 320px; margin: 0; }
  .sel-lista { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--verde-claro); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 14px; }
  .tag button { border: 0; background: rgba(16,48,43,.12); border-radius: 50%; width: 24px; height: 24px; cursor: pointer; line-height: 1; }
  .alt-lista { border: 1px solid var(--linha); border-radius: 12px; background: var(--papel); padding: 8px 12px; margin: 10px 0; }
  .alt-lista summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .alt-grid { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 8px; align-items: center; margin-top: 8px; }
  .alt-grid .nome { font-size: 14px; }
  .bloco { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; }
  .bloco h3 { margin: 0 0 6px; font-size: 15px; }
  .bloco .w-op { padding: 8px 2px; }
  .carrinho { background: #fff7e5; border: 1px solid #f0dfb8; border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; }
  .carrinho h3 { margin: 0 0 6px; font-size: 14px; color: var(--aviso); }
  .carrinho li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; font-size: 14px; }
  .carrinho ul { list-style: none; margin: 0; padding: 0; }
  .carrinho li span { flex: 1; }
  .carrinho button { border: 0; background: rgba(16,48,43,.12); border-radius: 50%; width: 24px; height: 24px; cursor: pointer; flex: none; }

  /* Calendário */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
  .cal-nav strong { font-size: 16px; }
  .cal-nav button { border: 1.5px solid var(--linha); background: var(--papel); border-radius: 10px; width: 42px; height: 38px; font-size: 20px; cursor: pointer; }
  .cal-nav button:disabled { opacity: .4; cursor: default; }
  .cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grade .sem { text-align: center; font-size: 12px; color: var(--texto-suave); padding: 2px 0; font-weight: 700; }
  .cal-dia { aspect-ratio: 1 / 1; min-height: 40px; border: 1.5px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; font-size: 15px; position: relative; padding: 0; }
  .cal-dia.livre { background: var(--papel); border-color: var(--linha); font-weight: 650; }
  .cal-dia.livre::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--verde); }
  .cal-dia.lotado { color: #a5b0ab; text-decoration: line-through; cursor: not-allowed; }
  .cal-dia.fechado { color: #c2cac6; cursor: not-allowed; }
  .cal-dia.hoje { box-shadow: inset 0 0 0 2px #2f9e78; }
  .cal-dia.sel { background: var(--verde); color: #fff; border-color: var(--verde); }
  .cal-dia.sel::after { background: #fff; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-top: 8px; }
  .slot { border: 1.5px solid var(--verde); background: var(--papel); color: var(--verde); border-radius: 10px; padding: 9px 4px; font-weight: 650; cursor: pointer; }
  .slot:hover { background: #eef8f2; }
  .slot.sel { background: var(--verde); color: #fff; }
  .slot.off { border-color: var(--linha); color: #aeb8b3; background: #f1f4f2; text-decoration: line-through; cursor: not-allowed; }
  .slot.chegada { grid-column: 1 / -1; }
  .legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--texto-suave); margin: 10px 0 0; }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .aviso-cal { background: #fff7e5; border: 1px solid #f0dfb8; color: var(--aviso); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin: 0 0 10px; }
  .carregando { padding: 28px 8px; text-align: center; color: var(--texto-suave); }
  @media (prefers-reduced-motion: no-preference) { .msg { animation: entra .16s ease-out; } @keyframes entra { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topo">
    <div class="avatar" id="avatar" aria-hidden="true">A</div>
    <div class="topo-info">
      <div class="topo-nome" id="empresa">Atendimento</div>
      <div class="topo-status"><span class="ponto" id="ponto"></span><span id="status">Online</span></div>
    </div>
    <button class="btn-menu" id="btnMenu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" hidden>&#8942;</button>
  </header>
  <div class="menu" id="menu" hidden>
    <button type="button" id="btnNova">Iniciar nova conversa</button>
  </div>

  <!-- Tela 1: dados iniciais -->
  <section class="inicio" id="telaInicio" hidden>
    <h1>Como podemos ajudar?</h1>
    <p class="sub" id="boasVindasForm">Preencha seus dados e conte o que você precisa. Respondemos aqui mesmo, na hora.</p>
    <form id="formInicio" novalidate>
      <div class="campo" id="blocoUnidade" hidden>
        <label id="lUnidade">Em qual unidade você quer ser atendido?</label>
        <div class="unidades" id="fUnidades" role="radiogroup" aria-labelledby="lUnidade"></div>
      </div>
      <div class="campo" id="blocoMedico" hidden>
        <label for="fMedico">Tem médico de preferência? <span class="opc">(opcional)</span></label>
        <select id="fMedico"></select>
      </div>
      <div class="campo">
        <label for="fNome">Seu nome</label>
        <input type="text" id="fNome" autocomplete="name" maxlength="120" required>
      </div>
      <div class="campo">
        <label for="fTel">Telefone com DDD</label>
        <input type="tel" id="fTel" inputmode="tel" autocomplete="tel-national" placeholder="(71) 99999-9999" maxlength="16" required>
      </div>
      <div class="campo">
        <label for="fEmail">E-mail <span class="opc">(opcional)</span></label>
        <input type="email" id="fEmail" autocomplete="email" maxlength="200">
      </div>
      <div class="campo">
        <label for="fMsg">Sua mensagem</label>
        <textarea id="fMsg" maxlength="4000" placeholder="Escreva aqui sua dúvida ou o que você precisa"></textarea>
      </div>
      <label class="aceite">
        <input type="checkbox" id="fAceite">
        <span>Concordo que a empresa guarde meu nome, telefone e a conversa para me atender e entrar em contato (LGPD).</span>
      </label>
      <p class="erro-form" id="erroForm" role="alert"></p>
      <button class="btn-primario" id="btnIniciar" type="submit">Iniciar conversa</button>
    </form>
  </section>

  <!-- Tela 2: conversa -->
  <section id="telaChat" style="display:contents" hidden>
    <main class="msgs" id="msgs" aria-live="polite" aria-label="Mensagens"></main>
    <div class="aviso-encerrado" id="avisoEncerrado" hidden>Atendimento encerrado. Envie uma mensagem para abrir de novo.</div>
    <form class="compor" id="formEnviar">
      <textarea id="texto" rows="1" maxlength="4000" placeholder="Digite uma mensagem" aria-label="Mensagem"></textarea>
      <button class="btn-enviar" id="btnEnviar" type="submit" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>
      </button>
    </form>
  </section>
</div>
<div class="folha" id="folha" hidden>
  <div class="folha-caixa" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo">
    <header class="folha-topo"><h2 id="folhaTitulo"></h2><button type="button" class="folha-fechar" id="folhaFechar" aria-label="Fechar">&times;</button></header>
    <div class="folha-corpo" id="folhaCorpo"></div>
    <footer class="folha-rodape" id="folhaRodape"></footer>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    for (let i = 0; i < primeiroDow; i++) grade.append(h('div', {}));
    for (let d = 1; d <= qtd; d++) {
      const dt = new Date(mes.getFullYear(), mes.getMonth(), d), s = ymd(dt), slots = dias.get(s) || [];
      const dentro = s >= hojeS && s <= limite, temJanela = dentro && r.janelas && r.janelas[String(dt.getDay())];
      const estado = slots.length ? 'livre' : (temJanela ? 'lotado' : 'fechado');
      const rotulo = `${d} de ${MESES[dt.getMonth()]}, ${DIAS_SEMANA[dt.getDay()]}: ` + (slots.length ? `${slots.length} horários` : (temJanela ? 'sem horários livres' : 'sem atendimento'));
      grade.append(h('button', { type: 'button', class: `cal-dia ${estado}${s === hojeS ? ' hoje' : ''}${C.dia === s ? ' sel' : ''}`, disabled: !slots.length,
        'aria-label': rotulo, 'aria-pressed': String(C.dia === s), onclick: () => { C.dia = s; C.slot = null; desenharCalendario(); } }, String(d)));
    }
    corpo.append(grade);
    corpo.append(h('div', { class: 'legenda' }, h('span', {}, h('i', { style: 'background:var(--verde)' }), 'Com horário livre'), h('span', {}, h('i', { style: 'background:#c2cac6' }), 'Lotado ou sem atendimento')));

    if (C.dia) {
      const dt = dataLocal(C.dia), slots = dias.get(C.dia) || [];
      corpo.append(h('h3', { style: 'margin:14px 0 4px;font-size:15px' }, `${DIAS_SEMANA[dt.getDay()]}, ${dt.getDate()} de ${MESES[dt.getMonth()]}`));
      const janela = r.janelas && r.janelas[String(dt.getDay())];
      const grid = h('div', { class: 'slots' });
      const normais = slots.filter((x) => !x.chegada), chegada = slots.filter((x) => x.chegada);
      const botao = (x) => h('button', { type: 'button', class: 'slot' + (C.slot && C.slot.hora === x.hora ? ' sel' : ''), 'aria-pressed': String(!!C.slot && C.slot.hora === x.hora),
        onclick: () => { C.slot = x; desenharCalendario(); } }, x.hora);
      if (janela && normais.length) {
        const ini = minutos(janela.ini), fim = minutos(janela.fim);
        for (let t = Math.floor(ini / 30) * 30; t < fim; t += 30) {
          const doBloco = normais.filter((x) => minutos(x.hora) >= t && minutos(x.hora) < t + 30);
          if (doBloco.length) doBloco.forEach((x) => grid.append(botao(x)));
          else if (t + 30 > ini) grid.append(h('button', { type: 'button', class: 'slot off', disabled: true, 'aria-label': hhmm(Math.max(t, ini)) + ' indisponível' }, hhmm(Math.max(t, ini))));
        }
      } else normais.forEach((x) => grid.append(botao(x)));
      chegada.forEach((x) => grid.append(h('button', { type: 'button', class: 'slot chegada' + (C.slot && C.slot.hora === x.hora ? ' sel' : ''),
        onclick: () => { C.slot = x; desenharCalendario(); } }, `Ordem de chegada, a partir das ${x.hora}`)));
      corpo.append(grid, h('div', { class: 'legenda' }, h('span', {}, h('i', { style: 'background:var(--verde)' }), 'Livre'), h('span', {}, h('i', { style: 'background:#dfe4e1' }), 'Ocupado ou indisponível')));
    } else if (![...dias.values()].some((x) => x.length)) {
      corpo.append(h('p', { class: 'p-dica', style: 'margin-top:12px' }, 'Não há horários livres nos próximos dias com esses filtros. Tente outro período ou unidade, ou envie sua preferência por mensagem que o atendente procura para você.'));
    }
    const dt = C.dia ? dataLocal(C.dia) : null;
    rodape.append(h('button', { class: 'btn-w', type: 'button', disabled: !C.slot, onclick: confirmarHorario },
      C.slot ? `Escolher ${DIAS_SEMANA[dt.getDay()]}, ${dt.getDate()}/${String(dt.getMonth() + 1).padStart(2, '0')} às ${C.slot.hora}` : 'Escolha um horário'));
    corpo.scrollTop = rolagem;
  }
  async function trocarMedico() {
    try {
      const { error } = await db.rpc('chat_medico_limpar', { p_conversa: conv.id, p_token: conv.token });
      if (error) throw error;
      await carregarHorarios(false);
    } catch (e) { toast(mensagemErro(e)); }
  }
  async function confirmarHorario() {
    if (!C || !C.slot || !C.dia) return;
    $('#folhaRodape button').disabled = true;
    try {
      const { data, error } = await db.rpc('chat_horario_escolher', { p_conversa: conv.id, p_token: conv.token, p_grupo: C.grupo, p_data: C.dia, p_hora: C.slot.hora, p_unidade: C.slot.unidade || null });
      if (error) throw error;
      if (data && data.restantes > 0) { C.grupo += 1; C.mes = null; C.dia = null; toast('Horário guardado. Agora escolha o próximo.'); await carregarHorarios(true); }
      else { fecharFolha(); toast('Horário escolhido.'); carregar(); }
    } catch (e) { toast(mensagemErro(e)); await carregarHorarios(false); }
  }
  $('#folhaFechar').addEventListener('click', fecharFolha);
  $('#folha').addEventListener('click', (e) => { if (e.target.id === 'folha') fecharFolha(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#folha').hidden) fecharFolha(); });


  /* ---------- eventos ---------- */
  el.form.addEventListener('submit', iniciar);
  el.formEnviar.addEventListener('submit', enviar);
  el.fTel.addEventListener('input', () => { el.fTel.value = mascaraTel(el.fTel.value); });
  el.texto.addEventListener('input', autoAltura);
  el.texto.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover: hover)').matches) { e.preventDefault(); el.formEnviar.requestSubmit(); }
  });
  el.btnMenu.addEventListener('click', () => {
    el.menu.hidden = !el.menu.hidden; el.btnMenu.setAttribute('aria-expanded', String(!el.menu.hidden));
  });
  document.addEventListener('click', (e) => { if (!el.menu.hidden && !el.menu.contains(e.target) && e.target !== el.btnMenu) el.menu.hidden = true; });
  el.btnNova.addEventListener('click', novaConversa);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { naoLidas = 0; document.title = config.nome_empresa; carregar(); }
  });
  addEventListener('online', carregar);

  /* ---------- início ---------- */
  async function init() {
    try {
      const { data } = await db.rpc('chat_config');
      if (data) config = Object.assign(config, data);
    } catch {}
    document.title = config.nome_empresa;
    el.empresa.textContent = config.nome_empresa;
    el.avatar.textContent = (config.nome_empresa.trim()[0] || 'A').toUpperCase();
    if (config.boas_vindas) el.boasForm.textContent = config.boas_vindas;
    if (conv && conv.id && conv.token) abrirChat(); else mostrarForm();
  }
  init();

  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
