<!--
FLUXOGRAMA: entrada (celular + PIN de 4 dígitos; no primeiro acesso, cadastro único em 5 passos) -> validação (a página confere o formato; quem decide é o servidor: funções app_* do Supabase, supabase/acesso-rapido-paciente.sql) -> lógica (o aparelho guarda só um código de acesso e o primeiro nome; PIN, filhos, números de confiança e marcações ficam no banco; o PIN é pedido de novo depois de 5 minutos em segundo plano) -> saída (tela inicial com Eu / cada filho / Todos juntos; solicitações de marcação; quem confia em você)
Versão 3.5 — 23/11/2026 / Mudança: **CPF do filho opcional no cadastro** (a tela do CPF pede só o do responsável; supabase/acesso-filho-cpf-opcional.sql). Versão 3.4 — 23/11/2026 / Mudança: **data de nascimento digitada (DD/MM/AAAA, teclado numérico, barras automáticas) no lugar do calendário do celular** em todas as telas do cadastro (você, filhos, esqueci o PIN, conta antiga); e a conferência da data agora recusa dia que não existe (31/02 passava como 02/03). Versão 3.3 — 21/11/2026 / Mudança: a página passa a apontar o manifesto do app (../manifest.webmanifest, liberado na CSP com manifest-src 'self') e o ícone do iPhone: quem toca em "Adicionar à Tela de Início" aqui (no meio do PIN) ganha o app da CSI inteiro, e não um atalho preso ao /acesso/ que abria o chat fora do app; o convite automático do Chrome fica escondido aqui (o botão Instalar está no chat). Versão 3.2 — 17/11/2026 / Mudança: depois do PIN aparece na hora a tela grande "Bem-vindo(a), nome!" (cobre o teclado, a pessoa não digita o PIN de novo); a conferência do cadastro e o registro do acesso saem em paralelo e a espera pela posição caiu de 5 para 2,5 segundos (a entrada demorava). Versão 3.1 — 16/11/2026 / Mudança: **confirmação por e-mail** (supabase/acesso-codigo-email.sql, chave `app_codigo_email`, nasce desligada): celular novo (primeiro acesso) e "esqueci o PIN" passam por um código de 6 números enviado ao e-mail; quem não recebe (spam, e-mail errado, falha no envio, cadastro sem e-mail) pede o código à atendente, que o vê no painel (Pendências > Códigos). Telas novas c4e, c4c e esqc. Versão 3.0 — 15/11/2026 / Mudança: quem já tem PIN e entra pela conta antiga (e-mail e senha) agora tem as duas JUNTAS (`app_conta_antiga_unir`: senha + PIN, só se for a mesma pessoa; traz as conversas da conta); antes a sessão antiga era descartada sem ligar nada. Versão 2.9 — 15/11/2026 / Mudança: apagada a tela inicial do acesso rápido ("Quem vai ser atendido?", "Marcar pelo chat", "Deixar uma solicitação (sem chat)", "Suas solicitações"): era cópia do chat (o botão só abria o chat), a solicitação sem chat nunca foi usada (0 na produção) e o chat já tem "Meus dados" e "Sair"; depois do PIN a pessoa vai direto ao chat. Versão 2.8 — 15/11/2026 / Mudança: o botão "Meus dados" do chat (?ir=dados) abre direto em Meus dados quando o PIN dos últimos 30 minutos ainda vale (antes pedia o PIN de novo e caía na tela inicial); o site (acesso e Minha vez) deixou de mudar para o tema escuro do celular e segue sempre o visual claro do chat. Versão 2.7 — 15/11/2026 / Mudança: quem tem conta de e-mail E já criou o PIN pelo celular (cadastro separado, sem ligação com a conta) não cai mais em "Confira os seus dados": a página pergunta ao servidor se o celular já tem PIN (app_pre_cadastro, só leitura) e leva direto para digitar o PIN, tanto ao abrir pelo chat quanto ao tocar em Continuar. Versão 2.6 — 15/11/2026 / Mudança: visual do site (cabeçalho com a logo da CSI, cores e fonte do chat, tema escuro); CPF conferido na hora, com os dígitos verificadores, em todas as telas que pedem CPF; o que a pessoa já digitou no cadastro (nome, nascimento, filho, CPF, contato) não se perde ao voltar, ao trocar Sim/Não ou ao ser mandada de volta por um erro do servidor. Versão 2.5 — 15/11/2026 / Mudança: some o cartão "Falta pouco" da tela inicial e de Meus dados (o que falta só é pedido na entrada, com o PIN obrigatório). Versão 2.4 — 15/11/2026 / Mudança: PIN OBRIGATÓRIO (quando config.app_pin_obrigatorio = sim): o primeiro acesso pede também o CPF (só o que o banco ainda não sabe) antes do PIN, quem entra com cadastro incompleto é obrigado a completar antes de seguir, e cada entrada é registrada (aparelho e, com permissão, a posição) (supabase/acesso-rapido-pin-obrigatorio.sql). Versão 2.3 — 15/11/2026 / Mudança: filhos da conta antiga (lista do histórico para conferir), filho com o nome do responsável (é ela mesma ou confirma), filho repetido (supabase/acesso-rapido-filhos.sql). Versão 2.2 — 15/11/2026 / Mudança: cartão "Falta pouco" (CPF dela e dos filhos, e-mail) para TODO paciente (supabase/acesso-rapido-pendencias.sql). Versão 2.1 — 15/11/2026 / Mudança: quem tem conta antiga (e-mail e senha) entra uma última vez, confere os dados que já temos e cria o PIN (supabase/acesso-rapido-conta-antiga.sql); "Meus dados" mais claro. Versão 2.0 — 14/11/2026 / Mudança: ligado ao Supabase (versão 1 guardava tudo só no celular)
-->

<script>
'use strict';
/* ===== Servidor (Supabase) =====
   A chave abaixo é a PÚBLICA do projeto (a mesma do chat e do Minha vez). Quem protege os dados são as funções app_* do banco:
   as tabelas são fechadas e o PIN é conferido lá, nunca aqui. */
const SUPABASE_URL='https://nrvuynjwcgwpjdptkiay.supabase.co';
const SUPABASE_KEY='sb_publishable_e2GK1YGEj06STa_ESCevow_nvtATB-y';
async function rpc(nome,args,bearer){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`,{method:'POST',headers:Object.assign({'Content-Type':'application/json',apikey:SUPABASE_KEY},bearer?{Authorization:'Bearer '+bearer}:{}),body:JSON.stringify(args||{}),signal:ctl.signal});
    if(!r.ok)return{ok:false,erro:'rede',mensagem:'Não foi possível falar com a clínica agora. Tente de novo em instantes.'};
    return await r.json();
  }catch(e){return{ok:false,erro:'rede',mensagem:'Sem conexão. Confira a internet e tente de novo.'}}
  finally{clearTimeout(t)}
}

/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');
const fmtTel=d=>{d=digits(d).slice(0,11);if(d.length<=2)return d?'('+d:'';if(d.length<=7)return`(${d.slice(0,2)}) ${d.slice(2)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};
const telOk=d=>/^[1-9]{2}9\d{8}$/.test(digits(d));
const nomeOk=n=>{const t=String(n).trim();return t.length>=5&&/^[A-Za-zÀ-ÿ'.\- ]+$/.test(t)&&t.split(/\s+/).filter(x=>x.length>=2).length>=2};
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const dataOk=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T00:00:00');return !isNaN(d)&&v<=hoje()&&d.getFullYear()>=1900&&d.getFullYear()===+v.slice(0,4)&&d.getMonth()+1===+v.slice(5,7)&&d.getDate()===+v.slice(8,10)};   /* confere dia/mês de verdade: 31/02 não vira 02/03 */
const idade=v=>{const d=new Date(v+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
const fmtIdade=v=>{const a=idade(v);return a<1?'menos de 1 ano':a+(a===1?' ano':' anos')};
const fmtData=v=>v?String(v).slice(0,10).split('-').reverse().join('/'):'';
/* Data de nascimento digitada (DD/MM/AAAA, teclado numérico): o seletor de calendário do celular obriga a rolar ano por ano. Por dentro tudo continua AAAA-MM-DD. */
const maskData=v=>{const d=digits(v).slice(0,8);return d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d};
const brData=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?fmtData(v):String(v||'');
const isoData=v=>{v=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:''};
const campoData=(id,valor,extra)=>`<input id="${id}" ${extra||''} inputmode="numeric" maxlength="10" placeholder="DD/MM/AAAA" autocomplete="off" data-data value="${esc(brData(valor))}">`;
const DICA_DATA='<small class="sub">Digite só os números: dia, mês e ano (ex.: 15031988).</small>';
const mascaraCpf=v=>{const d=digits(v).slice(0,11);return d.replace(/(\d{3})(\d{1,3})?(\d{1,3})?(\d{1,2})?/,(m,a,b,c,e)=>a+(b?'.'+b:'')+(c?'.'+c:'')+(e?'-'+e:''))};
/* Mesma conta do banco (cpf_valido): 11 números, não todos iguais, e os dois dígitos verificadores. */
const cpfOk=c=>{const d=digits(c);if(d.length!==11||/^(\d)\1+$/.test(d))return false;let t=0;for(let i=0;i<9;i++)t+=+d[i]*(10-i);if((t*10)%11%10!==+d[9])return false;t=0;for(let i=0;i<10;i++)t+=+d[i]*(11-i);return(t*10)%11%10===+d[10]};
const MSG_CPF='Os números do CPF não conferem. Confira, por favor.';
const primeiro=n=>String(n||'').trim().split(/\s+/)[0];

/* ===== O que fica no celular: só o código do aparelho e o primeiro nome (para o "Olá"). Nada de dado de saúde. ===== */
const KEY='csi_acesso_v2';let mem=null;
const store={
  get(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):mem}catch(e){return mem}},
  set(v){mem=v;try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}},
  clear(){mem=null;try{localStorage.removeItem(KEY)}catch(e){}}
};
/* Veio do chat (?voltar=chat): depois do PIN, volta para lá. */
const VOLTAR_PARAM=new URLSearchParams(location.search).get('voltar');
const VOLTAR_CHAT=VOLTAR_PARAM==='chat'||VOLTAR_PARAM==='acompanhar';
/* ?ir=dados (botão "Meus dados" do chat): se o PIN dos últimos 30 minutos ainda vale, abre direto em Meus dados, sem pedir o PIN de novo. */
const IR_DADOS=new URLSearchParams(location.search).get('ir')==='dados';
/* voltar=chat leva ao chat; voltar=acompanhar leva ao "Acompanhe seus pedidos" (check-in), já logado */
/* Depois de entrar (PIN certo): com o PIN obrigatório, o cadastro tem de estar completo (CPF dela e dos filhos) antes de seguir; depois registra o acesso e vai ao destino. */
/* Tela grande de boas-vindas: aparece NA HORA em que o PIN é aceito e cobre o teclado, para a pessoa não achar que o PIN não entrou e digitar de novo. */
function bemVindo(){
  if($('#bv'))return;
  const st=store.get(),nome=(S.perfil&&primeiro(S.perfil.nome))||(st&&st.nome1)||'';
  const d=document.createElement('div');d.id='bv';d.className='bv';d.setAttribute('role','status');d.setAttribute('aria-live','polite');
  d.innerHTML=`<img src="../img/logo-csi-simbolo.svg" alt="" width="89" height="30"><h1>Bem-vindo(a)${nome?', '+esc(nome):''}!</h1><p>Abrindo o chat…</p><i aria-hidden="true"></i>`;
  document.body.appendChild(d);
}
function bemVindoOcultar(){const d=$('#bv');if(d)d.remove()}
addEventListener('pageshow',e=>{if(e.persisted)bemVindoOcultar()});   // voltou pelo histórico: não deixa a tela de boas-vindas presa
/* Depois de entrar (PIN certo): com o PIN obrigatório, o cadastro tem de estar completo (CPF dela e dos filhos) antes de seguir; depois registra o acesso e vai ao destino.
   A conferência do cadastro e o registro do acesso (com a posição) andam JUNTOS: antes eram em fila e a posição sozinha podia esperar 5 segundos. */
async function aposEntrar(evento){
  S.evento=evento||'login';
  bemVindo();
  const ev=S.evento;
  const [falta]=await Promise.all([
    S.porta&&S.porta.obrigatorio?exigirCompleto():Promise.resolve(false),
    registrarAcesso(ev)
  ]);
  S.evento=null;   // já registrado
  if(falta){bemVindoOcultar();return}
  await concluirEntrada();
}
async function exigirCompleto(){
  if(!S.dev)return false;
  const r=await rpc('app_pendencias',{p_token:S.dev});
  if(!r||!r.ok)return false;
  const falta=(r.pendencias||[]).filter(x=>!x.opcional);
  if(!falta.length)return false;
  S.completar=r.pendencias;go('completar');return true;
}
async function concluirEntrada(){
  if(S.evento){const ev=S.evento;S.evento=null;await registrarAcesso(ev)}
  if(S.soHome){S.soHome=false;bemVindoOcultar();go('dados');return}
  if(VOLTAR_PARAM==='acompanhar'){location.replace('../minha-vez/?acompanhar=1');return}
  if(VOLTAR_CHAT){location.replace('../');return}
  go('home');
}
/* A porta do chat: o servidor diz se o PIN é obrigatório e se a posição está ligada. Sem resposta em 3 s (ou função ainda não aplicada) tudo segue como antes. */
async function carregarPorta(){
  try{
    const r=await Promise.race([rpc('app_porta',{}),new Promise(ok=>setTimeout(()=>ok(null),3000))]);
    return r&&typeof r==='object'&&r.ativo!==undefined&&!r.erro?r:null;
  }catch(e){return null}
}
/* Posição (só se o servidor ligou e a pessoa permitir): espera no máximo 2,5 s (era 5 s) e nunca trava a entrada. */
function posicao(){
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);
    const t=setTimeout(()=>res(null),2500);
    try{navigator.geolocation.getCurrentPosition(p=>{clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,precisao:p.coords.accuracy})},e=>{clearTimeout(t);res(e&&e.code===1?{negado:true}:null)},{enableHighAccuracy:false,timeout:2300,maximumAge:600000})}catch(e){clearTimeout(t);res(null)}
  });
}
/* Cada entrada fica registrada (aparelho, horário, IP no servidor e a posição se permitida). O servidor responde se a pessoa está na clínica e se tem exame hoje; o chat usa isso para oferecer o check-in. */
async function registrarAcesso(evento){
  if(!S.porta||!S.dev)return;
  try{
    const local=S.porta.local?await posicao():null;
    const disp={agente:navigator.userAgent,idioma:navigator.language,fuso:(Intl.DateTimeFormat().resolvedOptions()||{}).timeZone||'',tela:screen.width+'x'+screen.height,plataforma:aparelho()};
    const r=await rpc('app_acesso_registrar',{p_token:S.dev,p_evento:evento,p_local:local,p_dispositivo:disp});
    if(r&&r.ok){try{sessionStorage.setItem('csi_presenca',JSON.stringify({na:r.na_clinica,ex:r.exames_hoje,t:Date.now()}))}catch(e){}}
  }catch(e){}
}

/* Chama o servidor com o código do aparelho e trata os avisos que valem para qualquer tela. Devolve a resposta, ou null se a tela já mudou. */
async function chamar(nome,args){
  if(S.busy)return null;
  ocupado(true);
  const r=await rpc(nome,Object.assign({p_token:S.dev},args||{}));
  ocupado(false);
  if(r.erro==='bloqueado'&&!r.segundos){S.unlocked=false;S.perfil=null;S.mode='unlock';S.buf='';go('pin');erro('Digite seu PIN para continuar.');return null}
  if(r.erro==='sessao'){store.clear();S.dev=null;S.perfil=null;S.unlocked=false;go('entrar');setTimeout(()=>erro(r.mensagem),0);return null}
  if(r.erro==='indisponivel'){S.perfil=null;go('indisp');return null}
  if(r.ok&&r.perfil)S.perfil=r.perfil;
  return r;
}
/* Pendências: o que falta no cadastro (CPF dela e dos filhos, e-mail). O servidor só lista o que falta: nunca devolve o que a clínica tem guardado. */
async function carregarPend(){
  if(!S.dev||!S.perfil)return;
  S.pend=[];   // evita chamar duas vezes enquanto espera
  const r=await rpc('app_pendencias',{p_token:S.dev});
  if(r&&r.ok){S.pend=r.pendencias||[];if(S.view==='dados'&&!S.sheet&&!S.busy)render()}
  else S.pend=null;
}

/* Recarrega os dados do servidor sem travar a tela (quem acompanha, status confirmado pela clínica, filho cadastrado em outro aparelho). */
async function atualizar(){
  if(!S.dev||S.busy||!S.perfil)return;
  const r=await rpc('app_perfil',{p_token:S.dev});
  if(r.ok){S.perfil=r.perfil;if(S.view==='dados'&&!S.sheet&&!S.busy)render();return}
  if(r.erro==='bloqueado'&&!r.segundos){S.unlocked=false;S.perfil=null;S.mode='unlock';S.buf='';go('pin');return}
  if(r.erro==='sessao'){store.clear();S.dev=null;S.perfil=null;S.unlocked=false;go('entrar');setTimeout(()=>erro(r.mensagem),0)}
}
function entrou(r){   // resposta de cadastro / login / esqueci: guarda o código do aparelho e abre a tela inicial
  S.dev=r.token;S.perfil=r.perfil;S.unlocked=true;S.pend=null;S.pendOculta=false;
  store.set({dev:r.token,nome1:primeiro(r.perfil.nome)});
}

async function onPin(pin){
  if(S.busy)return;
  const m=S.mode;
  if(m==='unlock'){
    ocupado(true);const r=await rpc('app_desbloquear',{p_token:S.dev,p_pin:pin});ocupado(false);
    if(r.ok){S.perfil=r.perfil;S.unlocked=true;aposEntrar('desbloqueio');return}
    if(r.erro==='sessao'){store.clear();S.dev=null;go('entrar');setTimeout(()=>erro(r.mensagem),0);return}
    if(r.erro==='indisponivel'){go('indisp');return}
    erro(r.mensagem);return;
  }
  if(m==='login'){
    ocupado(true);const r=await rpc('app_login',{p_telefone:S.tel,p_pin:pin,p_aparelho:aparelho()});ocupado(false);
    if(r.ok){entrou(r);if(S.uniao)await unirContaAntiga(r.token);aposEntrar('login');return}
    if(r.erro==='indisponivel'){go('indisp');return}
    erro(r.mensagem);return;
  }
  if(m==='old'){S.old=pin;S.mode='new1';render();return}
  if(m==='new1'){
    if(pinFraco(pin)){S.buf='';render();erro(MSG_PIN_FRACO);return}   // o servidor também recusa (app_pin_fraco); aqui a pessoa vê na hora
    S.tmp=pin;S.mode='new2';render();return}
  if(m==='new2'){
    if(pin!==S.tmp){S.mode='new1';S.tmp='';render();erro('Os PINs não conferem. Tente de novo.');return}
    await S.after(pin);
  }
}

/* PIN óbvio (a mesma regra do banco, app_pin_fraco): repetido 1111, em sequência 1234/4321, pares repetidos 1212/1122 */

const MSG_PIN_FRACO='Escolha um PIN menos óbvio: não use números repetidos (1111), em sequência (1234) nem pares repetidos (1212).';

  if(s.t==='sair')c=`<h2 style="margin-top:0">Sair deste aparelho?</h2><p class="sub">Você poderá entrar de novo com seu celular e PIN. Seus dados continuam guardados com a clínica.</p><button class="btn danger" data-act="sair">Sair</button>`;

function render(){
  if(!S.dev&&!['c1','c2','c3','c3b','c4','c4e','c4c','c5','entrar','esqueci','esqc','pinnovo','indisp','antiga','antiga2'].includes(S.view)&&!(S.view==='pin'&&['login','new1','new2'].includes(S.mode)))S.view='c1';
  if(S.view==='dados'&&!S.perfil){S.view=S.dev?'pin':'c1';S.mode='unlock'}
  app.innerHTML=(V[S.view]?V[S.view]():'')+sheetHtml();
  const t=$('#tel');if(t)t.addEventListener('input',()=>{t.value=fmtTel(t.value)});
  const c=$('#cttel');if(c)c.addEventListener('input',()=>{c.value=fmtTel(c.value)});
  document.querySelectorAll('input[data-data]').forEach(i=>i.addEventListener('input',()=>{i.value=maskData(brData(i.value))}));
  restaurarRascunho();
  document.querySelectorAll('input[data-cp],#pend input[data-pc="cpf"],#cpfn').forEach(ligarCpf);
}
/* O que a pessoa já digitou nas telas do cadastro fica guardado só na memória da página: voltar, trocar Sim/Não ou ser mandada de volta por um erro não apaga nada. */
const RASC_TELAS=['c1','c2','c3','c4','c4e'];   // a tela do CPF (c3b) guarda direto no cadastro em andamento (S.d): os campos dela mudam de posição conforme o que o banco já sabe
function guardarRascunho(el){if(!RASC_TELAS.includes(S.view)||!el.id||el.type==='password')return;S.rasc[S.view+'.'+el.id]=el.value}
function limparRascunho(...ids){ids.forEach(id=>delete S.rasc[S.view+'.'+id])}
function restaurarRascunho(){
  if(!RASC_TELAS.includes(S.view))return;
  document.querySelectorAll('#app input[id],#app select[id]').forEach(el=>{
    const k=S.view+'.'+el.id;if(el.type!=='password'&&k in S.rasc)el.value=S.rasc[k];
    el.addEventListener('input',()=>guardarRascunho(el));el.addEventListener('change',()=>guardarRascunho(el));
  });
}
/* CPF conferido enquanto digita (a mesma conta do banco): ao chegar nos 11 números já diz se está certo, em vez de só descobrir no fim do cadastro. */
function cpfAviso(i,final){
  const d=digits(i.value);let m='',k='';
  if(d.length===11){if(cpfOk(d)){m='✓ CPF confere';k='v'}else{m=MSG_CPF;k='e'}}
  else if(final&&d.length){m=`O CPF tem 11 números (faltam ${11-d.length}).`;k='e'}
  i.setAttribute('aria-invalid',k==='e'?'true':'false');i.classList.toggle('cpf-ok',k==='v');
  let el=i.nextElementSibling;
  if(!el||!el.classList.contains('cpfmsg')){el=document.createElement('small');el.setAttribute('aria-live','polite');i.after(el)}
  el.className='cpfmsg '+k;el.textContent=m;
}
function ligarCpf(i){
  i.value=mascaraCpf(i.value);cpfAviso(i);
  i.addEventListener('input',()=>{i.value=mascaraCpf(i.value);guardarRascunho(i);guardarCpf(i);cpfAviso(i,false);const e=$('#err');if(e)e.textContent=''});
  i.addEventListener('blur',()=>cpfAviso(i,true));
}
/* Na tela do CPF o número vai para o cadastro em andamento a cada letra: voltar e continuar não pede de novo. */
function guardarCpf(i){
  if(S.view!=='c3b'||i.dataset.cp===undefined)return;
  const v=digits(i.value);
  if(i.dataset.cp==='eu')S.d.cpf=v;else if(S.d.filhos[Number(i.dataset.cp)])S.d.filhos[Number(i.dataset.cp)].cpf=v;
}
/* Mensagem ao enviar com o CPF errado: avisa, marca o campo e leva o cursor até ele. */
function cpfRecusado(i,msg){cpfAviso(i,true);i.focus();return erro(msg)}

/* ===== Validações reutilizáveis ===== */
function lerContato(){
  const nome=$('#ctnome').value.trim(),tel=digits($('#cttel').value),rel=$('#ctrel').value;
  if(nome.length<2)return{e:'Informe o nome do contato.'};
  if(!telOk(tel))return{e:'Celular inválido. Use DDD + 9 dígitos.'};
  if(tel===digits(S.d.telefone)||(S.perfil&&tel===S.perfil.telefone))return{e:'Use um número diferente do seu.'};
  return{c:{nome,telefone:tel,relacao:rel}};
}
/* Filho com o mesmo nome do responsável: se também tem o mesmo nascimento é a própria pessoa; senão pergunta se é outra pessoa (ex.: filha com o nome da mãe). */
const normNome=n=>String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function conferirHomonimo(f,nomeTit,nascTit,ok){
  if(!nomeTit||normNome(f.nome)!==normNome(nomeTit))return ok(f);
  if(nascTit&&f.nascimento===nascTit)return erro('Esse é o seu próprio cadastro: não precisa colocar você como filho(a).');
  pedirConfirmacao('O nome é igual ao seu','É outra pessoa com o mesmo nome (por exemplo, um(a) filho(a))? Se for você, não precisa adicionar.','Sim, é outra pessoa',()=>{S.sheet=null;ok(Object.assign({mesmo_nome_confirmado:true},f))});
}
function lerFilho(){
  const nome=$('#fnome').value.trim(),n=isoData($('#fnasc').value);
  if(!nome&&!n)return{vazio:true};
  if(!nomeOk(nome))return{e:'Informe nome e sobrenome do filho(a).'};
  if(!dataOk(n))return{e:'Data de nascimento inválida. Digite assim: 15/03/1988.'};
  return{f:{nome,nascimento:n}};
}
function pedirConfirmacao(titulo,msg,botao,fn){S.confirma=fn;S.sheet={t:'confirma',titulo,msg,botao};render()}
const aviso=r=>erro(r.mensagem||'Não foi possível concluir.');

const A={

      if(r&&r.ok&&r.situacao==='tem_pin'){S.tel=d;S.mode='login';S.buf='';go('pin');setTimeout(()=>erro('Este celular já tem cadastro. Digite o seu PIN.'),0);return}
      if(r&&r.erro==='indisponivel')return go('indisp');

    go('c2')},

  c2:()=>{
    const nome=$('#nome').value.trim(),n=isoData($('#nasc').value);

    if(!dataOk(n))return erro('Data de nascimento inválida. Digite assim: 15/03/1988.');
    if(idade(n)<18)return erro('O cadastro principal precisa ser de um maior de 18 anos.');
    S.d.nome=nome;S.d.nascimento=n;go('c3');
  },
  tf:el=>{S.temFilhos=el.dataset.v==='1';render()},
  addf:()=>{const r=lerFilho();if(r.vazio)return erro('Preencha nome e nascimento.');if(r.e)return erro(r.e);
    conferirHomonimo(r.f,S.d.nome,S.d.nascimento,f=>{S.d.filhos.push(f);limparRascunho('fnome','fnasc');render()})},
  rmf:el=>{S.d.filhos.splice(Number(el.dataset.i),1);render()},
  c3:()=>{
    if(S.temFilhos===null)return erro('Escolha Sim ou Não.');
    if(S.temFilhos){
      const r=lerFilho();
      if(r.e)return erro(r.e);
      if(r.f){return conferirHomonimo(r.f,S.d.nome,S.d.nascimento,f=>{S.d.filhos.push(f);limparRascunho('fnome','fnasc');if(!S.d.filhos.length)return erro('Adicione ao menos um filho ou escolha Não.');depoisFilhos()})}
      if(!S.d.filhos.length)return erro('Adicione ao menos um filho ou escolha Não.');
    }else S.d.filhos=[];
    depoisFilhos();
  },
  c3b:()=>{
    const fl=S.falta||[],campos=[...document.querySelectorAll('input[data-cp]')];
    for(const i of campos){
      if(digits(i.value).length!==11)return cpfRecusado(i,i.dataset.cp==='eu'?'Informe o seu CPF (11 números).':'Informe o CPF de '+primeiro((S.d.filhos[Number(i.dataset.cp)]||{}).nome)+' (11 números).');
      if(!cpfOk(i.value))return cpfRecusado(i,(i.dataset.cp==='eu'?'O seu CPF':'O CPF de '+primeiro((S.d.filhos[Number(i.dataset.cp)]||{}).nome))+' não confere. Confira os números, por favor.');

    campos.forEach(i=>{const v=digits(i.value);if(i.dataset.cp==='eu')S.d.cpf=v;else S.d.filhos[Number(i.dataset.cp)].cpf=v});
    go('c4');
  },
  completarsalvar:async()=>{
    const campos=[...document.querySelectorAll('#pend input')];

      const v=i.value.trim(),op=i.dataset.op==='1';
      if(!v){if(op)continue;return erro(i.dataset.pc==='cpf'?'Preencha o CPF para continuar.':'Preencha para continuar.')}
      if(i.dataset.pc==='cpf'&&digits(v).length!==11)return cpfRecusado(i,'O CPF tem 11 números.');
      if(i.dataset.pc==='cpf'&&!cpfOk(v))return cpfRecusado(i,MSG_CPF);
      if(i.dataset.pc==='email'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return erro('Esse e-mail não parece certo.');

      S.completar=r.pendencias||[];

    S.pend=null;toast('Cadastro completo. Obrigado!');await concluirEntrada();
  },
  c4:()=>{const r=lerContato();if(r.e)return erro(r.e);S.d.confiavel=r.c;depoisContato()},

    S.cod=Object.assign(S.cod||{},{tel:S.d.telefone,validado:true,t:Date.now()});iniciaPin();

  pendsalvar:async()=>{

/* ===== Conta antiga (e-mail e senha) -> acesso rápido =====
   A pessoa entra uma última vez; a sessão fica só na memória desta página (nunca em localStorage). O servidor junta o que já tem
   (conta + cadastro da clínica) em app_conta_antiga_herdar, que só aceita quem está logado numa conta antiga. */
async function entrarContaAntiga(email,senha){
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({email,password:senha})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.access_token)return{ok:true,token:j.access_token};
    const m=String(j.error_code||j.msg||j.error||'');
    if(/email_not_confirmed|not confirmed/i.test(m))return{ok:false,mensagem:'Falta confirmar o e-mail: abra a mensagem que enviamos e toque no link.'};
    if(r.status===429||/rate_limit|too many/i.test(m))return{ok:false,mensagem:'Muitas tentativas. Aguarde alguns minutos e tente de novo.'};
    return{ok:false,mensagem:'E-mail ou senha incorretos.'};
  }catch(e){return{ok:false,mensagem:'Sem conexão. Confira a internet e tente de novo.'}}
}
async function pedirNovaSenha(email){
  try{await fetch(`${SUPABASE_URL}/auth/v1/recover?redirect_to=${encodeURIComponent(new URL('../',location.href).href)}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},body:JSON.stringify({email})})}catch(e){}
}
/* Vindo do chat, a conta já está logada lá (mesmo endereço): reaproveita a sessão em vez de pedir a senha de novo. */
function sessaoDoChat(){
  try{const j=JSON.parse(localStorage.getItem('csi-paciente-auth')||'null');if(j&&j.access_token&&Number(j.expires_at)*1000>Date.now()+60000)return j.access_token}catch(e){}
  return null;
}

     <small>${f.n} atendimento(s)${f.cpf?' · CPF já salvo '+esc(f.cpf):''}</small>
     <label for="fn${i}">Data de nascimento${f.nasc?'':' (faltando)'}</label>${campoData('fn'+i,f.nasc,'data-fi="'+i+'"')}</div>`).join('')}

/* Lê o que está na tela para a lista de filhos da conta antiga. Devolve {e} com o erro ou {lista} para o servidor. */
function lerFilhosAntiga(){
  const fs=S.conta&&S.conta.filhos||[],lista=[];
  document.querySelectorAll('[data-fi]').forEach(inp=>{const f=fs[Number(inp.dataset.fi)];if(f)f.nasc=isoData(inp.value)});
  document.querySelectorAll('[data-fc]').forEach(c=>{const f=fs[Number(c.dataset.fc)];if(f)f.incluir=c.checked});
  for(const f of fs){
    if(f.mesmoCadastro)continue;
    const entra=f.mesmoNome?f.ehFilho:f.incluir;if(!entra)continue;
    if(!dataOk(f.nasc))return{e:`Informe a data de nascimento de ${primeiro(f.nome)}.`};
    lista.push(Object.assign({nome:f.nome,nascimento:f.nasc},f.mesmoNome?{mesmo_nome_confirmado:true}:{}));
  }
  return{lista};
}
function sairContaAntiga(){
  const t=S.conta&&S.conta.token;S.conta=null;
  try{localStorage.removeItem('csi-paciente-auth')}catch(e){}   // o chat deixa de usar a conta e passa a usar o acesso rápido
  if(t)fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+t}}).catch(()=>{});
}
/* Conta antiga + acesso rápido da mesma pessoa viram UMA só: com o PIN já digitado, o servidor confere a senha (sessão da conta) e junta. Só sai da conta antiga se deu certo. */
async function unirContaAntiga(dev){
  const t=S.uniao;S.uniao=null;if(!t)return;
  const u=await rpc('app_conta_antiga_unir',{p_token:dev},t);
  if(u&&u.ok){S.conta={token:t};sairContaAntiga();toast('Pronto! Sua conta antiga e o seu PIN agora são uma só');return}
  toast((u&&u.mensagem)||'Você entrou com o PIN, mas não conseguimos juntar a conta antiga agora.');
}
/* O celular já tem acesso rápido (PIN)? Só leitura; se a resposta falhar, segue o caminho normal. */
async function celularTemPin(tel){
  const r=await rpc('app_pre_cadastro',{p_telefone:tel,p_nome:'',p_nascimento:'',p_filhos:[]});
  return !!(r&&r.ok&&r.situacao==='tem_pin');
}
function irParaPin(tel,msg){S.tel=digits(tel);S.mode='login';S.buf='';go('pin');setTimeout(()=>erro(msg),0)}
async function abrirContaAntiga(token){
  ocupado(true);const r=await rpc('app_conta_antiga_resumo',{},token);ocupado(false);
  if(r.erro==='rede'||!r.ok){S.conta=null;go('antiga');setTimeout(()=>erro(r.mensagem||'Entre com o e-mail e a senha.'),0);return}
  if(!r.conta){S.conta={token};sairContaAntiga();go('antiga');setTimeout(()=>erro('Esta conta não é de paciente.'),0);return}
  if(r.migrada){sairContaAntiga();S.tel='';go('entrar');setTimeout(()=>erro('Você já criou o seu PIN. Entre com o celular e o PIN.'),0);return}
  // PIN criado pelo celular, sem ligação com esta conta: não faz sentido repetir o cadastro, vai direto para o PIN
  // (a sessão da conta fica na memória até o PIN: o servidor só junta as duas com a senha E o PIN, e só se for a mesma pessoa. Ver unirContaAntiga)
  if(r.telefone&&await celularTemPin(r.telefone)){S.uniao=token;S.conta=null;irParaPin(r.telefone,'Você já tem PIN. Digite o seu PIN para juntar com a sua conta antiga.');return}
  ocupado(true);const fl=await rpc('app_conta_antiga_filhos',{},token);ocupado(false);
  const filhos=(fl&&fl.ok?fl.filhos:[]).map(f=>({nome:f.nome,nasc:f.nascimento||'',cpf:f.cpf_mascara||'',n:f.atendimentos,mesmoNome:!!f.mesmo_nome,mesmoCadastro:!!f.mesmo_cadastro,
    incluir:!f.mesmo_nome,ehFilho:f.mesmo_nome&&f.nascimento?idade(f.nascimento)<18:false}));
  S.conta={token,resumo:r,dig:null,filhos};go('antiga2');
}
function iniciaPinAntiga(){
  S.mode='new1';S.buf='';S.tmp='';
  S.after=async pin=>{
    const d=S.conta.dig,tok=S.conta.token;
    ocupado(true);const r=await rpc('app_conta_antiga_migrar',{p_pin:pin,p_telefone:d.tel,p_nome:d.nome,p_nascimento:d.nasc,p_filhos:S.conta.lista||[],p_aparelho:aparelho()},tok);ocupado(false);
    if(r.ok){entrou(r);sairContaAntiga();toast('Pronto! Seus dados foram trazidos');aposEntrar('conta_antiga');return}
    if(r.erro==='indisponivel')return go('indisp');
    if(r.erro==='ja_migrada'){sairContaAntiga();S.tel=d.tel;S.mode='login';S.buf='';go('pin');setTimeout(()=>erro(r.mensagem),0);return}
    S.mode='new1';S.buf='';S.tmp='';go('antiga2');setTimeout(()=>erro(r.mensagem||'Não foi possível concluir. Tente de novo.'),0);
  };
  go('pin');
}
/* PIN obrigatório: antes da confiança e do PIN o servidor diz de quem ainda falta o CPF (o que a clínica ou o chat já sabem não é perguntado de novo). */
async function depoisFilhos(){
  if(!(S.porta&&S.porta.obrigatorio))return go('c4');
  ocupado(true);const r=await rpc('app_pre_cadastro',{p_telefone:S.d.telefone,p_nome:S.d.nome,p_nascimento:S.d.nascimento,p_filhos:S.d.filhos.map(f=>({nome:f.nome,nascimento:f.nascimento}))});ocupado(false);
  if(r&&r.erro==='indisponivel')return go('indisp');
  if(r&&r.ok&&r.situacao==='tem_pin'){S.tel=S.d.telefone;S.mode='login';S.buf='';go('pin');setTimeout(()=>erro('Este celular já tem cadastro. Digite o seu PIN.'),0);return}
  if(!r||!r.ok){const e=r&&r.erro,etapa={celular:'c1',nome:'c2',nascimento:'c2',menor:'c2'}[e]||'c3';go(etapa);setTimeout(()=>erro((r&&r.mensagem)||'Não foi possível continuar. Tente de novo.'),0);return}
  S.falta=(r.falta||[]).filter(x=>x.pessoa==='eu');   /* CPF do filho é opcional (23/11/2026): não se pergunta no cadastro; o chat pede ao marcar */
  go(S.falta.length?'c3b':'c4');
}

/* Depois do número de confiança: se o servidor exige a confirmação do e-mail, passa por ela antes do PIN; se já foi confirmada nos últimos 25 minutos, segue direto. */
async function depoisContato(){
  if(S.cod&&S.cod.validado&&S.cod.tel===S.d.telefone&&Date.now()-S.cod.t<25*60000)return iniciaPin();
  ocupado(true);const r=await rpc('app_codigo_pedir',{p_telefone:S.d.telefone,p_finalidade:'cadastro',p_email:'',p_nome:S.d.nome});ocupado(false);
  if(r.erro==='indisponivel')return go('indisp');
  if(r.ok&&r.exigido===false)return iniciaPin();                  // confirmação desligada: como antes
  if(r.erro==='telefone_cadastrado'){S.tel=S.d.telefone;S.mode='login';S.buf='';go('pin');setTimeout(()=>erro(r.mensagem),0);return}
  if(r.erro==='celular'){go('c1');setTimeout(()=>erro(r.mensagem),0);return}
  if(r.erro==='rede')return iniciaPin();                          // sem resposta: segue; quem decide é o servidor (sem código aceito ele recusa e a página volta para o e-mail)
  go('c4e');                                                      // exigida: pede o e-mail (o pedido sem e-mail só confere, não gera código)
}
function iniciaPin(){
  S.mode='new1';S.buf='';S.tmp='';
  S.after=async pin=>{
    const d=S.d,obrig=!!(S.porta&&S.porta.obrigatorio);
    const args={p_telefone:d.telefone,p_nome:d.nome,p_nascimento:d.nascimento,p_pin:pin,p_filhos:d.filhos,p_aparelho:aparelho()};
    if(d.confiavel)args.p_confianca=d.confiavel;
    if(obrig){args.p_cpf=d.cpf||null;const em=(S.cod&&S.cod.validado&&S.cod.email)||S.cacheEmail||'';if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))args.p_email=em}
    ocupado(true);const r=await rpc(obrig?'app_pin_criar':'app_cadastrar',args);ocupado(false);
    if(r.ok){entrou(r);S.d={filhos:[],confiavel:null};S.rasc={};toast('Cadastro concluído');aposEntrar('cadastro');return}
    if(r.erro==='indisponivel')return go('indisp');
    if(r.erro==='pin_fraco'){S.mode='new1';S.buf='';S.tmp='';go('c5');setTimeout(()=>erro(r.mensagem||MSG_PIN_FRACO),0);return}   // PIN óbvio: fica na etapa do PIN
    // volta para a etapa que tem o problema, com a explicação do servidor
    const etapa={celular:'c1',telefone_cadastrado:'c1',nome:'c2',nascimento:'c2',menor:'c2',filho:'c3',homonimo:'c3',mesmo_cadastro:'c3',confianca:'c4',cpf:'c3b',cpf_falta:'c3b',filho_cpf:'c3b',filho_cpf_falta:'c3b',codigo_email:'c4e'}[r.erro]||'c4';
    if(r.erro==='codigo_email')S.cod=null;
    if(etapa==='c3b')S.falta=[{pessoa:'eu'}];   // o servidor recusou o CPF: pede de novo todos os CPFs
    S.mode='new1';S.buf='';S.tmp='';go(etapa);setTimeout(()=>erro(r.mensagem),0);
    if(r.erro==='telefone_cadastrado')S.tel=d.telefone;
  };
  go('c5');
}

    return;
  }

  const b=e.target.closest('[data-act]');
  if(b&&A[b.dataset.act]&&!S.busy)A[b.dataset.act](b);
});

  if(document.hidden){S.hiddenAt=Date.now();return}
  if(S.dev&&S.unlocked&&S.hiddenAt&&Date.now()-S.hiddenAt>300000){S.unlocked=false;S.perfil=null;S.sheet=null;S.mode='unlock';S.buf='';go('pin');return}
  if(S.dev&&S.unlocked)atualizar();
});

/* ===== Início: se este aparelho já tem cadastro, abre direto no PIN ===== */
(async function iniciar(){
  S.porta=await carregarPorta();
  const salvo=store.get();
  if(salvo&&salvo.dev){
    S.dev=salvo.dev;S.mode='unlock';S.view='pin';
    /* Vindo do chat com o PIN ainda válido no servidor (30 minutos): não pede o PIN de novo. Se o servidor disser que venceu, cai na tela do PIN como antes. */
    if(IR_DADOS){
      const r=await Promise.race([rpc('app_perfil',{p_token:S.dev}),new Promise(ok=>setTimeout(()=>ok(null),4000))]);
      if(r&&r.ok&&r.perfil){S.perfil=r.perfil;S.unlocked=true;S.pend=null;S.view='dados'}
    }
  }
  else{
    S.view='c1';
    const c=lerCacheChat();   // quem já usou o chat neste aparelho começa com celular e nome preenchidos
    if(c){const t=digits(c.telefone).slice(-11);if(telOk(t))S.d.telefone=t;if(nomeOk(c.nome))S.d.nome=String(c.nome).trim();S.cacheEmail=String(c.email||'').trim().toLowerCase()}
  }
  const VEIO_ANTIGA=new URLSearchParams(location.search).get('antiga')==='1'||(VOLTAR_CHAT&&!S.dev&&!!sessaoDoChat()&&!!(S.porta&&S.porta.obrigatorio));   // chat com PIN obrigatório e conta de e-mail aberta: segue pelo caminho da conta antiga
  if(VEIO_ANTIGA&&!S.dev){
    const t=sessaoDoChat();
    if(t){render();abrirContaAntiga(t)}else{S.view='antiga';render()}
  }else render();
})();
</script>
