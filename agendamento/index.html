<title>Agendamento · CSI - Clínica de Saúde e Imagem</title>
<!--
  FLUXOGRAMA: entrada (o paciente escolhe consulta ou exame, convênio e período; ou entra com CPF + nascimento) -> validação (a página confere o formato; QUEM CONFERE DE VERDADE é a função
    klingo-agendamento, que confirma CPF + nascimento no Klingo antes e depois do login) -> lógica (todas as chamadas vão para a função; a chave do Klingo NUNCA está nesta página)
    -> saída (horários reais, voucher, marcações, resultados). CPF e nascimento ficam só na memória desta aba (não vão para localStorage, cookie nem URL).
  Versão 1.0 — 13/11/2026 / Mudança: primeira versão (página de agendamento com tudo o que a API externa do Klingo permite, menos dinheiro). Documentação: docs/agendamento-pagina.md
-->
<style>
  :root { --csi-primary:#0088cc; --csi-primary-strong:#006ba1; --csi-primary-soft:#e6f4fb; --csi-sidebar-bg:#1e3a5f; --csi-danger:#e74c3c; --csi-danger-strong:#b3261e; --csi-danger-bg:#fdf2f0;
    --csi-success-strong:#167a43; --csi-success-soft:#e8f8ef; --csi-warning-strong:#8a5a00; --csi-warning-soft:#fff4dc;
    --csi-surface:#ffffff; --csi-background:#f8f9fa; --csi-border:#eaedf1; --csi-border-strong:#cfd6df; --csi-text-main:#333333; --csi-text-secondary:#5a6878;
    --font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --radius-md:10px; --radius-lg:16px; --shadow-md:0 4px 12px rgba(0,0,0,.08);
    --fundo:var(--csi-background); --papel:var(--csi-surface); --texto:var(--csi-text-main); --suave:var(--csi-text-secondary); --linha:var(--csi-border); --linha-forte:var(--csi-border-strong);
    --azul:var(--csi-primary-strong); --azul-claro:var(--csi-primary-soft); --azul-escuro:var(--csi-sidebar-bg); --erro:var(--csi-danger-strong); --ok:var(--csi-success-strong); }
  @media (prefers-color-scheme: dark) { :root { --csi-background:#0b1522; --csi-surface:#14233a; --csi-text-main:#e6edf6; --csi-text-secondary:#9fb0c4; --csi-border:#22344d; --csi-border-strong:#3a4f6b;
    --csi-primary-soft:#12324b; --azul:#5bb8ec; --erro:#ff8a80; --ok:#5fd596; --csi-success-soft:#10331f; --csi-warning-soft:#3a2d0c; --csi-warning-strong:#f1c76a; --csi-danger-bg:#3a1714; } }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { font-family:var(--font-family); background:var(--fundo); color:var(--texto); font-size:17px; line-height:1.45; -webkit-text-size-adjust:100%; }
  [hidden] { display:none !important; }
  :focus-visible { outline:3px solid var(--csi-primary); outline-offset:2px; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .cabeca { position:sticky; top:0; z-index:5; background:var(--papel); }
  header.topo { background:var(--papel); border-bottom:3px solid var(--csi-primary); padding:calc(8px + env(safe-area-inset-top)) 16px 8px; display:flex; align-items:center; gap:12px; }
  header.topo img { height:28px; width:auto; flex:none; }
  @media (prefers-color-scheme: dark) { header.topo img { background:#fff; border-radius:6px; padding:3px 6px; } }
  header.topo .tit { flex:1; min-width:0; font-weight:700; line-height:1.15; }
  header.topo .tit small { display:block; font-weight:400; color:var(--suave); font-size:.82rem; }
  .quem { display:flex; align-items:center; gap:8px; font-size:.9rem; }
  .quem button { background:transparent; border:1px solid var(--linha-forte); border-radius:999px; padding:6px 12px; cursor:pointer; min-height:36px; }
  nav.abas { display:flex; gap:4px; overflow-x:auto; padding:8px 12px 0; background:var(--papel); border-bottom:1px solid var(--linha); scrollbar-width:none; }
  nav.abas::-webkit-scrollbar { display:none; }
  nav.abas button { flex:none; background:none; border:0; border-bottom:3px solid transparent; padding:10px 12px; cursor:pointer; color:var(--suave); font-weight:600; min-height:44px; white-space:nowrap; }
  nav.abas button[aria-selected="true"] { color:var(--azul); border-bottom-color:var(--csi-primary); }
  main { max-width:760px; margin:0 auto; padding:16px 16px 90px; }
  h1 { font-size:1.35rem; margin:.2em 0 .5em; } h2 { font-size:1.12rem; margin:0 0 .5em; } h3 { font-size:1rem; margin:.8em 0 .3em; }
  p { margin:.4em 0; } .suave { color:var(--suave); font-size:.92rem; }
  .cartao { background:var(--papel); border:1px solid var(--linha); border-radius:var(--radius-lg); padding:16px; margin:0 0 14px; box-shadow:var(--shadow-md); }
  label { display:block; font-weight:600; margin:12px 0 4px; font-size:.95rem; }
  input, select, textarea { width:100%; min-height:46px; padding:10px 12px; border:1px solid var(--linha-forte); border-radius:var(--radius-md); background:var(--papel); }
  input[type=checkbox], input[type=radio] { width:auto; min-height:0; }
  .linha { display:flex; gap:10px; flex-wrap:wrap; } .linha > * { flex:1 1 150px; min-width:0; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:10px 18px; border-radius:var(--radius-md); border:1px solid var(--linha-forte); background:var(--papel); cursor:pointer; font-weight:600; }
  .btn.prim { background:var(--azul); border-color:var(--azul); color:#fff; } @media (prefers-color-scheme: dark) { .btn.prim { color:#06121f; } }
  .btn.perigo { border-color:var(--erro); color:var(--erro); } .btn.peq { min-height:38px; padding:6px 12px; font-size:.92rem; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .acoes { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .aviso { border-radius:var(--radius-md); padding:12px 14px; margin:0 0 12px; border:1px solid var(--linha-forte); background:var(--azul-claro); }
  .aviso.erro { background:var(--csi-danger-bg); border-color:var(--erro); } .aviso.ok { background:var(--csi-success-soft); border-color:var(--ok); } .aviso.atencao { background:var(--csi-warning-soft); border-color:var(--csi-warning-strong); }
  .seg { display:flex; border:1px solid var(--linha-forte); border-radius:var(--radius-md); overflow:hidden; } .seg button { flex:1; border:0; background:var(--papel); padding:12px; cursor:pointer; font-weight:600; min-height:46px; }
  .seg button[aria-pressed="true"] { background:var(--azul); color:#fff; } @media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { color:#06121f; } }
  .passos { display:flex; gap:6px; margin:0 0 14px; padding:0; list-style:none; } .passos li { flex:1; text-align:center; font-size:.78rem; padding:6px 2px; border-bottom:4px solid var(--linha); color:var(--suave); }
  .passos li.on { border-color:var(--csi-primary); color:var(--azul); font-weight:700; } .passos li.feito { border-color:var(--ok); color:var(--ok); }
  details.dia { border:1px solid var(--linha); border-radius:var(--radius-md); margin:0 0 8px; background:var(--papel); } details.dia > summary { cursor:pointer; padding:12px 14px; font-weight:700; min-height:46px; }
  details.dia .conteudo { padding:0 14px 12px; } .medico { margin:8px 0 4px; font-weight:600; } .medico small { color:var(--suave); font-weight:400; }
  .horas { display:flex; flex-wrap:wrap; gap:8px; } .hora { min-width:68px; min-height:44px; border:1px solid var(--azul); background:var(--papel); color:var(--azul); border-radius:var(--radius-md); font-weight:700; cursor:pointer; }
  .hora:hover { background:var(--azul-claro); }
  .item { border:1px solid var(--linha); border-radius:var(--radius-md); padding:12px 14px; margin:0 0 10px; background:var(--papel); } .item h3 { margin:0 0 4px; }
  .etiqueta { display:inline-block; font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--azul-claro); color:var(--azul); margin-right:6px; }
  .etiqueta.ok { background:var(--csi-success-soft); color:var(--ok); } .etiqueta.nt { background:var(--csi-warning-soft); color:var(--csi-warning-strong); } .etiqueta.no { background:var(--csi-danger-bg); color:var(--erro); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--linha); vertical-align:top; } th { position:sticky; top:0; background:var(--papel); }
  .rolagem { overflow:auto; max-height:420px; border:1px solid var(--linha); border-radius:var(--radius-md); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:.8rem; background:var(--fundo); border:1px solid var(--linha); border-radius:var(--radius-md); padding:10px; max-height:360px; overflow:auto; }
  .relogio { font-variant-numeric:tabular-nums; font-weight:700; }
  .carregando::after { content:""; display:inline-block; width:14px; height:14px; margin-left:8px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:gira .7s linear infinite; vertical-align:-2px; }
  @keyframes gira { to { transform:rotate(360deg); } } @media (prefers-reduced-motion: reduce) { .carregando::after { animation:none; } }
  footer { max-width:760px; margin:0 auto; padding:0 16px 30px; font-size:.82rem; color:var(--suave); } footer a { color:var(--azul); }
  .ponto { display:inline-block; width:9px; height:9px; border-radius:50%; background:#9aa7b6; margin-right:6px; } .ponto.ok { background:#22c55e; } .ponto.no { background:#ef4444; }
  iframe.laudo { width:100%; height:420px; border:1px solid var(--linha); border-radius:var(--radius-md); background:#fff; }
</style>
</head>
<body>
<div class="cabeca">
<header class="topo">
  <img src="../img/logo-csi.svg" alt="CSI - Clínica de Saúde e Imagem" height="28">
  <div class="tit">Agendamento<small>CSI · Clínica de Saúde e Imagem</small></div>
  <div class="quem" id="quem" hidden><span id="quemNome"></span><button type="button" id="sair">Sair</button></div>
</header>
<nav class="abas" role="tablist" aria-label="Seções do agendamento" id="abas"></nav>
</div>
<main id="app" tabindex="-1"></main>
<footer>
  <p><span class="ponto" id="pontoApi"></span><span id="estadoApi">Verificando o sistema da clínica…</span></p>
  <p>Usamos o CPF e a data de nascimento só para localizar o seu cadastro; não ficam guardados neste aparelho. <a href="../privacidade.html">Privacidade</a> · <a href="../termos.html">Termos</a> · <a href="../">Falar com a equipe pelo chat</a></p>
</footer>

<script>
'use strict';
const FN = 'https://nrvuynjwcgwpjdptkiay.supabase.co/functions/v1/klingo-agendamento';
const VERSAO_PAGINA = '2026.11.13-1';

// ---------------------------------------------------------------- utilidades
const $ = (s, r = document) => r.querySelector(s);
/** Monta elemento sem innerHTML: TUDO que vem da API entra como texto (nada de HTML da rede é interpretado). */
function h(tag, attrs, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'dataset') Object.assign(e.dataset, v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const f of filhos.flat(Infinity)) if (f !== null && f !== undefined && f !== false) e.append(f.nodeType ? f : document.createTextNode(String(f)));
  return e;
}
const hojeSP = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Sao_Paulo' }).format(new Date());
const somar = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const fmtData = (d) => { if (!d) return ''; const [a, m, di] = String(d).slice(0, 10).split('-'); const s = DIAS[new Date(Date.parse(d.slice(0, 10) + 'T12:00:00Z')).getUTCDay()]; return `${s}, ${di}/${m}${a !== hojeSP().slice(0, 4) ? '/' + a : ''}`; };
const fmtNasc = (d) => { const [a, m, di] = String(d || '').split('-'); return a ? `${di}/${m}/${a}` : ''; };
const soDigitos = (v) => String(v || '').replace(/\D/g, '');
const maskCpf = (v) => { const d = soDigitos(v).slice(0, 11); return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); };
function cpfOk(v) {
  const d = soDigitos(v); if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  const dv = (n) => { let s = 0; for (let i = 0; i < n; i++) s += Number(d[i]) * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === Number(d[9]) && dv(10) === Number(d[10]);
}
const nomeDe = (o) => (o && (o.descr || o.nome || o.descricao || o.name)) || (o && o.id !== undefined ? String(o.id) : '');
const lista = (x) => (Array.isArray(x) ? x : x && Array.isArray(x.dados) ? x.dados : []);

// ---------------------------------------------------------------- chamada à função (nunca direto ao Klingo)
let ocupado = 0;
async function api(acao, dados = {}) {
  ocupado++; document.body.setAttribute('aria-busy', 'true');
  try {
    const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao, ...dados }) });
    const j = await r.json().catch(() => null);
    if (!j || typeof j !== 'object') return { ok: false, motivo: 'resposta_invalida' };
    return j;
  } catch { return { ok: false, motivo: 'sem_rede' }; }
  finally { if (--ocupado <= 0) document.body.removeAttribute('aria-busy'); }
}
const MSG = {
  sem_rede: 'Sem conexão com a internet. Confira o sinal e tente de novo.', resposta_invalida: 'O sistema respondeu algo inesperado. Tente de novo em instantes.',
  nao_confere: 'Não encontramos um cadastro com este CPF e esta data de nascimento. Confira os números ou faça o cadastro de paciente novo.',
  tentativas_demais: 'Muitas tentativas com este CPF. Tente de novo mais tarde ou procure a recepção.', limite: 'O sistema da clínica está muito ocupado. Tente de novo em alguns segundos.',
  horario_ocupado: 'Este horário acabou de ser ocupado. Escolha outro.', sem_medico: 'Nenhum médico atende com este convênio para esta consulta. Escolha outro plano ou fale com a equipe.',
  plano_inativo: 'Este plano está inativo no sistema. Escolha outro plano ou fale com a equipe.', plano_desconhecido: 'Este plano não foi reconhecido. Escolha outro.',
  ja_cancelado: 'Esta marcação já estava cancelada.', outra_data: 'O check-in só vale no dia do atendimento.', voucher_nao_encontrado: 'Não achamos esta marcação entre as suas marcações ativas.',
  ja_cadastrado: 'Você já tem cadastro. Use “Entrar” com o CPF e a data de nascimento.', nao_foi_possivel: 'Não foi possível concluir por aqui. Procure a recepção da clínica.',
  incerto: 'Não conseguimos confirmar se deu certo. Veja em “Minhas marcações” antes de tentar de novo.', limite_diario: 'Muitos cadastros hoje. Procure a recepção ou tente amanhã.',
  sessao_nao_confere: 'Não foi possível confirmar o cadastro. Procure a recepção.', sem_cadastro_definitivo: 'O cadastro precisa ser conferido pela recepção. Procure a clínica.',
  dados_invalidos: 'Alguns dados não estão no formato certo. Confira e tente de novo.', klingo_recusou: 'O sistema da clínica recusou o pedido. Tente de novo ou fale com a equipe.',
  desligado: 'A entrega do resultado por aqui ainda não foi liberada pela clínica. Peça na recepção ou pelo chat.',
  erro: 'Algo deu errado do nosso lado. Tente de novo em instantes.', em_andamento: 'Seu cadastro está sendo conferido. Procure a recepção se não puder continuar.',
};
const textoErro = (r) => r.mensagem || MSG[r.motivo] || MSG.erro;

// ---------------------------------------------------------------- estado
const S = {
  aba: 'marcar', id: null,                                  // id = { cpf, nasc, nome, pre } só na memória
  passo: 1, tipo: 'consulta', especialidades: null, convenios: null, consultas: {}, espec: '', exameBusca: '', exames: null, exame: null,
  plano: { id: 1, nome: 'PARTICULAR' }, ini: hojeSP(), fim: somar(hojeSP(), 9),
  horarios: null, filtro: { medico: '', unidade: '', turno: '' }, motivoVazio: null, escolhido: null, reserva: null, preco: null, remarcar: null, voucherNovo: null, ident: 'entrar',
  marcacoes: null, dados: null, avisos: [], catalogo: { k: 'unidades', resposta: null, valores: {} }, relogio: null,
};
const ABAS = [['marcar', 'Marcar'], ['marcacoes', 'Minhas marcações'], ['dados', 'Meus dados'], ['consultar', 'Consultar a clínica'], ['sobre', 'Sobre a API']];

function aviso(tipo, texto) { S.avisos.push({ tipo, texto }); }
function trocarAba(a) { if (S.aba === 'marcar' && a !== 'marcar') soltarReserva(); S.aba = a; S.avisos = []; desenhar(); $('#app').focus({ preventScroll: true }); window.scrollTo(0, 0); }
function desenhar() {
  const nav = $('#abas'); nav.replaceChildren(...ABAS.map(([k, t]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(S.aba === k), onclick: () => trocarAba(k) }, t)));
  $('#quem').hidden = !S.id; if (S.id) $('#quemNome').textContent = S.id.nome ? `Olá, ${S.id.nome}` : 'Identificado';
  const app = $('#app'); const novo = [];
  for (const a of S.avisos) novo.push(h('div', { class: 'aviso ' + (a.tipo || ''), role: a.tipo === 'erro' ? 'alert' : 'status' }, a.texto));
  const tela = { marcar: telaMarcar, marcacoes: telaMarcacoes, dados: telaDados, consultar: telaConsultar, sobre: telaSobre }[S.aba]();
  novo.push(tela); app.replaceChildren(...novo);
}
async function tarefa(botao, fn) {
  if (botao) { botao.disabled = true; botao.classList.add('carregando'); }
  try { await fn(); } finally { if (botao && botao.isConnected) { botao.disabled = false; botao.classList.remove('carregando'); } }
}
const credenciais = () => ({ cpf: S.id.cpf, nascimento: S.id.nasc });
function sair() { soltarReserva(); S.id = null; S.marcacoes = null; S.dados = null; S.passo = Math.min(S.passo, 2); S.avisos = []; aviso('ok', 'Você saiu. Seus dados não ficam guardados neste aparelho.'); desenhar(); }
$('#sair').addEventListener('click', sair);

// ---------------------------------------------------------------- identificação (compartilhada)
function formIdentidade(aoEntrar, texto) {
  const cpf = h('input', { id: 'idCpf', inputmode: 'numeric', autocomplete: 'off', placeholder: '000.000.000-00', maxlength: '14' });
  cpf.addEventListener('input', () => { cpf.value = maskCpf(cpf.value); });
  const nasc = h('input', { id: 'idNasc', type: 'date', autocomplete: 'off', max: hojeSP(), min: '1900-01-01' });
  const msg = h('div', { role: 'alert', class: 'aviso erro', hidden: true });
  const entrar = h('button', { type: 'button', class: 'btn prim', onclick: () => tarefa(entrar, async () => {
    msg.hidden = true;
    if (!cpfOk(cpf.value)) { msg.textContent = 'O CPF não parece certo. Confira os números.'; msg.hidden = false; cpf.focus(); return; }
    if (!nasc.value) { msg.textContent = 'Informe a data de nascimento.'; msg.hidden = false; nasc.focus(); return; }
    const r = await api('identificar', { cpf: soDigitos(cpf.value), nascimento: nasc.value });
    if (!r.ok) { msg.textContent = textoErro(r); msg.hidden = false; return; }
    S.id = { cpf: soDigitos(cpf.value), nasc: nasc.value, nome: r.primeiro_nome || '', pre: !!r.pre_cadastro };
    aoEntrar();
  }) }, 'Entrar');
  return h('div', {}, texto ? h('p', { class: 'suave' }, texto) : null,
    h('label', { for: 'idCpf' }, 'CPF'), cpf, h('label', { for: 'idNasc' }, 'Data de nascimento'), nasc, msg,
    h('div', { class: 'acoes' }, entrar, h('button', { type: 'button', class: 'btn', onclick: () => { S.ident = 'novo'; desenhar(); } }, 'Sou paciente novo')));
}

function formCadastro(aoCadastrar) {
  const c = (id, rotulo, attrs = {}) => [h('label', { for: id }, rotulo), h('input', { id, autocomplete: 'off', ...attrs })];
  const nome = c('cdNome', 'Nome completo', { maxlength: '100' }), cpf = c('cdCpf', 'CPF', { inputmode: 'numeric', maxlength: '14', placeholder: '000.000.000-00' });
  cpf[1].addEventListener('input', () => { cpf[1].value = maskCpf(cpf[1].value); });
  const nasc = c('cdNasc', 'Data de nascimento', { type: 'date', max: hojeSP(), min: '1900-01-01' }), cel = c('cdCel', 'Celular com DDD', { inputmode: 'tel', placeholder: '(71) 99999-0000', maxlength: '16' });
  const mail = c('cdMail', 'E-mail (opcional)', { type: 'email', maxlength: '120' }), mae = c('cdMae', 'Nome da mãe (opcional)', { maxlength: '100' });
  const sexo = h('select', { id: 'cdSexo' }, h('option', { value: '' }, 'Escolha'), h('option', { value: 'F' }, 'Feminino'), h('option', { value: 'M' }, 'Masculino'));
  const msg = h('div', { role: 'alert', class: 'aviso erro', hidden: true });
  const ok = h('button', { type: 'button', class: 'btn prim', onclick: () => tarefa(ok, async () => {
    const erro = (t, el) => { msg.textContent = t; msg.hidden = false; el.focus(); };
    msg.hidden = true;

  const recarregar = () => { S.marcacoes = null; desenhar(); };
  const botoes = [
    acao('Cancelar', async () => { if (!confirm('Cancelar esta marcação? O horário volta para outras pessoas.')) return; const r = await api('cancelar', { ...credenciais(), voucher: v.id, confirmar: true }); S.avisos = []; aviso(r.ok ? 'ok' : 'erro', r.ok ? 'Marcação cancelada.' : textoErro(r)); recarregar(); }, 'perigo'),
    acao('Remarcar', async () => { S.remarcar = v; S.passo = 1; S.escolhido = null; S.horarios = null; S.avisos = []; S.aba = 'marcar'; desenhar(); window.scrollTo(0, 0); }),
    acao('Trocar procedimento', async (s) => trocarProcedimento(v, s)),
    hoje ? acao('Fazer check-in', async () => { const r = await api('checkin', { ...credenciais(), voucher: v.id, confirmar: true }); S.avisos = []; aviso(r.ok ? 'ok' : 'erro', r.ok ? `Check-in feito${r.checkin && r.checkin.recepcao ? ` na ${r.checkin.recepcao}` : ''}.` : textoErro(r)); desenhar(); }, '', true) : null,
    hoje ? acao('Desfazer check-in', async () => { const r = await api('cancelar_checkin', { ...credenciais(), voucher: v.id, confirmar: true }); S.avisos = []; aviso(r.ok ? 'ok' : 'erro', r.ok ? 'Check-in desfeito.' : textoErro(r)); desenhar(); }, '', true) : null,
    acao('Ver resultado', async (s) => verResultado(v, s), '', true),

async function trocarProcedimento(v, saida) {
  saida.replaceChildren(h('p', { class: 'carregando suave' }, 'Buscando os procedimentos'));
  if (!S.especialidades) await carregarCatalogosBase();
  const opcoes = [];
  for (const e of (S.especialidades || []).slice(0, 12)) { const cbos = String(e.cbos || e.id); if (!S.consultas[cbos]) { const r = await api('catalogo', { catalogo: 'consultas', cbos }); S.consultas[cbos] = r.ok ? lista(r.dados) : []; } for (const c of S.consultas[cbos]) opcoes.push([c.id, `${nomeDe(e)} · ${nomeDe(c)}`]); }
  const sel = h('select', { 'aria-label': 'Novo procedimento' }, opcoes.map(([id, t]) => h('option', { value: id }, t)));
  const ok = h('button', { type: 'button', class: 'btn prim peq', onclick: () => tarefa(ok, async () => { const r = await api('trocar_procedimento', { ...credenciais(), voucher: v.id, procedimento: String(sel.value), confirmar: true }); S.avisos = []; aviso(r.ok ? 'ok' : 'erro', r.ok ? 'Procedimento trocado.' : textoErro(r)); S.marcacoes = null; desenhar(); }) }, 'Trocar');
  saida.replaceChildren(opcoes.length ? h('div', { class: 'linha', style: 'margin-top:10px' }, sel, ok) : h('p', { class: 'suave' }, 'Não encontramos procedimentos para trocar.'));

const ehBase64Pdf = (s) => typeof s === 'string' && s.length > 100 && /^JVBERi0/.test(s.trim());
function acharConteudo(o, achados = { pdf: null, html: null }, prof = 0) {
  if (!o || prof > 4) return achados;
  if (typeof o === 'string') { if (ehBase64Pdf(o) && !achados.pdf) achados.pdf = o.trim(); else if (/<\s*(html|body|div|p|table)\b/i.test(o) && !achados.html) achados.html = o; return achados; }
  if (typeof o === 'object') for (const x of Object.values(o)) acharConteudo(x, achados, prof + 1);
  return achados;
}
async function verResultado(v, saida) {
  saida.replaceChildren(h('p', { class: 'carregando suave' }, 'Consultando o resultado'));
  let r = await api('resultado', { ...credenciais(), voucher: v.id });
  if (!r.ok) { saida.replaceChildren(h('div', { class: 'aviso erro' }, textoErro(r))); return; }
  if (!r.pronto) { saida.replaceChildren(h('div', { class: 'aviso atencao' }, 'O resultado desta marcação ainda não está pronto.')); return; }
  let c = acharConteudo(r.resultado); if (!c.pdf && !c.html) { const p = await api('resultado', { ...credenciais(), voucher: v.id, formato: 'pdf' }); if (p.ok && p.pronto) c = acharConteudo(p.resultado); }
  const partes = [];
  if (c.pdf) { const bin = atob(c.pdf); const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0)); const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); partes.push(h('a', { class: 'btn prim peq', href: url, target: '_blank', rel: 'noopener', download: `resultado-${v.id}.pdf` }, 'Abrir o resultado em PDF')); }
  if (c.html) partes.push(h('iframe', { class: 'laudo', sandbox: '', title: 'Resultado do exame', srcdoc: c.html }));
  saida.replaceChildren(partes.length ? h('div', { style: 'margin-top:10px' }, partes) : h('div', { class: 'aviso atencao' }, 'O resultado está pronto, mas não veio em um formato que a página consegue mostrar. Peça a retirada na recepção.'));
}

  const caixa = h('div', {}, h('h1', {}, 'Meus dados'));

    h('table', {}, h('tbody', {}, [['Nascimento', fmtNasc(d.nascimento)], ['Celular', d.celular], ['Telefone', d.telefone], ['E-mail', d.email], ['Convênio', d.convenio], ['Plano', d.plano]].filter(([, v]) => v).map(([k, v]) => h('tr', {}, h('th', {}, k), h('td', {}, v))))),
    h('p', { class: 'suave' }, 'Por segurança, o contato aparece parcialmente escondido.')));
  if (!S.dados.pre_cadastro) {
    const cel = h('input', { id: 'upCel', inputmode: 'tel', placeholder: '(71) 99999-0000', maxlength: '16' }), tel = h('input', { id: 'upTel', inputmode: 'tel', maxlength: '16' }), mail = h('input', { id: 'upMail', type: 'email', maxlength: '120' });
    const salvar = h('button', { type: 'button', class: 'btn prim', onclick: () => tarefa(salvar, async () => {
      const corpo = { ...credenciais(), confirmar: true }; if (cel.value.trim()) corpo.celular = soDigitos(cel.value); if (tel.value.trim()) corpo.telefone = soDigitos(tel.value); if (mail.value.trim()) corpo.email = mail.value.trim();
      S.avisos = []; if (!corpo.celular && !corpo.telefone && !corpo.email) { aviso('atencao', 'Preencha o que quer mudar.'); return desenhar(); }
      const r = await api('atualizar_contato', corpo); aviso(r.ok ? 'ok' : 'erro', r.ok ? 'Contato atualizado.' : textoErro(r)); if (r.ok) S.dados = null; desenhar();
    }) }, 'Salvar contato');
    caixa.append(h('div', { class: 'cartao' }, h('h2', {}, 'Atualizar contato ', h('span', { class: 'etiqueta nt', title: 'O formato exato do envio ao Klingo ainda não foi conferido em produção' }, 'não testado')), h('p', { class: 'suave' }, 'Preencha só o que quer mudar.'),
      h('label', { for: 'upCel' }, 'Novo celular'), cel, h('label', { for: 'upTel' }, 'Novo telefone fixo'), tel, h('label', { for: 'upMail' }, 'Novo e-mail'), mail, h('div', { class: 'acoes' }, salvar)));
  }
  const saida = h('div'); const aut = h('button', { type: 'button', class: 'btn', onclick: () => tarefa(aut, async () => { const r = await api('autorizacoes', credenciais()); saida.replaceChildren(r.ok ? (lista(r.autorizacoes).length ? resultadoTabela(r.autorizacoes) : h('p', { class: 'suave' }, 'Nenhuma autorização registrada.')) : h('div', { class: 'aviso erro' }, textoErro(r))); }) }, 'Ver minhas autorizações de convênio');
  caixa.append(h('div', { class: 'cartao' }, h('h2', {}, 'Autorizações'), aut, saida), h('div', { class: 'acoes' }, h('button', { type: 'button', class: 'btn', onclick: sair }, 'Sair')));
  return caixa;
}

function resultadoTabela(dados) {
  const arr = Array.isArray(dados) ? dados : null;
  const bruto = h('details', {}, h('summary', {}, 'Ver dados brutos (JSON)'), h('pre', {}, JSON.stringify(dados, null, 2)));
  if (!arr || !arr.length || typeof arr[0] !== 'object') return h('div', {}, h('pre', {}, JSON.stringify(dados, null, 2)));

  const corpo = h('tbody', {}, arr.slice(0, 100).map((o) => h('tr', {}, colunas.map((c) => h('td', {}, o[c] === undefined || o[c] === null ? '' : String(o[c]))))));
  return h('div', {}, h('p', { class: 'suave' }, `${arr.length} resultado(s)${arr.length > 100 ? ' (mostrando 100)' : ''}.`), h('div', { class: 'rolagem' }, h('table', {}, cab, corpo)), bruto);

}
