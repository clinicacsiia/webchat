  FLUXOGRAMA: entrada (o paciente abre a página; se este celular já foi ligado, entra direto; senão informa CPF + nascimento UMA vez, ou usa um código de convite de 8 números)
    -> validação (a página só confere o formato; QUEM CONFERE DE VERDADE é a função klingo-agendamento, com o Klingo; CPF e nascimento nunca são guardados aqui: o celular guarda só um código aleatório)
    -> lógica (uma pergunta por tela: quem vai, o quê, quando, confirmar; os horários vêm ORDENADOS pela função: médico que a família já consultou, depois o mais procurado; unidade nunca é pergunta)
    -> saída (confirmação com calendário e WhatsApp; acompanhamento tipo "rastreio" que se atualiza a cada 1 minuto; resultado dentro da página nos celulares liberados)
  Versão 2.0 — 13/11/2026 / Mudança: página nova para o paciente e a família (plano em docs/plano-jornada-familia.md). A página técnica anterior (todas as abas) continua em /agendamento/completo/.

<style>

</footer>

<script>
'use strict';
const FN = 'https://nrvuynjwcgwpjdptkiay.supabase.co/functions/v1/klingo-agendamento';
const VERSAO_PAGINA = '2026.11.14-1';
const CHAT = '../';
const GUARDA = { celular: 'csi-celular-v1', aparencia: 'csi-aparencia-v1' };

// ---------------------------------------------------------------- utilidades
const $ = (s, r = document) => r.querySelector(s);
/** Monta elemento sem innerHTML: tudo que vem da rede entra como texto. */
function h(tag, attrs, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'value') e.value = v; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const f of filhos.flat(Infinity)) if (f !== null && f !== undefined && f !== false) e.append(f.nodeType ? f : document.createTextNode(String(f)));
  return e;
}
const guardar = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* navegador sem armazenamento: a página segue sem lembrar */ } };
const ler = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const soDigitos = (v) => String(v || '').replace(/\D/g, '');
const maskCpf = (v) => soDigitos(v).slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
const maskCel = (v) => { const d = soDigitos(v).slice(0, 11); return d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d; };
function cpfOk(v) {
  const d = soDigitos(v); if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  const dv = (n) => { let s = 0; for (let i = 0; i < n; i++) s += Number(d[i]) * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === Number(d[9]) && dv(10) === Number(d[10]);
}
const hojeSP = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Sao_Paulo' }).format(new Date());
const somar = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
/** "sexta-feira, 14 de novembro" (e "hoje"/"amanhã" quando for). */
function dataBonita(iso) {
  if (!iso) return ''; const d = String(iso).slice(0, 10), [a, m, di] = d.split('-').map(Number), dow = new Date(Date.parse(d + 'T12:00:00Z')).getUTCDay();
  const rel = d === hojeSP() ? 'hoje, ' : d === somar(hojeSP(), 1) ? 'amanhã, ' : '';
  return `${rel}${SEMANA[dow]}, ${di} de ${MESES[m - 1]}${a !== Number(hojeSP().slice(0, 4)) ? ' de ' + a : ''}`;
}
/** "08:00" -> "8h", "08:30" -> "8h30". */
const horaBonita = (hh) => { if (!hh) return ''; const [a, m] = String(hh).slice(0, 5).split(':'); return `${Number(a)}h${m === '00' ? '' : m}`; };
const nomeBonito = (s) => String(s || '').toLocaleLowerCase('pt-BR').replace(/(^|\s)(\S)/g, (_, a, b) => a + b.toLocaleUpperCase('pt-BR')).replace(/\b(Da|De|Do|Das|Dos|E)\b/g, (x) => x.toLowerCase());
const quando = (iso, hora) => `${dataBonita(iso)}, às ${horaBonita(hora)}`;
const lista = (x) => (Array.isArray(x) ? x : x && Array.isArray(x.dados) ? x.dados : []);
const nomeDe = (o) => (o && (o.descr || o.nome || o.descricao || o.name)) || (o && o.id !== undefined ? String(o.id) : '');
const lerLista = (nomes) => nomes.length <= 1 ? nomes.join('') : `${nomes.slice(0, -1).join(', ')} e ${nomes.slice(-1)}`;
const anunciar = (t) => { const e = $('#avisoVoz'); e.textContent = ''; setTimeout(() => { e.textContent = t; }, 50); };

// ---------------------------------------------------------------- aparência (letra e cores, lembradas neste aparelho)
const APARENCIA = { fonte: '1', tema: 'auto' };
try { Object.assign(APARENCIA, JSON.parse(ler(GUARDA.aparencia) || '{}')); } catch { /* usa o padrão */ }
function aplicarAparencia() {
  document.documentElement.dataset.fonte = APARENCIA.fonte; document.documentElement.dataset.tema = APARENCIA.tema; guardar(GUARDA.aparencia, JSON.stringify(APARENCIA));
  const cor = { claro: '#1e3a5f', escuro: '#0c1622', contraste: '#000000', auto: '#1e3a5f' }[APARENCIA.tema]; $('meta[name=theme-color]').setAttribute('content', cor);
}
function montarAparencia() {
  const grupo = (alvo, nome, itens) => $(alvo).replaceChildren(...itens.map(([v, t]) => h('label', {}, h('input', { type: 'radio', name: nome, value: v, checked: APARENCIA[nome] === v, onchange: () => { APARENCIA[nome] = v; aplicarAparencia(); } }), t)));
  grupo('#opFonte', 'fonte', [['1', 'Normal'], ['2', 'Grande'], ['3', 'Bem grande']]);
  grupo('#opTema', 'tema', [['auto', 'Do celular'], ['claro', 'Claro'], ['escuro', 'Escuro'], ['contraste', 'Alto contraste']]);
}
aplicarAparencia(); montarAparencia();

// ---------------------------------------------------------------- conversa com a função
let ocupado = 0;
async function api(acao, dados = {}) {
  ocupado++; document.body.setAttribute('aria-busy', 'true');
  try {
    const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao, ...(S.token ? { token: S.token } : {}), ...dados }) });
    const j = await r.json().catch(() => null);
    if (!j || typeof j !== 'object') return { ok: false, motivo: 'resposta_invalida' };
    if (r.status === 401 && /^aparelho_/.test(j.motivo || '')) { esquecerCelular(); return { ...j, ok: false }; }
    return j;
  } catch { return { ok: false, motivo: 'sem_rede' }; }
  finally { if (--ocupado <= 0) document.body.removeAttribute('aria-busy'); }
}
/** Mensagens com carinho: sempre dizem o que fazer a seguir e nunca culpam a pessoa. */
const MSG = {
  sem_rede: 'Parece que a internet falhou. Confira o sinal e toque de novo, sem pressa.', resposta_invalida: 'O sistema respondeu algo diferente do esperado. Vamos tentar de novo daqui a pouco?',
  nao_confere: 'Não encontramos este cadastro. Às vezes é só um número trocado: confira o CPF e a data de nascimento e tente de novo. Se preferir, a recepção ajuda.',
  tentativas_demais: 'Por segurança, esta tentativa ficou bloqueada por um tempo. Você pode pedir ajuda à recepção agora mesmo.', limite: 'O sistema da clínica está bem ocupado. Espere uns segundos e toque de novo.',

    if (hoje) acoes.append(botao('Cheguei', async () => { const r = await api('fam_checkin', { voucher: m.voucher, confirmar: true }); if (!r.ok) return void saida.replaceChildren(h('div', { class: 'aviso erro', role: 'alert' }, textoErro(r))); S.mensagem = { tipo: 'ok', texto: `Que bom que chegou!${r.recepcao ? ' Vá até ' + r.recepcao + '.' : ''}` }; S.marcacoes = null; desenhar(); }, 'prim'));

      botao('Não vou poder ir', () => { saida.replaceChildren(h('div', { class: 'aviso atencao', role: 'alert' }, h('p', {}, 'Quer mesmo cancelar? O horário volta para outras pessoas.'), h('div', { class: 'duas' }, botao('Não, manter', () => saida.replaceChildren(), 'prim'),

}
async function carregarRastreio(silencioso = false) {
  const r = await api('fam_acompanhar'); if (!r.ok) { if (!silencioso) { S.marcacoes = []; S.mensagem = { tipo: 'erro', texto: textoErro(r) }; } return; }
  S.marcacoes = r.marcacoes; S.previsoes = r.previsoes || {}; S.espera = r.espera || []; S.atualizadoEm = Date.now(); if (S.tela === 'acompanhar') desenhar();
}
function pararRelogio() { if (S.relogio) { clearInterval(S.relogio.a); clearInterval(S.relogio.b); document.removeEventListener('visibilitychange', S.relogio.v); } S.relogio = null; }

}
const textoIdade = () => { const s = Math.round((Date.now() - S.atualizadoEm) / 1000); return s < 20 ? 'agora há pouco' : s < 90 ? 'há cerca de 1 minuto' : `há ${Math.round(s / 60)} minutos`; };

  return h('div', {}, topo, h('p', { class: 'suave' }, h('span', { class: 'ponto', 'aria-hidden': 'true' }), 'Atualizando sozinho a cada minuto. Última vez: ', h('span', { id: 'idade' }, textoIdade()), '.'),
    (S.espera || []).filter((e) => e.estado === 'oferecido' && e.oferta).map(cartaoOferta), ativas.length ? ativas.map(cartaoRastreio) : h('div', { class: 'cartao' }, h('p', {}, 'Você ainda não tem marcações por aqui.'), botao('Marcar agora', () => ir('inicio'), 'prim')),

    h('div', { class: 'pilha' }, botao('Atualizar agora', () => carregarRastreio()), botao('Voltar ao início', () => ir('inicio')), ajuda()));
}

// ---------------------------------------------------------------- 6) resultado, acesso e convite
const ehPdf = (s) => typeof s === 'string' && s.length > 100 && /^JVBERi0/.test(s.trim());
function achar(o, r = { pdf: null, html: null }, prof = 0) { if (!o || prof > 4) return r; if (typeof o === 'string') { if (ehPdf(o) && !r.pdf) r.pdf = o.trim(); else if (/<\s*(html|body|div|p|table)\b/i.test(o) && !r.html) r.html = o; return r; } if (typeof o === 'object') for (const x of Object.values(o)) achar(x, r, prof + 1); return r; }
function telaVerLaudo() {
  const m = S.ver.m; if (!m) return telaInicio();
  const saida = h('div', { 'aria-live': 'polite' }, h('p', { class: 'suave' }, 'Abrindo o resultado…'));

    const r = await api('fam_laudo', { voucher: m.voucher });

      partes.push(h('a', { class: 'btn prim', href: url, target: '_blank', rel: 'noopener' }, 'Abrir o resultado em PDF'), h('a', { class: 'btn', href: url, download: arq.name }, 'Salvar no celular'));

}

    h('div', { class: 'cartao' }, h('h2', {}, 'Eu sei todos os dados'), h('p', { class: 'suave' }, 'Informe os dados exatamente como estão no cadastro da clínica. Se outro celular já abre este resultado, ele recebe um aviso e a liberação pode levar até 24 horas.'),
