<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de atendimento · CSI</title>
<meta name="theme-color" content="#1e3a5f">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    /* Design system CSI: tokens obrigatórios */
    --csi-primary: #0088cc;
    --csi-primary-hover: #0077b3;
    --csi-sidebar-bg: #1e3a5f;
    --csi-sidebar-hover: #2a4d7a;
    --csi-danger: #e74c3c;
    --csi-danger-bg: #fdf2f0;
    --csi-success: #2ecc71;
    --csi-surface: #ffffff;
    --csi-background: #f8f9fa;
    --csi-border: #eaedf1;
    --csi-text-main: #333333;
    --csi-text-muted: #7f8c8d;
    --font-family: 'Inter', system-ui, sans-serif;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    /* Complementares: o azul e o vermelho obrigatórios não chegam a 4,5:1 com texto pequeno; estes chegam */
    --csi-primary-strong: #006ba1;        /* fundo com texto branco e texto azul sobre branco (5,8:1) */
    --csi-primary-strong-hover: #005a89;
    --csi-primary-soft: #e6f4fb;
    --csi-danger-strong: #b3261e;         /* texto de alerta sobre --csi-danger-bg */
    --csi-success-strong: #167a43;        /* texto de estado positivo */
    --csi-success-soft: #e8f8ef;
    --csi-warning-strong: #8a5a00;
    --csi-warning-soft: #fff4dc;
    --csi-text-secondary: #5a6878;        /* texto secundário legível (5,7:1); o muted fica para o que é só apoio */
    --csi-focus: 0 0 0 3px rgba(0,136,204,.28);
    --csi-border-strong: #cfd6df;         /* borda de campos de formulário */
    --csi-gap: 16px;
    --csi-ease: .15s ease;
    /* Nomes antigos do painel apontam para os tokens novos */
    --verde-escuro: var(--csi-sidebar-bg); --verde: var(--csi-primary-strong); --verde-claro: var(--csi-primary-soft); --fundo: var(--csi-background); --papel: var(--csi-surface);
    --texto: var(--csi-text-main); --suave: var(--csi-text-secondary); --linha: var(--csi-border); --erro: var(--csi-danger-strong); --aviso: var(--csi-warning-strong); --azul: var(--csi-primary-strong);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: hidden; }
  body { font-family: var(--font-family); font-size: 15px; line-height: 1.4; color: var(--texto); background: var(--fundo); -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--csi-primary); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .btn { border: 1px solid var(--csi-border-strong); background: var(--papel); border-radius: var(--radius-md); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background-color var(--csi-ease), border-color var(--csi-ease), color var(--csi-ease); }
  .btn:hover { background: var(--csi-primary-soft); border-color: var(--csi-primary); }
  .btn.prim { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn.prim:hover { background: var(--csi-primary-strong-hover); border-color: var(--csi-primary-strong-hover); }
  .btn.perigo { color: var(--erro); border-color: var(--csi-danger); }
  .btn.perigo:hover { background: var(--csi-danger-bg); border-color: var(--csi-danger); }
  .anexo-caixa { margin-top: 6px; font-size: 13.5px; }
  .anexo-sub { margin: 8px 0 2px; font-weight: 650; }
  .anexo-lista { margin: 0 0 4px; padding-left: 18px; }
  .anexo-ops { color: var(--suave); font-size: 12.5px; }
  .anexo-tag { margin-left: 6px; border-radius: 999px; padding: 1px 7px; font-size: 11.5px; background: var(--verde-claro); }
  .anexo-tag.duvida, .anexo-tag.nenhum, .anexo-tag.media { background: var(--csi-warning-soft); color: var(--aviso); }
  .conferir { margin-top: 8px; border: 1px solid var(--linha); border-radius: var(--radius-md); padding: 6px 10px; background: var(--papel); }
  .conferir summary { cursor: pointer; font-weight: 650; }
  .conf-linha { border-top: 1px solid var(--linha); padding: 8px 0; display: grid; gap: 6px; }
  .conf-exame { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .conf-res { display: flex; flex-wrap: wrap; gap: 6px; }
  .conf-acoes { display: flex; gap: 8px; justify-content: flex-end; padding-top: 6px; }
  .btn:disabled { opacity: .55; cursor: default; }
  input[type=text], input[type=email], input[type=password], input[type=search], input[type=url], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--csi-border-strong); border-radius: var(--radius-md); background: var(--papel); transition: border-color var(--csi-ease), box-shadow var(--csi-ease);
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--csi-primary); box-shadow: var(--csi-focus); }
  label.rot { display: block; font-weight: 600; font-size: 13.5px; margin: 0 0 4px; }
  .campo { margin-bottom: 14px; }
  .dica { color: var(--suave); font-size: 13px; margin: 4px 0 0; }
  .erro { color: var(--erro); font-size: 14px; min-height: 1.2em; margin: 0 0 10px; }

  /* Login e telas de espera */
  .centro { min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: var(--verde-escuro); }
  .cartao { width: 100%; max-width: 380px; background: var(--papel); border-radius: var(--radius-lg); padding: 26px 24px; box-shadow: var(--shadow-md); }
  .cartao h1 { font-size: 22px; margin: 0 0 4px; }
  .logo-cartao { display: block; width: min(200px, 70%); height: auto; margin: 0 auto 14px; }
  @media (prefers-color-scheme: dark) { .logo-cartao { background: #fff; border-radius: 12px; padding: 8px 12px; } }
  .cartao p.sub { margin: 0 0 18px; color: var(--suave); }
  .cartao .btn.prim { width: 100%; padding: 12px; font-size: 15px; }
  .link { background: none; border: 0; color: var(--azul); cursor: pointer; padding: 6px 0; font-size: 14px; text-decoration: underline; }

  /* App */
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); height: 100dvh; }
  .lateral { background: var(--csi-sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; min-height: 0; overflow-y: auto; }
  .marca { font-weight: 700; font-size: 18px; padding: 6px 12px 16px; display: flex; align-items: center; gap: 10px; }
  .marca i { width: 10px; height: 10px; border-radius: 50%; background: #9aa9a3; display: inline-block; }
  .marca i.on { background: var(--csi-success); }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: none; border: 0; color: #dbe6f3; text-align: left; padding: 11px 12px; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 14.5px; transition: background-color var(--csi-ease), color var(--csi-ease); }
  .nav button:hover { background: var(--csi-sidebar-hover); color: #fff; }
  .nav button:focus-visible { outline-color: #fff; outline-offset: -3px; }
  .nav button[aria-current=page], .nav button[aria-current=page]:hover { background: var(--csi-primary-strong); color: #fff; }
  .triagem { background: var(--csi-primary-soft); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .triagem b { margin-right: 8px; }
  .pre { background: var(--csi-warning-soft); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .pre b { margin-right: 8px; }
  .pre .acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pre details { margin-top: 4px; }
  .pre dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0 0; }
  .pre dt { color: var(--suave); }
  .pre dd { margin: 0; overflow-wrap: anywhere; }
  .urg { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--csi-success-soft); color: var(--csi-success-strong); }
  .urg.media { background: var(--csi-warning-soft); color: var(--csi-warning-strong); }
  .urg.alta { background: var(--csi-danger-bg); color: var(--csi-danger-strong); border: 1px solid var(--csi-danger); }
  .selo { background: #f2b84b; color: #3b2a00; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 8px; min-width: 22px; text-align: center; }
  .espaco { flex: 1; }
  .eu { padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.14); font-size: 13.5px; }
  .eu b { display: block; font-size: 14px; }
  .eu span { color: #c9d8ea; }
  .eu .acoes { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .eu .acoes button { background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; font-size: 13px; transition: background-color var(--csi-ease); }
  .eu .acoes button:hover { background: var(--csi-sidebar-hover); }
  .eu .acoes button:focus-visible { outline-color: #fff; }
  /* Dados institucionais no rodapé da sidebar (bloco isolado; some na barra inferior do celular) */
  .inst { padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,.14); font-size: 11.5px; line-height: 1.45; color: #c9d8ea; }
  .inst b { display: block; color: #fff; font-size: 12px; margin-bottom: 6px; }
  .inst p { margin: 0 0 6px; overflow-wrap: anywhere; }
  .inst p:last-child { margin-bottom: 0; }
  .inst .versao { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.14); font-size: 11px; opacity: .75; }
  .conteudo { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--csi-background); }
  .pagina { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; }
  .pagina h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.25; }
  .pagina p.sub { margin: 0 0 18px; color: var(--suave); }

  /* Atendimento */
  .inbox { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--csi-gap); padding: var(--csi-gap); }
  .lista { border: 1px solid var(--linha); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; background: var(--papel); display: flex; flex-direction: column; min-height: 0; }
  .filtros { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
  .chip { border: 1px solid var(--csi-border-strong); background: var(--papel); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background-color var(--csi-ease), border-color var(--csi-ease), color var(--csi-ease); }
  .chip:hover { border-color: var(--csi-primary); background: var(--csi-primary-soft); }
  .chip[aria-pressed=true] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .itens { overflow-y: auto; flex: 1; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--linha); padding: 12px 16px; cursor: pointer; }
  .item { transition: background-color var(--csi-ease); }
  .item:hover { background: var(--csi-background); }
  .item[aria-current=true] { background: var(--csi-primary-soft); box-shadow: inset 3px 0 0 var(--csi-primary); }
  .item .l1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; }
  .item .l1 span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Paciente esperando resposta humana há mais de 2 minutos: fundo vermelho e cronômetro. */
  .item.espera { background: var(--csi-danger-bg); box-shadow: inset 4px 0 0 var(--csi-danger); }
  .item.espera:hover { background: #fbe4e0; }
  .cron { font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 999px; padding: 1px 8px; background: var(--csi-danger-bg); color: var(--csi-danger-strong); border: 1px solid var(--csi-danger); }
  .item.espera .cron { background: var(--csi-danger); color: #fff; }
  .item .hora { font-weight: 400; font-size: 12px; color: var(--suave); flex: none; }
  .item .l2 { display: flex; justify-content: space-between; gap: 8px; color: var(--suave); font-size: 13.5px; margin-top: 2px; }
  .item .l2 .prev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .l3 { font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .tag { display: inline-block; border-radius: var(--radius-sm); padding: 1px 8px; font-size: 12px; font-weight: 650; }
  .tag.aguardando { background: var(--csi-warning-soft); color: var(--aviso); }
  .tag.em_atendimento { background: var(--csi-primary-soft); color: var(--csi-primary-strong); }
  .tag.encerrada { background: var(--csi-success-soft); color: var(--csi-success-strong); }
  .nl { background: var(--csi-primary-strong); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; padding: 0 6px; flex: none; }
  .vazio { color: var(--suave); text-align: center; padding: 36px 20px; }
  .vazio b { display: block; color: var(--texto); margin-bottom: 4px; }

  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--csi-background); border: 1px solid var(--linha); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .chat-topo { background: var(--papel); border-bottom: 1px solid var(--linha); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chat-topo .quem { flex: 1; min-width: 160px; }
  .chat-topo .quem b { font-size: 16px; display: block; }
  .chat-topo .quem span { font-size: 13px; color: var(--suave); }
  .chat-topo .quem a { color: var(--azul); }
  .voltar { display: none; }
  /* Quadro: outra forma de ver as conversas (dentro do Atendimento) */
  .modo { display: inline-flex; border: 1px solid var(--csi-border-strong); border-radius: 999px; overflow: hidden; margin-right: 4px; }
  .modo button { border: 0; background: var(--papel); padding: 5px 12px; font-size: 13px; font-weight: 650; cursor: pointer; transition: background-color var(--csi-ease); }
  .modo button:hover { background: var(--csi-primary-soft); }
  .modo button[aria-pressed=true], .modo button[aria-pressed=true]:hover { background: var(--csi-sidebar-bg); color: #fff; }
  #quadro { display: none; flex-direction: column; min-width: 0; min-height: 0; background: var(--fundo); border: 1px solid var(--linha); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .inbox.quadro { grid-template-columns: 1fr; }
  .inbox.quadro .lista, .inbox.quadro .chat { display: none; }
  .inbox.quadro #quadro { display: flex; }
  .inbox.quadro.aberta { grid-template-columns: minmax(0, 1fr) minmax(360px, 42%); }
  .inbox.quadro.aberta .chat { display: flex; }
  .q-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; background: var(--papel); border-bottom: 1px solid var(--linha); }
  .q-topo input { width: 190px; padding: 5px 10px; font-size: 13px; }
  .q-colunas { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; overflow: auto; align-items: flex-start; }
  .q-col { flex: 0 0 260px; background: #eef1f5; border-radius: var(--radius-md); display: flex; flex-direction: column; max-height: 100%; min-height: 0; }
  .q-col.alvo { outline: 2px dashed var(--csi-primary); }
  .q-col h3 { margin: 0; padding: 10px 12px 6px; font-size: 13.5px; display: flex; justify-content: space-between; gap: 6px; }
  .q-col h3 span { color: var(--suave); font-weight: 600; }
  .q-lista { overflow-y: auto; padding: 4px 8px 8px; display: grid; gap: 7px; min-height: 30px; }
  .q-card { text-align: left; background: var(--csi-surface); border: 1px solid var(--csi-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 10px 12px; cursor: pointer; display: block; width: 100%; transition: box-shadow var(--csi-ease), border-color var(--csi-ease), transform var(--csi-ease); }
  /* o leve levantar só vale com o mouse parado: não interfere no arrastar e soltar nem no clique */
  .q-card:hover:not(:active) { border-color: var(--csi-primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .q-card[aria-current=true] { border-color: var(--csi-primary); background: var(--csi-primary-soft); }
  .q-item { position: relative; }
  .q-x { position: absolute; top: 4px; right: 6px; border: 0; background: transparent; color: var(--suave); font-size: 18px; line-height: 1; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
  .q-x:hover { background: var(--csi-danger-bg); color: var(--csi-danger); }
  .q-item .q-card b { padding-right: 22px; }
  .q-card.p2 { border-left: 4px solid #e08a00; } .q-card.p3 { border-left: 4px solid var(--csi-danger); }
  .q-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-card .q2 { color: var(--suave); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-card .q3 { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; }
  .q-chip { border-radius: var(--radius-sm); padding: 1px 7px; background: #eef1f5; color: var(--suave); font-weight: 650; }
  .q-chip.alerta { background: var(--csi-danger-bg); color: var(--csi-danger-strong); border: 1px solid var(--csi-danger); } .q-chip.aviso { background: var(--csi-warning-soft); color: var(--aviso); }
  #cartaoJ:empty { display: none; }
  .cartaoJ { background: var(--csi-background); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cartaoJ select { width: auto; padding: 5px 8px; font-size: 13px; }
  /* A mesma pessoa em várias conversas, exame em aberto e remarcação */
  #pessoa:empty, #exameAberto:empty { display: none; }
  .pessoa { background: var(--csi-primary-soft); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .pessoa summary { cursor: pointer; font-weight: 650; }
  .pessoa ul { margin: 6px 0 0; padding-left: 18px; } .pessoa li { margin: 5px 0; overflow-wrap: anywhere; }
  .pessoa .btn { padding: 2px 8px; font-size: 12px; margin-left: 4px; }
  .ex-caixa { background: var(--csi-warning-soft); border-bottom: 1px solid #f0dca8; padding: 8px 14px; font-size: 13.5px; }
  .ex-caixa.falta { background: var(--csi-danger-bg); border-color: var(--csi-danger); }
  .ex-acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; } .ex-acoes .btn { padding: 4px 10px; font-size: 13px; }
  .ex-caixa .urg { margin-left: 6px; }
  .sug { background: var(--csi-primary-soft); border: 1px solid #b9dcee; border-radius: var(--radius-md); padding: 8px 10px; margin: 8px; font-size: 13.5px; }
  .sug-acoes { display: flex; gap: 6px; margin-top: 6px; } .sug-acoes .btn { padding: 4px 10px; font-size: 13px; }
  .msg-outra { align-self: center; background: rgba(30,58,95,.06); color: var(--suave); font-size: 12px; padding: 2px 10px; border-radius: 999px; margin: 6px 0 2px; }
  /* Aba Jornada: onde está cada paciente, ao vivo */
  .jornada { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--fundo); }
  .j-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; font-size: 13px; background: var(--papel); border-bottom: 1px solid var(--linha); }
  .j-status h2 { margin: 0 6px 0 0; font-size: 17px; }
  .j-status .ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--csi-success); flex: none; }
  .j-status.aviso .ponto { background: #e08a00; }
  .j-status.ruim { background: var(--csi-danger-bg); color: var(--erro); font-weight: 650; }
  .j-status.ruim .ponto { background: var(--erro); }
  .j-atencao { background: var(--csi-danger-bg); border-bottom: 1px solid var(--csi-danger); padding: 8px 12px; max-height: 32vh; overflow-y: auto; }
  .j-atencao h3 { margin: 0 0 4px; font-size: 14px; color: var(--erro); }
  .j-atencao:not(.aberto) { padding-top: 0; padding-bottom: 0; } .j-atencao:not(.aberto) h3 { margin: 0; }
  .j-atencao-bt { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 8px 0; cursor: pointer; font: inherit; font-weight: 700; color: var(--erro); }
  .j-atencao-bt:focus-visible { outline: 2px solid var(--csi-primary); outline-offset: 2px; }
  .j-barra { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 12.5px; background: var(--csi-danger-bg); color: var(--erro); border-bottom: 1px solid var(--linha); overflow: hidden; }
  .j-barra[hidden] { display: none; }
  .j-barra-rot { flex: none; font-weight: 700; }
  .j-barra-via { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  .j-barra-txt { display: inline-block; padding-left: 100%; animation: j-passa 22s linear infinite; }

  /* Próximo passo: a única coisa que o atendente precisa decidir agora, sempre visível */
  #proximo:empty { display: none; }
  .proximo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--csi-primary-soft); border-bottom: 1px solid var(--linha); border-left: 5px solid var(--csi-primary); }
  .proximo.media { background: var(--csi-warning-soft); border-left-color: #e08a00; } .proximo.alta { background: var(--csi-danger-bg); border-left-color: var(--csi-danger); }
  .proximo .texto { flex: 1; min-width: 180px; } .proximo .texto b { display: block; font-size: 15px; }
  .proximo .texto span { font-size: 13px; color: var(--suave); }
  /* Os avisos e dados de apoio ficam numa área que rola e se ajusta à altura da tela, para a conversa nunca ficar sem espaço */
  /* Telas médias/pequenas: a área de apoio fica FECHADA por padrão (só a faixa "Próximo passo" aparece) e abre sob demanda,
     para nunca cobrir as mensagens sem o atendente pedir. Telas largas: vira uma coluna ao lado da conversa. */
  #contexto { display: none; flex: none; overflow-y: auto; overscroll-behavior: contain; background: var(--csi-surface); border-bottom: 1px solid var(--linha); }
  #contexto.aberto { display: block; max-height: 45vh; }
  #ctxToggle { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 16px; border: 0; border-bottom: 1px solid var(--linha); background: var(--csi-surface); color: var(--csi-primary-strong); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; text-align: left; }
  #ctxToggle:hover { background: var(--csi-primary-soft); }
  #ctxToggle .seta { transition: transform .15s; } #ctxToggle[aria-expanded="true"] .seta { transform: rotate(180deg); }
  #contexto .galeria img, #contexto .anexo-caixa img { max-height: 70vh; object-fit: contain; background: #fff; border: 1px solid var(--linha); cursor: zoom-in; }
  @media (max-height: 720px) { #contexto.aberto { max-height: 40vh; } .chat-topo { padding: 6px 12px; } .proximo { padding: 6px 12px; } }
  /* Contador de avisos no botão: vermelho, para ninguém esconder a área sem perceber que há algo a conferir */
  .ctx-n { display: inline-block; min-width: 20px; padding: 1px 7px; margin-left: 8px; border-radius: 999px; background: #c0392b; color: #fff; font-size: 12.5px; font-weight: 700; text-align: center; animation: ctxPulsa 1.6s ease-in-out infinite; }
  @keyframes ctxPulsa { 50% { box-shadow: 0 0 0 4px rgba(192, 57, 43, .25); } } @media (prefers-reduced-motion: reduce) { .ctx-n { animation: none; } }
  @media (min-width: 1280px) {
    /* Tela larga: a área de apoio é uma coluna à direita da conversa. Escondida, vira uma faixa fina na lateral (com o contador de avisos)
       e a conversa ocupa o resto da largura. */
    .chat { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
    .chat > .chat-topo { grid-column: 1 / -1; grid-row: 1; } .chat > #proximo { grid-column: 1 / -1; grid-row: 2; }
    .chat > #ctxToggle { grid-column: 2; grid-row: 3; width: 380px; border-left: 1px solid var(--linha); }
    .chat > #ctxToggle[aria-expanded="false"] { grid-row: 3 / 6; width: 46px; flex-direction: column; justify-content: flex-start; padding: 12px 0; border-bottom: 0; }
    .chat > #ctxToggle[aria-expanded="false"] .rot { writing-mode: vertical-rl; }
    .chat > #ctxToggle[aria-expanded="false"] .seta { transform: rotate(90deg); } .chat > #ctxToggle[aria-expanded="true"] .seta { transform: rotate(-90deg); }
    .chat > #ctxToggle[aria-expanded="false"] .ctx-n { margin: 8px 0 0; }
    .chat > #contexto.aberto { display: block; max-height: none; width: 380px; grid-column: 2; grid-row: 4 / 6; border-left: 1px solid var(--linha); border-bottom: 0; }
    .chat > .msgs { grid-column: 1; grid-row: 3 / 5; } .chat > .compor { grid-column: 1; grid-row: 5; }
  }
  /* Celular: cabeçalho e avisos mais enxutos para sobrar espaço para ler as mensagens */
  @media (max-width: 640px) {

    .chat-topo .assumir-topo { display: none; }  /* o aviso logo abaixo já tem o botão Assumir */
    .chat-topo .quem span { line-height: 1.5; }

    .chat-topo .quem span { font-size: 12px; }
    .chat-topo .btn, .chat-topo select { padding: 5px 10px; font-size: 13px; }
    .proximo { padding: 6px 10px; gap: 6px; }

    #contexto.aberto { max-height: 55vh; } #ctxToggle { padding: 6px 10px; }
    .msgs { min-height: 38vh; padding: 10px; }
    .msg { max-width: 88%; }

  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }

  /* ---------- filtro de unidade (fica só no topo): vale para Atendimento, Fila, Avisos, Jornada, Contatos, Médicos (lista e mapa de salas) e Aprendizado ---------- */
  // Unidades da agenda dos médicos (CSI, RM/TC e Desenvoar). Os nomes variam conforme a origem (Klingo: "CSI 1", "CSI 2", "CSI Pediatria";
  // agenda: "CLÍNICA DE SAÚDE E IMAGEM - RM/TC"; chat: "rmtc"), então tudo vira uma chave. Mesma regra de public.unidade_chave() no banco.
  // Regra de ouro: se não dá para saber a unidade de alguém (ou de algo), aparece em TODAS as unidades.
  const UNIDADES_PAINEL = [['csi', 'CSI'], ['rmtc', 'CSI RM/TC'], ['desenvoar', 'Desenvoar']];

    if (/desenvoar|pediatria/.test(t)) return 'desenvoar';
    if (/rm.?\/?.?tc|csi 2/.test(t)) return 'rmtc';
    if (/csi/.test(t)) return 'csi';

  /* ---------- aba Fila: quem chegou e quem é o próximo ---------- */

  const F = { itens: [], tRecarga: null, acesso: null, ident: {}, un: {} };
  const hojeFila = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  async function carregarFila() {
    const { data, error } = await db.from('fila_chegada').select('id,nome,senha,status,origem,conta_id,chegou_em,chamado_em,email,telefone,pede_senha').in('status', ['aguardando', 'chamado']).order('chegou_em').order('id');
    if (error) throw error;
    const hoje = hojeFila();
    F.itens = (data || []).filter((x) => new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Sao_Paulo' }).format(new Date(x.chegou_em)) === hoje);
    // Identificação automática (paciente novo ou já cadastrado, conversas, exames em aberto, exames de hoje no Klingo). Sem o SQL novo, a fila segue sem ela.
    F.ident = {};
    try { const { data: ids, error: eId } = await db.rpc('fila_identificar_todos'); if (!eId && Array.isArray(ids)) for (const i of ids) F.ident[i.id] = i; } catch { /* sem identificação */ }
    // Unidade provável de cada pessoa (exame de hoje no Klingo > pedido do chat > unidade do formulário). Sem resposta = aparece em todas.
    F.un = {};
    try { const { data: us, error: eU } = await db.rpc('fila_unidades_hoje'); if (!eU && Array.isArray(us)) for (const u of us) F.un[u.id] = u; } catch { /* sem unidade: aparece em todas */ }

    const sl = document.getElementById('seloFila'); if (sl) { sl.textContent = n; sl.hidden = n === 0; }
  }
  const filaVisivel = () => F.itens.filter((x) => passaUnidade((F.un[x.id] || {}).unidades));
  const ROT_FONTE_UN = { klingo: 'exame de hoje no Klingo', pedido: 'pedido no chat', formulario: 'escolhida no formulário do chat' };
  function agendarFila() { clearTimeout(F.tRecarga); F.tRecarga = setTimeout(async () => { try { await carregarFila(); if (S.aba === 'fila') renderFila(); } catch { /* tenta de novo no próximo evento */ } }, 250); }

  /* ---------- aba Jornada: onde está cada paciente, ao vivo ---------- */

  async function consultaCardsJ() {

  // Atenção: só quem está parado há no máximo 2 dias (mais velho que isso sai da lista), do mais recente (minutos, horas) ao mais antigo (ontem...).

  const escoreJ = (k) => (k.n_tarefas_vencidas > 0 ? 50 : 0) + (ESCORE_J[k.coluna] ?? 30);
  const pessoaDoCartao = (k) => (J.pessoas.get(k.id) || {}).pessoa || null;
  function agruparJ(lista) {

    const porPessoa = new Map(), out = [];

      const pe = pessoaDoCartao(k);
      if (!pe) { out.push(k); continue; }
      if (!porPessoa.has(pe)) porPessoa.set(pe, []);
      porPessoa.get(pe).push(k);
    }
    for (const [, ks] of porPessoa) {

  async function buscarTodos(tabela, colunas, ordem) {
    const out = [];
    for (let i = 0; i < 20000; i += 1000) {
      const { data, error } = await db.from(tabela).select(colunas).order(ordem, { ascending: false }).range(i, i + 999);
      if (error) throw error;
      out.push(...data); if (data.length < 1000) break;
    }
    return out;
  }

  function contatosFiltrados() {
    const q = S.buscaContatos.trim().toLowerCase(), qd = soDigitos(q);
    const corte = { hoje: 1, '7d': 7, '30d': 30 }[S.periodo];
    const desde = corte ? new Date(Date.now() - (corte === 1 ? 0 : corte * 86400000)) : null;
    if (corte === 1) desde.setHours(0, 0, 0, 0);
    const unPorContato = new Map();
    if (UN.sel) for (const cv of S.conversas || []) { if (!cv.contato_id) continue; const k = unidadesConversas([cv.id]); if (k.length) unPorContato.set(cv.contato_id, [...new Set([...(unPorContato.get(cv.contato_id) || []), ...k])]); }
    return S.contatos.filter((x) => {
      if (UN.sel && !passaUnidade(unPorContato.get(x.id))) return false;
      if (desde && new Date(x.criado_em) < desde) return false;
      if (S.tagFiltro && !(x.tags || []).includes(S.tagFiltro)) return false;
      if (!q) return true;
      return x.nome.toLowerCase().includes(q) || (x.email || '').toLowerCase().includes(q) || (qd && x.telefone.includes(qd)) || (x.tags || []).some((t) => t.toLowerCase().includes(q)) || (x.origem || '').toLowerCase().includes(q);

      catch (e) { erro.textContent = /already|registered/i.test(msgErro(e)) ? 'Este e-mail já está cadastrado.' : msgErro(e); btn.disabled = false; btn.textContent = 'Adicionar pessoa'; }
    });

  async function adicionarPessoa(nome, email, senha, papel) {
    /* cliente separado, sem guardar sessão, para não deslogar o administrador */
    const outro = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    /* o cadastro só vira equipe se o e-mail foi convidado antes por um administrador (senão vira conta de paciente) */
    const { error: eConvite } = await db.rpc('equipe_convidar', { p_email: email, p_papel: papel });
    /* banco ainda sem a função (migração não aplicada): segue como antes; com a função, qualquer outro erro interrompe */
    if (eConvite && !/could not find the function|PGRST202|schema cache/i.test(msgErro(eConvite) + ' ' + (eConvite.code || ''))) throw eConvite;
    const { data, error } = await outro.auth.signUp({ email, password: senha, options: { emailRedirectTo: PAINEL_URL, data: { nome, trocar_senha: true } } });
    if (error) throw error;
    if (!data.user || (data.user.identities && !data.user.identities.length)) throw new Error('Este e-mail já está cadastrado.');
    let ok = false;
    for (let i = 0; i < 5 && !ok; i++) {
      const { data: r, error: e2 } = await db.from('agentes').update({ papel, ativo: true }).eq('id', data.user.id).select('id');
      if (e2) throw e2;
      ok = !!(r && r.length); if (!ok) await new Promise((res) => setTimeout(res, 400));
    }
    if (!ok) throw new Error('Conta criada, mas não foi possível liberar o acesso. Libere na lista abaixo.');
  }

      /* --- C. Horários por dia --- */

      }

      /* --- B. Convênios e particularidades --- */
      // Filtros para a recepção: escopo (deste médico / da unidade / todos), situação (aceitos, não aceitos, com restrição) e exame.
      // Escopo = convênios que têm preço no Klingo para algum exame do médico/da unidade (campos procs_medico e n_unidade do banco).
      // Convênio que a equipe já ajustou (desligado ou com restrição) aparece sempre, para nunca esconder uma regra existente.
      const CVQ = { q: '', escopo: null, estado: 'todos', exame: '' };
      function pintarConvenios() {
        const lista = h('div', {}), barra = h('div', { class: 'filtros', style: 'padding:6px 0;border:0' }), resumo = h('p', { class: 'dica' });
        const temCob = D.convenios.some((c) => Array.isArray(c.procs_medico));

        const exameSel = temCob && D.procs.length ? h('select', { 'aria-label': 'Mostrar só convênios que têm preço para o exame', 'data-filtro-exame': '1', onchange: (ev) => { CVQ.exame = ev.target.value; desenhar(); } },
          h('option', { value: '' }, 'Qualquer exame'), D.procs.map((pr) => h('option', { value: pr.id, selected: String(pr.id) === String(CVQ.exame) }, (pr.consulta ? '(consulta) ' : '') + nomeMedico(pr.nome)))) : null;
        const chip = (rot, ativo, fn, dado) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(ativo), 'data-filtro': dado, onclick: fn }, rot);
        const desenhar = () => {
          const q = CVQ.q.trim().toLowerCase();
          const porBusca = D.convenios.filter((c) => !q || c.nome.toLowerCase().includes(q));
          const base = porBusca.filter((c) => noEscopo(c, CVQ.escopo) && doExame(c));
          const visiveis = base.filter(situacoes[CVQ.estado]);
          const cont = (fn) => base.filter(fn).length;
          barra.replaceChildren(
            ...(temCob ? [
              chip(`Deste médico (${D.convenios.filter((c) => noEscopo(c, 'medico')).length})`, CVQ.escopo === 'medico', () => { CVQ.escopo = 'medico'; desenhar(); }, 'escopo-medico'),
              chip(`Da unidade ${nomeUnidade(m.unidade)} (${D.convenios.filter((c) => noEscopo(c, 'unidade')).length})`, CVQ.escopo === 'unidade', () => { CVQ.escopo = 'unidade'; desenhar(); }, 'escopo-unidade'),
              chip(`Todos os convênios (${D.convenios.length})`, CVQ.escopo === 'todos', () => { CVQ.escopo = 'todos'; desenhar(); }, 'escopo-todos'),

            const mudar = async (proc, aceitaNovo) => {
              const x = await db.rpc('medico_convenio_salvar', { p_prof: m.profissional, p_operadora: c.nome, p_proc: proc, p_aceita: aceitaNovo });

              h('label', { style: 'display:flex;gap:8px;align-items:center' },
                h('input', { type: 'checkbox', 'data-conv': c.chave, checked: aceita, disabled: bloqueadoGlobal || D.particular, onchange: (ev) => mudar(0, ev.target.checked) }),
                h('b', {}, nomeMedico(c.nome)), h('span', { class: 'dica' }, (bloqueadoGlobal ? 'desligado para toda a clínica (aba Convênios)' : D.particular ? 'médico só particular' : c.fora ? 'não aceita' : 'aceita') + semPreco)),

          }) : [h('p', { class: 'dica', 'data-sem-convenio': '1' }, CVQ.escopo !== 'todos' ? 'Nenhum convênio com esse filtro. Para ver os outros, escolha "Todos os convênios" ou limpe os filtros.' : 'Nenhum convênio com esse filtro.')]));
        };
        const part = h('label', { style: 'display:flex;gap:8px;align-items:center;margin:4px 0' },
          h('input', { type: 'checkbox', 'data-particular': '1', checked: D.particular, onchange: async (ev) => {

          temCob ? h('p', { class: 'dica' }, 'Os filtros "Deste médico" e "Da unidade" mostram os convênios que têm preço no Klingo para algum exame do médico (ou da unidade). É um palpite pelas tabelas de preço, não a lista oficial de cobertura. O convênio que você já ajustou aparece sempre. Faltou algum? Use "Todos os convênios".') : null,
          part, busca, barra, resumo, lista);
      }

      /* --- C. Folgas e bloqueios por data --- */

        const ini = h('input', { type: 'date', 'aria-label': 'Primeiro dia', min: new Date().toISOString().slice(0, 10) }), fim = h('input', { type: 'date', 'aria-label': 'Último dia (se for só um dia, deixe em branco)' });

          if (falha(x)) return;

        };
        abas.exc.replaceChildren(
          h('p', { class: 'dica' }, 'Datas em que o médico não atende em nenhuma unidade. O chat deixa de oferecer horários nesses dias. Quem já tem horário marcado nessa data não é avisado sozinho: confira na agenda.'),
          D.excecoes.length ? h('ul', {}, D.excecoes.map((e) => h('li', {}, `${dataBR(e.data_ini)}${e.data_fim !== e.data_ini ? ' a ' + dataBR(e.data_fim) : ''}${e.motivo ? ' · ' + e.motivo : ''} `,
            h('button', { type: 'button', class: 'btn', onclick: async () => { const x = await db.rpc('medico_excecao_remover', { p_id: e.id }); if (falha(x)) return; if (await recarregarDetalhe()) pintarExcecoes(); } }, 'Remover')))) : h('p', { class: 'dica' }, 'Nenhuma data bloqueada.'),

      }

      (async () => {
        if (!(await recarregarDetalhe())) { box.replaceChildren(h('p', { class: 'erro' }, 'Não deu para abrir os detalhes. Se a mensagem fala de função inexistente, falta rodar o SQL supabase/medicos-regras.sql.')); return; }
        D.turnos.forEach((t) => { (T[t.dia] = T[t.dia] || []).push({ ini: t.hora_ini, fim: t.hora_fim }); });
        pintarHorarios(); pintarConvenios(); pintarExcecoes();

        box.replaceChildren(h('div', { class: 'ex-acoes', style: 'margin:0 0 8px' }, nome('hor', 'Horários por dia'), nome('conv', 'Convênios e particularidades'), nome('exc', `Folgas e bloqueios${D.excecoes.length ? ' (' + D.excecoes.length + ')' : ''}`)), abas.hor, abas.conv, abas.exc);
        abrirAba('hor');
      })();
      return box;
    }

    async function alternarChat(m, liga) {
      if (!liga && !confirm(`Bloquear ${nomeMedico(m.profissional)} no chat? Ele some da lista e dos horários; quem já tinha escolhido recebe aviso.`)) { pintar(); return; }
      const x = liga ? await db.rpc('profissional_liberar', { p_nome: m.profissional }) : await db.rpc('profissional_bloquear', { p_nome: m.profissional, p_motivo: null });
      if (x.error) { toast(msgErro(x.error)); pintar(); return; }
      toast(liga ? 'Liberado no chat.' : `Bloqueado no chat.${x.data && x.data.conversas ? ` ${x.data.conversas} conversa(s) afetada(s).` : ''}`); recarregar();
    }

        && (MD.filtro === 'todos' || (MD.filtro === 'regra' && (m.regra || m.tem_turnos || m.particular || m.n_convenios_fora || m.n_excecoes)) || (MD.filtro === 'aviso' && (m.aviso_id || comPendencia.has(m.profissional))) || (MD.filtro === 'bloqueado' && m.bloqueado)));
      alvo.replaceChildren(itens.length ? h('div', { class: 'tabela-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, ['Médico', 'Unidade', 'Agenda no Klingo', 'Sua regra', 'No chat', ''].map((t) => h('th', {}, t)))),
        h('tbody', {}, itens.flatMap((m) => {
          const reg = m.regra;
          const extras = [m.tem_turnos ? 'grade por dia' : null, m.particular ? '100% particular' : null, m.n_convenios_fora ? `${m.n_convenios_fora} convênio(s) fora` : null, m.n_excecoes ? `${m.n_excecoes} data(s) bloqueada(s)` : null].filter(Boolean);
          const regTxt = (reg ? [reg.dias ? txtDias(reg.dias) : null, reg.hora_ini || reg.hora_fim ? `${reg.hora_ini || m.hora_ini}–${reg.hora_fim || m.hora_fim}` : null, reg.nota].filter(Boolean).concat(extras).join(' · ') || 'só observação' : extras.join(' · ') || 'Segue o Klingo');
          const linha = h('tr', {},
            h('td', {}, h('b', {}, nomeMedico(m.profissional)), m.especialidade ? h('div', { class: 'dica' }, m.especialidade) : null, m.aviso_id ? h('span', { class: 'selo erro', style: 'margin-left:6px' }, 'conferir') : null, comPendencia.has(m.profissional) ? h('span', { class: 'selo erro', style: 'margin-left:6px' }, 'validar exames') : null),
            h('td', {}, nomeUnidade(m.unidade)), h('td', {}, txtGrade(m)), h('td', {}, regTxt),
            h('td', {}, h('label', { style: 'display:inline-flex;gap:4px;align-items:center' }, h('input', { type: 'checkbox', checked: !m.bloqueado, onchange: (ev) => alternarChat(m, ev.target.checked) }), m.bloqueado ? 'Bloqueado' : 'Atende')),
            h('td', {}, h('button', { type: 'button', class: 'btn', onclick: () => { MD.aberto = MD.aberto === m.profissional + '|' + m.unidade ? null : m.profissional + '|' + m.unidade; pintar(); } }, 'Particularidades')));
          const chave = m.profissional + '|' + m.unidade;
          return MD.aberto === chave ? [linha, h('tr', {}, h('td', { colspan: 6 }, editor(m)))] : [linha];
        })))) : h('p', { class: 'dica' }, 'Nenhum médico encontrado.'));
    }
    pintar();

    const vistas = h('div', { class: 'ex-acoes', style: 'margin:12px 0' }, [['lista', 'Médicos'], ['mapa', 'Mapa de salas']].map(([v, t]) =>

    c.replaceChildren(h('div', { class: 'pagina' }, h('h2', {}, 'Médicos'),
      h('p', { class: 'sub' }, 'A agenda de cada médico vem do Klingo e já aparece preenchida. Use "Particularidades" para ajustar os turnos de cada dia, os convênios aceitos (e o atendimento 100% particular) e as datas de folga. O chat só oferece horário que passa nas suas regras.'),

  }

  /* ---------- aprendizado (Fase 5): onde a IA erra e o que corrigir ---------- */
  const ROTULO_ETAPA = { pedido: 'Escolha do exame', plano: 'Plano', preferencias: 'Preferências', data_hora: 'Data e hora', dados: 'Dados pessoais', confirmacao: 'Confirmação', pronto: 'Pronto' };
  const brl = (v) => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const rotuloCaso = (c) => CONF_ROTULO[c] || (c === 'cancelado' ? 'Cancelado' : c);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');
  /* ---------- indicadores (conversas, finalizadas, pedidos completos e agendados) ---------- */
  const IND = { dias: 0, t: null };
  async function viewIndicadores(c, dias = IND.dias, silencioso = false) {
    IND.dias = dias;
    const titulo = h('h2', {}, 'Indicadores');
    if (!silencioso) c.replaceChildren(h('div', { class: 'pagina' }, titulo, h('p', { class: 'sub' }, 'Carregando…')));
    const minha = viewIndicadores.seq = (viewIndicadores.seq || 0) + 1;   // só a última escolha pinta a tela
    const { data, error } = await db.rpc('painel_indicadores', { p_dias: dias });
    if (S.aba !== 'indicadores' || minha !== viewIndicadores.seq) return;
    if (error) { c.replaceChildren(h('div', { class: 'pagina' }, titulo, h('p', { class: 'erro' }, msgErro(error)),
      h('p', { class: 'dica' }, 'Se a mensagem fala de função inexistente, falta rodar o SQL supabase/indicadores-painel.sql.'))); return; }
    const R = data || {}, V = R.conversas || {}, P = R.pedidos || {};
    const pc = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '—');
    const periodo = h('select', { 'aria-label': 'Período', onchange: (ev) => viewIndicadores(c, Number(ev.target.value)) },
      [[0, 'Desde o início'], [7, 'Últimos 7 dias'], [30, 'Últimos 30 dias'], [90, 'Últimos 90 dias']].map(([v, t]) => h('option', { value: v, selected: v === dias }, t)));
    const num = (n, rot) => h('div', { class: 'num' }, h('b', {}, n ?? 0), h('span', {}, rot));
    const dia = (d) => { const [, m, dd] = String(d).split('-'); return dd + '/' + m; };
    const dias_ = (R.por_dia || []).slice().reverse();
    c.replaceChildren(h('div', { class: 'pagina' }, titulo,
      h('p', { class: 'sub' }, 'Resumo do chat. Atualiza sozinho a cada minuto. Não mostra dado de paciente. Inclui conversas de teste da equipe. ', R.desde ? `Primeira conversa em ${fmtDataHora(R.desde)}. ` : '', R.gerado_em ? `Atualizado às ${fmtDataHora(R.gerado_em)}.` : ''),
      h('div', { class: 'acoes' }, periodo, h('button', { class: 'btn', type: 'button', onclick: () => viewIndicadores(c, IND.dias, true) }, 'Atualizar agora')),
      h('h3', {}, 'Conversas'),
      h('div', { class: 'numeros' },
        num(V.total, 'conversas iniciadas'),
        num(V.pessoas, 'pessoas diferentes'),
        num(V.finalizadas, `conversas finalizadas (${pc(V.finalizadas, V.total)})`),
        num(V.em_andamento, 'em andamento')),
      h('h3', {}, 'Pedidos e agendamentos'),
      h('div', { class: 'numeros' },
        num(P.conversas_com_pedido_completo, `conversas com pedido completo (${pc(P.conversas_com_pedido_completo, V.total)} das conversas)`),
        num(P.agendados, `agendados (${pc(P.agendados, P.conversas_com_pedido_completo)} dos pedidos completos)`),
        num(P.prontos_esperando_recepcao, 'prontos, esperando a recepção marcar'),
        num(P.cancelados, 'pedidos cancelados'),
        num(P.rascunhos, 'pedidos não terminados')),
      h('p', { class: 'dica' }, `Dos ${P.agendados ?? 0} agendados, ${P.agendados_pela_ia ?? 0} foram marcados sozinhos pela IA e ${P.agendados_pela_equipe ?? 0} pela equipe. `
        + 'Pedido completo = o paciente terminou o pedido no chat. "Agendado" só conta o que o painel sabe: marcação feita direto no Klingo sem avisar o chat não entra.'),
      h('h3', {}, 'Por dia'),
      h('div', { class: 'tabela-wrap', style: 'margin-bottom:12px' }, h('table', {},
        h('thead', {}, h('tr', {}, ['Dia', 'Conversas', 'Finalizadas', 'Pedidos completos', 'Agendados'].map((t) => h('th', {}, t)))),
        h('tbody', {}, dias_.length ? dias_.map((d) => h('tr', {}, [dia(d.dia), d.conversas, d.finalizadas, d.pedidos_completos, d.agendados].map((v) => h('td', {}, String(v))))) : [h('tr', {}, h('td', { colspan: 5 }, 'Sem conversas no período.'))])))));
    clearTimeout(IND.t);
    IND.t = setTimeout(() => { if (S.aba === 'indicadores' && !document.hidden) viewIndicadores(c, IND.dias, true); }, 60000);
  }

  async function viewAprendizado(c, dias = 28) {
    c.replaceChildren(h('div', { class: 'pagina' }, h('h2', {}, 'Aprendizado da IA'), h('p', { class: 'sub' }, 'Carregando…')));
    const minha = viewAprendizado.seq = (viewAprendizado.seq || 0) + 1;   // só a última escolha de período pinta a tela
    const [r, p, e] = await Promise.all([db.rpc('ia_relatorio', { p_dias: dias }), db.rpc('ia_precos_divergentes', { p_limite: 30 }), db.rpc('ia_exemplos', { p_dias: dias, p_limite: 40 })]);
    if (S.aba !== 'aprendizado' || minha !== viewAprendizado.seq) return;
    const falha = r.error || p.error || e.error;
    if (falha) { c.replaceChildren(h('div', { class: 'pagina' }, h('h2', {}, 'Aprendizado da IA'), h('p', { class: 'erro' }, msgErro(falha)),
      h('p', { class: 'dica' }, 'Se a mensagem fala de função inexistente, falta rodar o SQL da Fase 5 (supabase/fase5-aprendizado.sql).'))); return; }
    const R = r.data || {}, X = R.resumo || {}, P = p.data || {}, EX = (e.data || []).filter((x) => passaUnidade(chavesDe([x.unidade])));
    const tabela = (cab, linhas, vazio) => h('div', { class: 'tabela-wrap', style: 'margin-bottom:12px' }, h('table', {},
      h('thead', {}, h('tr', {}, cab.map((t) => h('th', {}, t)))),
      h('tbody', {}, linhas.length ? linhas.map((l) => h('tr', {}, l.map((v) => h('td', {}, v)))) : [h('tr', {}, h('td', { colspan: cab.length }, vazio))])));
    const periodo = h('select', { 'aria-label': 'Período', onchange: (ev) => viewAprendizado(c, Number(ev.target.value)) },
      [[7, 'Últimos 7 dias'], [28, 'Últimos 28 dias'], [90, 'Últimos 90 dias']].map(([v, t]) => h('option', { value: v, selected: v === dias }, t)));
    const fim = (X.agendados_auto || 0) + (X.agendados_manual || 0);
    const alertas = Object.entries(R.alertas || {}).sort((a, b) => b[1] - a[1]);
    const etapas = Object.entries(R.abandono_por_etapa || {}).sort((a, b) => b[1] - a[1]);
    const A = R.atendentes || {}, V = R.conversas || {};
    const semana = (d) => { const [y, m, dd] = String(d).split('-'); return dd + '/' + m; };
    const textoExemplos = EX.map((x) => '- [' + rotuloCaso(x.caso) + '] exames: ' + ((x.exames || []).join('; ') || '—')
      + ' | plano: ' + (x.plano || '—') + ' | unidade: ' + (x.unidade || '—') + ' | etapa: ' + (ROTULO_ETAPA[x.etapa] || x.etapa || '—') + (x.detalhe ? ' | ' + x.detalhe : '')).join('\n');
    c.replaceChildren(h('div', { class: 'pagina' }, h('h2', {}, 'Aprendizado da IA'),
      h('p', { class: 'sub' }, 'Onde a IA acerta, onde o atendente ou o Klingo precisou corrigir e o que vale ajustar. Não mostra dado de paciente. ', R.observacao || '', UN.sel ? ' Os números do alto são da clínica toda; só a lista de casos segue a unidade escolhida.' : ''), periodo,
      h('div', { class: 'numeros', style: 'margin-top:10px' },
        h('div', { class: 'num' }, h('b', {}, X.criados ?? 0), h('span', {}, 'pré-agendamentos criados')),
        h('div', { class: 'num' }, h('b', {}, pct(X.agendados_auto_sem_alerta || 0, X.agendados_auto || 0)), h('span', {}, 'marcados sozinhos sem nenhum alerta')),
        h('div', { class: 'num' }, h('b', {}, (X.agendados_auto || 0) + ' / ' + fim), h('span', {}, 'agendados pela conferência / total')),
        h('div', { class: 'num' }, h('b', {}, R.tempo_mediano_pronto_agendado_min == null ? '—' : Math.round(R.tempo_mediano_pronto_agendado_min) + ' min'), h('span', {}, 'do "pronto" até agendado (mediana)')),
        h('div', { class: 'num' }, h('b', {}, X.com_alerta_agora ?? 0), h('span', {}, 'com alerta agora')),
        h('div', { class: 'num' }, h('b', {}, X.abandonados ?? 0), h('span', {}, 'abandonados (sem mexer há 24 h)'))),
      R.pedidos_sem_registro > 0 ? h('p', { class: 'erro' }, `Atenção: ${R.pedidos_sem_registro} pedido(s) criado(s) depois do início do registro não aparecem na linha do tempo. O gatilho da Fase 5 pode estar falhando: veja os avisos do banco (logs do Postgres) por ia_evento_trg.`) : null,
      h('h3', {}, 'Alertas da conferência com o Klingo'),
      tabela(['Tipo', 'Pedidos'], alertas.map(([k, n]) => [CONF_ROTULO[k] || k, n]), 'Nenhum alerta no período.'),
      h('h3', {}, 'Onde o paciente desiste'),
      tabela(['Etapa em que parou', 'Pedidos'], etapas.map(([k, n]) => [ROTULO_ETAPA[k] || k, n]), 'Nenhum pedido abandonado no período.'),
      h('h3', {}, 'Exames com mais problema'),
      h('p', { class: 'dica' }, 'Conta o pedido inteiro: se um pedido tem vários exames, todos entram na contagem do alerta.'),
      tabela(['Exame', 'Com problema', 'Pedidos do exame'], (R.exames_problema || []).map((x) => [x.exame, x.problemas, x.total]), 'Nenhum exame com alerta ou cancelamento.'),
      h('h3', {}, 'O que os atendentes fizeram'),
      tabela(['Ação', 'Quantidade'], [['Marcaram como agendado à mão', A.marcou_agendado ?? 0], ['Cancelaram o pedido', A.cancelou ?? 0], ['…com o motivo escrito', A.cancelou_com_motivo ?? 0],
        ['Desfizeram um agendamento', A.desfez_agendado ?? 0], ['Conversas assumidas por atendente', (V.assumidas_por_atendente ?? 0) + ' de ' + (V.total ?? 0)]], ''),
      h('h3', {}, 'Por semana'),
      tabela(['Semana de', 'Criados', 'Agendados', 'Com alerta', 'Cancelados'], (R.semanas || []).map((s) => [semana(s.semana), s.criados, s.agendados, s.com_alerta, s.cancelados]), 'Sem dados ainda.'),
      h('h3', {}, 'Preço do catálogo x preço lançado no Klingo'),
      h('p', { class: 'dica' }, P.atualizado_em ? `${P.comparados ?? 0} combinações de exame e operadora comparadas${P.com_varias_linhas ? ` (${P.com_varias_linhas} têm mais de uma linha no catálogo: a comparação usa a mais próxima do Klingo)` : ''}, ${P.sem_referencia ?? 0} sem referência no catálogo, ${P.divergentes_total ?? 0} com diferença de 10% ou mais (mostrando até 30). Atualizado em ${fmtDataHora(P.atualizado_em)}. A IA continua usando o preço do catálogo: corrija no Klingo ou no catálogo e confirme com a recepção.`
        : 'Ainda não há preços lidos do Klingo: o primeiro cálculo acontece na próxima atualização da agenda (a cada 10 minutos).'),
      tabela(['Exame', 'Operadora', 'Catálogo', 'Klingo', 'Diferença', 'Amostras'], (P.divergentes || []).map((x) => [x.exame, x.operadora, brl(x.catalogo), brl(x.klingo), (x.dif_pct > 0 ? '+' : '') + x.dif_pct + '%', x.amostras]), 'Nenhuma diferença relevante.'),
      h('h3', {}, 'Casos para melhorar o prompt'),
      h('p', { class: 'dica' }, 'Alertas e cancelamentos recentes, sem dado de paciente. Copie e use para ajustar os textos e as regras do motor de atendimento.'),
      h('div', { class: 'acoes' }, h('button', { class: 'btn', type: 'button', disabled: !EX.length, onclick: async () => { try { await navigator.clipboard.writeText(textoExemplos); toast('Casos copiados.'); } catch { toast('Não consegui copiar.'); } } }, 'Copiar casos')),
      tabela(['Quando', 'Caso', 'Exames', 'Plano', 'Etapa', 'Detalhe'], EX.map((x) => [fmtDataHora(x.quando), rotuloCaso(x.caso), (x.exames || []).join('; ') || '—', x.plano || '—', ROTULO_ETAPA[x.etapa] || x.etapa || '—', x.detalhe || '']), 'Nenhum caso no período.'),
      blocoIncidentes()));
  }

  /* ---------- problemas técnicos do chat (Fase 9): o paciente passa o código CSI-... e a equipe acha o caso ---------- */
  const ROTULO_INC = { ORD: 'Mensagens fora de ordem', LNT: 'Resposta demorou', TRV: 'Tela travada', RPC: 'Falha ao falar com o servidor', DES: 'Conversa dessincronizada', JS: 'Erro no aplicativo', DIA: 'Diagnóstico pedido pelo paciente' };
  function blocoIncidentes() {
    const campo = h('input', { type: 'search', placeholder: 'Código do paciente (ex.: CSI-261031-1432-RPC-AB23) ou só o final', 'aria-label': 'Código do incidente', style: 'width:100%;max-width:440px' });
    const saida = h('div', { 'aria-live': 'polite' });
    const buscar = async () => {
      saida.replaceChildren(h('p', { class: 'dica' }, 'Buscando…'));
      const { data, error } = await db.rpc('painel_incidentes', { p_codigo: campo.value.trim() || null, p_dias: 14, p_limite: 50 });
      if (error) { saida.replaceChildren(h('p', { class: 'erro' }, msgErro(error)), h('p', { class: 'dica' }, 'Se a mensagem fala de função inexistente, falta rodar o SQL da Fase 9 (supabase/fase9-sentinela.sql).')); return; }
      const lista = Array.isArray(data) ? data : [];
      if (!lista.length) { saida.replaceChildren(h('p', { class: 'dica' }, campo.value.trim() ? 'Nenhum caso com esse código.' : 'Nenhum problema técnico nos últimos 14 dias.')); return; }
      saida.replaceChildren(...lista.map((x) => {
        const d = x.detalhe || {};
        const resumo = [['Quando', fmtDataHora(x.criado_em)], ['Tipo', ROTULO_INC[x.tipo] || x.rotulo || x.tipo], ['Etapa', x.passo || '—'], ['Versão do chat', x.versao || '—'], ['Conversa', x.conversa_id || '—'],
          ['Chamada', d.detalhe && d.detalhe.chamada ? `${d.detalhe.chamada} (status ${d.detalhe.status ?? '—'}${d.detalhe.erro ? ', ' + d.detalhe.erro : ''})` : '—'], ['Curado sozinho', d.detalhe && d.detalhe.curado === true ? 'sim' : d.detalhe && d.detalhe.curado === false ? 'não' : '—'],
          ['Tela', d.janela || '—'], ['Aparelho', d.ua || '—']];
        return h('details', { class: 'bloco-inc', style: 'border:1px solid var(--linha);border-radius:10px;padding:8px 12px;margin:0 0 8px;background:var(--papel)' },
          h('summary', { style: 'cursor:pointer;font-weight:650' }, `${x.codigo} · ${ROTULO_INC[x.tipo] || x.tipo} · ${fmtDataHora(x.criado_em)}`),
          h('dl', { style: 'display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0' }, resumo.map(([k, v]) => [h('dt', { style: 'color:var(--suave)' }, k), h('dd', { style: 'margin:0;overflow-wrap:anywhere' }, String(v))]).flat()),
          h('p', { class: 'dica' }, 'Últimos eventos e chamadas, do mais antigo ao mais novo (sem texto de mensagens):'),
          h('pre', { style: 'white-space:pre-wrap;font-size:12px;margin:0;max-height:260px;overflow:auto' }, JSON.stringify({ eventos: d.eventos, chamadas: d.chamadas, dom: d.dom, aprendizado: d.aprendizado }, null, 1)));
      }));
    };
    campo.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); buscar(); } });
    setTimeout(buscar, 0);
    return h('div', {}, h('h3', {}, 'Problemas técnicos do chat'),
      h('p', { class: 'dica' }, 'Quando o chat do paciente trava ou erra, ele mostra um código (CSI-...). Digite o código para ver o que aconteceu, ou deixe em branco para ver os últimos 14 dias.'),
      h('div', { class: 'acoes' }, campo, h('button', { class: 'btn', type: 'button', onclick: buscar }, 'Buscar')), saida);
  }

  /* ---------- início ---------- */
  db.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; desligarTempoReal(); telaLoginMostrar(false); } });
  entrar();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
