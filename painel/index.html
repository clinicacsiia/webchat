<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de atendimento</title>
<meta name="theme-color" content="#146b50">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --verde-escuro: #10302b; --verde: #146b50; --verde-claro: #d4efdd; --fundo: #f1f5f2; --papel: #fff;
    --texto: #16231f; --suave: #5b6b65; --linha: #d7e0da; --erro: #b3261e; --aviso: #8a5a00; --azul: #0b5cad;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.4; color: var(--texto); background: var(--fundo); -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #2f9e78; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .btn { border: 1.5px solid var(--linha); background: var(--papel); border-radius: 9px; padding: 8px 13px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn:hover { background: #eef4f0; }
  .btn.prim { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn.prim:hover { background: #0f5a42; }
  .btn.perigo { color: var(--erro); border-color: #e6bcb8; }
  .btn:disabled { opacity: .55; cursor: default; }
  input[type=text], input[type=email], input[type=password], input[type=search], input[type=url], textarea, select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--linha); border-radius: 9px; background: var(--papel);
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(20,107,80,.16); }
  label.rot { display: block; font-weight: 600; font-size: 13.5px; margin: 0 0 4px; }
  .campo { margin-bottom: 14px; }
  .dica { color: var(--suave); font-size: 13px; margin: 4px 0 0; }
  .erro { color: var(--erro); font-size: 14px; min-height: 1.2em; margin: 0 0 10px; }

  /* Login e telas de espera */
  .centro { min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: var(--verde-escuro); }
  .cartao { width: 100%; max-width: 380px; background: var(--papel); border-radius: 16px; padding: 26px 24px; }
  .cartao h1 { font-size: 22px; margin: 0 0 4px; }
  .cartao p.sub { margin: 0 0 18px; color: var(--suave); }
  .cartao .btn.prim { width: 100%; padding: 12px; font-size: 15px; }
  .link { background: none; border: 0; color: var(--azul); cursor: pointer; padding: 6px 0; font-size: 14px; text-decoration: underline; }

  /* App */
  .app { display: grid; grid-template-columns: 224px 1fr; height: 100dvh; }
  .lateral { background: var(--verde-escuro); color: #fff; display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; min-height: 0; }
  .marca { font-weight: 700; font-size: 16px; padding: 6px 10px 14px; display: flex; align-items: center; gap: 9px; }
  .marca i { width: 10px; height: 10px; border-radius: 50%; background: #9aa9a3; display: inline-block; }
  .marca i.on { background: #4ade80; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: none; border: 0; color: #cfe3da; text-align: left; padding: 11px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; }
  .nav button:hover { background: rgba(255,255,255,.08); }
  .nav button[aria-current=page] { background: var(--verde); color: #fff; }
  .triagem { background: #f1f7f4; border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .triagem b { margin-right: 8px; }
  .pre { background: #fffaf0; border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .pre b { margin-right: 8px; }
  .pre .acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pre details { margin-top: 4px; }
  .pre dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0 0; }
  .pre dt { color: var(--suave); }
  .pre dd { margin: 0; overflow-wrap: anywhere; }
  .urg { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: #e7efe9; color: #14543f; }
  .urg.media { background: #fdf0d2; color: #7a5200; }
  .urg.alta { background: #fbdcd8; color: #a1271c; }
  .selo { background: #f2b84b; color: #3b2a00; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 8px; min-width: 22px; text-align: center; }
  .espaco { flex: 1; }
  .eu { padding: 10px; border-top: 1px solid rgba(255,255,255,.14); font-size: 13.5px; }
  .eu b { display: block; font-size: 14px; }
  .eu span { opacity: .75; }
  .eu .acoes { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .eu .acoes button { background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .eu .acoes button:hover { background: rgba(255,255,255,.2); }
  .conteudo { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .pagina { flex: 1; min-height: 0; overflow-y: auto; padding: 22px; }
  .pagina h2 { margin: 0 0 4px; font-size: 22px; }
  .pagina p.sub { margin: 0 0 18px; color: var(--suave); }

  /* Atendimento */
  .inbox { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
  .lista { border-right: 1px solid var(--linha); background: var(--papel); display: flex; flex-direction: column; min-height: 0; }
  .filtros { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--linha); background: var(--papel); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .itens { overflow-y: auto; flex: 1; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #edf2ee; padding: 12px 14px; cursor: pointer; }
  .item:hover { background: #f4f8f5; }
  .item[aria-current=true] { background: #e3f1e8; }
  .item .l1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; }
  .item .l1 span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .hora { font-weight: 400; font-size: 12px; color: var(--suave); flex: none; }
  .item .l2 { display: flex; justify-content: space-between; gap: 8px; color: var(--suave); font-size: 13.5px; margin-top: 2px; }
  .item .l2 .prev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .l3 { font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .tag { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 650; }
  .tag.aguardando { background: #fff0cf; color: var(--aviso); }
  .tag.em_atendimento { background: #d9f3e3; color: #0d5a3d; }
  .tag.encerrada { background: #e8ecea; color: var(--suave); }
  .nl { background: var(--verde); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; padding: 0 6px; flex: none; }
  .vazio { color: var(--suave); text-align: center; padding: 36px 20px; }
  .vazio b { display: block; color: var(--texto); margin-bottom: 4px; }

  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #e8efea; }
  .chat-topo { background: var(--papel); border-bottom: 1px solid var(--linha); padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chat-topo .quem { flex: 1; min-width: 160px; }
  .chat-topo .quem b { font-size: 16px; display: block; }
  .chat-topo .quem span { font-size: 13px; color: var(--suave); }
  .chat-topo .quem a { color: var(--azul); }
  .voltar { display: none; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .dia { align-self: center; background: rgba(16,48,43,.1); color: var(--suave); font-size: 12px; padding: 3px 11px; border-radius: 999px; margin: 10px 0 6px; }
  .msg { max-width: 72%; padding: 8px 11px 6px; border-radius: 14px; background: var(--papel); box-shadow: 0 1px 1px rgba(16,48,43,.08); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.cliente { align-self: flex-start; border-top-left-radius: 4px; }
  .msg.agente { align-self: flex-end; background: var(--verde-claro); border-top-right-radius: 4px; }
  .msg.sistema { align-self: center; background: rgba(16,48,43,.08); box-shadow: none; color: var(--suave); font-size: 13px; text-align: center; padding: 5px 12px; }
  .msg .quem { display: block; font-size: 12.5px; font-weight: 650; color: var(--verde); margin-bottom: 2px; }
  .msg .hora { display: block; text-align: right; font-size: 11px; color: var(--suave); margin-top: 2px; }
  .msg.sistema .hora { display: none; }
  .msg a { color: var(--azul); }
  .compor { display: flex; gap: 8px; align-items: flex-end; padding: 10px; background: #f6f9f7; border-top: 1px solid var(--linha); }
  .compor textarea { resize: none; min-height: 44px; max-height: 140px; border-radius: 22px; padding: 11px 16px; }
  .compor .btn { height: 44px; border-radius: 22px; padding: 0 20px; }
  .chat-vazio { flex: 1; display: grid; place-items: center; color: var(--suave); text-align: center; padding: 20px; }

  /* Tabelas */
  .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .barra input[type=search] { max-width: 280px; }
  .barra select { width: auto; }
  .barra .espaco { flex: 1; }
  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .num { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 14px; }
  .num b { display: block; font-size: 26px; line-height: 1.1; }
  .num span { color: var(--suave); font-size: 13px; }
  .tabela-wrap { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; overflow-x: auto; }
  .cat-bloco { background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 14px; margin: 0 0 10px; }
  .cat-bloco summary { cursor: pointer; font-weight: 600; }
  .cat-bloco ul { margin: 8px 0 0; padding-left: 18px; }
  .cat-bloco li { margin: 2px 0; overflow-wrap: anywhere; }
  .cat-bloco .sub-lista { color: var(--suave); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #edf2ee; vertical-align: top; }
  th { font-size: 13px; color: var(--suave); font-weight: 650; background: #f7faf8; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td a { color: var(--azul); }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tags .tag { background: #e8efea; color: #2c4a40; }
  td .btn { padding: 5px 10px; font-size: 13px; }
  .pendente-linha td { background: #fff8e6; }

  dialog { border: 0; border-radius: 16px; padding: 22px; width: min(480px, calc(100% - 24px)); box-shadow: 0 18px 50px rgba(16,48,43,.35); }
  dialog::backdrop { background: rgba(16,48,43,.5); }
  dialog h3 { margin: 0 0 14px; }
  dialog .rodape { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2b2f2e; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
  .link-chat { display: flex; gap: 8px; }
  .link-chat input { flex: 1; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .conteudo { grid-row: 1; }
    .lateral { grid-row: 2; flex-direction: row; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); align-items: center; gap: 0; }
    .marca, .eu .acoes, .eu span { display: none; }
    .eu { border: 0; padding: 0 6px; margin-left: auto; }
    .eu b { font-size: 12px; }
    .nav { flex-direction: row; flex: 1; justify-content: space-around; }
    .nav button { flex-direction: column; gap: 2px; font-size: 12px; padding: 7px 8px; text-align: center; }
    .espaco { display: none; }
    .pagina { padding: 14px; }
    .inbox { grid-template-columns: 1fr; }
    .inbox .chat { display: none; }
    .inbox.aberta .lista { display: none; }
    .inbox.aberta .chat { display: flex; }
    .voltar { display: inline-block; }
    .msg { max-width: 88%; }
  }
  @media (prefers-reduced-motion: no-preference) { .msg { animation: entra .15s ease-out; } @keyframes entra { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<div id="raiz"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  'use strict';
  const SUPABASE_URL = 'https://nrvuynjwcgwpjdptkiay.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_e2GK1YGEj06STa_ESCevow_nvtATB-y';
  const PAINEL_URL = new URL('./', location.href).href; // o link do e-mail de confirmação volta para o painel
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ---------- helpers ---------- */
  const raiz = document.getElementById('raiz');
  const dlg = document.getElementById('dlg');
  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
    return e;
  }
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4200);
  }
  const msgErro = (e) => (e && e.message) ? e.message : 'Algo deu errado. Tente de novo.';
  const soDigitos = (s) => String(s || '').replace(/\D/g, '');
  function fmtTel(d) {
    d = soDigitos(d);
    if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return d;
  }
  const mesmoDia = (a, b) => a.toDateString() === b.toDateString();
  function fmtHoraLista(iso) {
    const d = new Date(iso), n = new Date();
    return mesmoDia(d, n) ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  }
  const fmtHora = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const fmtDataHora = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  function rotuloDia(iso) {
    const d = new Date(iso), n = new Date(), o = new Date(n); o.setDate(n.getDate() - 1);
    if (mesmoDia(d, n)) return 'Hoje'; if (mesmoDia(d, o)) return 'Ontem';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function linkificar(texto) {
    const out = []; const re = /(https?:\/\/[^\s<]+)/g; let ult = 0, m;
    while ((m = re.exec(texto))) {
      if (m.index > ult) out.push(texto.slice(ult, m.index));
      out.push(h('a', { href: m[0], target: '_blank', rel: 'noopener noreferrer' }, m[0])); ult = m.index + m[0].length;
    }
    if (ult < texto.length) out.push(texto.slice(ult));
    return out;
  }
  const ROTULO_STATUS = { aguardando: 'Aguardando', em_atendimento: 'Em atendimento', encerrada: 'Encerrada' };
  const ROTULO_PAPEL = { admin: 'Administrador', atendente: 'Atendente', marketing: 'Marketing' };

  /* ---------- estado ---------- */
  const S = {
    me: null, agentes: new Map(), conversas: [], filtro: 'aguardando', abertaId: null, msgs: [], vistos: new Set(),
    aba: 'atendimento', canal: null, ao_vivo: false, contatos: [], mudo: localStorage.getItem('painel.mudo') === '1',
    buscaContatos: '', periodo: 'todos', tagFiltro: '', pre: null
  };
  /* ---------- pré-agendamento montado pela IA ---------- */
  const ROTULO_PRE = { rascunho: 'Em coleta', pronto: 'Pronto para marcar', agendado: 'Agendado', cancelado: 'Cancelado' };
  const ROTULO_IDENT = { nova: 'Paciente novo: validar no Klingo', aguardando: 'Parece já ser paciente: data de nascimento ainda não conferida',
    conferida: 'Paciente conhecido: identidade conferida', atualizar: 'Paciente conhecido: alguns dados foram atualizados, conferir',
    divergente: 'Dados não batem com o cadastro que temos: tratar como paciente novo e conferir' };
  const CAMPOS_PRE = [['nome', 'Nome'], ['nome_social', 'Nome social'], ['sexo', 'Sexo'], ['dt_nasc', 'Nascimento'], ['mae', 'Mãe'], ['cpf', 'CPF'], ['rg', 'RG'], ['cns', 'CNS'],
    ['celular', 'Celular'], ['telefone', 'Telefone'], ['email', 'E-mail'], ['cep', 'CEP'], ['endereco', 'Rua'], ['numero', 'Número'], ['complemento', 'Compl.'],
    ['bairro', 'Bairro'], ['cidade', 'Cidade'], ['uf', 'UF'], ['matricula', 'Carteirinha'], ['validade', 'Validade']];
  const MOD_ROTULO = { RM: 'Ressonância', TC: 'Tomografia', US: 'Ultrassom', RX: 'Raio-X', MAMO: 'Mamografia', DENSITO: 'Densitometria' };
  const LADO_ROTULO = { D: 'lado direito', E: 'lado esquerdo', A: 'os dois lados', N: '' };
  const linhaItem = (i) => `${MOD_ROTULO[i.modalidade] || i.modalidade}${i.regiao_nome ? ' — ' + i.regiao_nome : ''}${LADO_ROTULO[i.lado] ? ' (' + LADO_ROTULO[i.lado] + ')' : ''}: ${i.procedimento || 'exame a definir'}${i.quantidade > 1 ? ' ×' + i.quantidade : ''}`;
  const dataBR = (d) => (d ? String(d).split('-').reverse().join('/') : '');
  const linhasHorario = (p) => (Array.isArray(p.escolha_horario) ? p.escolha_horario : []).map((e) =>
    `${dataBR(e.data)} ${e.chegada ? 'ordem de chegada a partir das ' : 'às '}${e.hora}${e.unidade ? ' — ' + String(e.unidade).replace(/^CLÍNICA DE SAÚDE E IMAGEM - /, '') : ''}${e.local ? ' (' + e.local + ')' : ''}`);
  function textoPre(p) {
    const topo = [['Tipo', p.tipo], ['Especialidade', p.especialidade], ['Procedimento', p.procedimento], ['Plano', p.plano], ['Unidade', p.unidade], ['Profissional', p.profissional], ['Preferência', p.preferencia_horario]];
    const exames = (S.preItens || []).map(linhaItem);
    const horarios = linhasHorario(p);
    const extra = [...(exames.length ? ['Exames pedidos:', ...exames.map((x) => '• ' + x)] : []), ...(horarios.length ? ['Horário escolhido pelo paciente (previsão, confirmar no Klingo):', ...horarios.map((x) => '• ' + x)] : [])];
    return topo.concat(CAMPOS_PRE.map(([k, r]) => [r, (p.paciente || {})[k]])).filter(([, v]) => v).map(([r, v]) => r + ': ' + v).concat(extra).join('\n');
  }
  async function carregarPre() {
    const id = S.abertaId;
    if (!id) { S.pre = null; renderPre(); return; }
    const [{ data }, { data: itens }] = await Promise.all([
      db.from('pre_agendamentos').select('*').eq('conversa_id', id).maybeSingle(),
      db.from('pre_agendamento_itens').select('modalidade,regiao_nome,lado,procedimento,quantidade').eq('conversa_id', id).eq('ativo', true).order('id')
    ]);
    if (S.abertaId === id) { S.pre = data || null; S.preItens = itens || []; renderPre(); }
  }
  // O status "Agendado" muda sozinho (conferência automática a cada 15 s): reler enquanto uma conversa está aberta.
  setInterval(() => { if (S.abertaId && S.aba === 'atendimento' && !document.hidden) carregarPre(); }, 15000);
  async function statusPre(status) {
    if (!S.pre) return;
    const { error } = await db.from('pre_agendamentos').update({ status, atualizado_em: new Date().toISOString() }).eq('id', S.pre.id);
    if (error) { toast(msgErro(error)); return; }
    S.pre.status = status; renderPre();
  }
  function renderPre() {
    const box = document.getElementById('pre'); if (!box) return;
    const p = S.pre;
    if (!p) { box.replaceChildren(); return; }

  async function adicionarPessoa(nome, email, senha, papel) {

    if (error) throw error;
    if (!data.user || (data.user.identities && !data.user.identities.length)) throw new Error('Este e-mail já está cadastrado.');
    let ok = false;
    for (let i = 0; i < 5 && !ok; i++) {

      ok = !!(r && r.length); if (!ok) await new Promise((res) => setTimeout(res, 400));

    const salvar = h('button', { class: 'btn prim', type: 'button' }, 'Salvar configurações');
    salvar.addEventListener('click', async () => {
      salvar.disabled = true;
      const novos = { nome_empresa: empresa.value.trim() || 'Atendimento', boas_vindas: boas.value.trim(), n8n_webhook_url: hook.value.trim() };
      try {
        for (const [chave, valor] of Object.entries(novos)) { const { error: e } = await db.from('config').update({ valor }).eq('chave', chave); if (e) throw e; }
        toast('Configurações salvas.');
      } catch (e) { toast(msgErro(e)); } finally { salvar.disabled = false; }
    });
    c.append(h('div', { class: 'pagina', style: 'max-width:640px' }, h('h2', {}, 'Configurações'),
      h('p', { class: 'sub' }, 'Ajustes do chat do cliente e da ligação com o n8n.'),
      h('div', { class: 'campo' }, h('label', { class: 'rot' }, 'Link do chat para clientes'),
        h('div', { class: 'link-chat' }, h('input', { type: 'text', readonly: true, value: linkChat, 'aria-label': 'Link do chat' }),
          h('button', { class: 'btn', type: 'button', onclick: async () => { try { await navigator.clipboard.writeText(linkChat); toast('Link copiado.'); } catch { toast('Copie o link manualmente.'); } } }, 'Copiar')),
        h('p', { class: 'dica' }, 'Dica: adicione ?origem=instagram (ou outro nome) ao link para saber de onde cada contato veio.')),
      h('div', { class: 'campo' }, h('label', { class: 'rot', for: 'cEmpresa' }, 'Nome exibido no chat'), empresa),
      h('div', { class: 'campo' }, h('label', { class: 'rot', for: 'cBoas' }, 'Mensagem de boas-vindas'), boas),
      h('div', { class: 'campo' }, h('label', { class: 'rot', for: 'cHook' }, 'Webhook do n8n (nova conversa)'), hook,
        h('p', { class: 'dica' }, 'Cada nova conversa envia nome, telefone, e-mail e a primeira mensagem para esse endereço. Deixe vazio para desligar.')),
      salvar));
  }

  /* ---------- catálogo do Klingo (só administrador) ---------- */
  const ROTULO_EVENTO_CAT = { novo: 'Novo', alterado: 'Alterado', removido: 'Removido', reativado: 'Reativado', bloqueado: 'Bloqueado' };
  const ROTULO_TIPO_CAT = { procedimento: 'Procedimento', plano: 'Plano', agenda: 'Agenda', preco: 'Preço' };
  async function viewCatalogo(c) {
    c.append(h('div', { class: 'pagina' }, h('h2', {}, 'Catálogo do Klingo'), h('p', { class: 'sub' }, 'Carregando…')));
    const [l, m] = await Promise.all([db.rpc('catalogo_limpeza'), db.rpc('catalogo_mudancas', { p_limite: 300 })]);
    if (S.aba !== 'catalogo') return;
    if (l.error || m.error) { c.replaceChildren(h('div', { class: 'pagina' }, h('h2', {}, 'Catálogo do Klingo'), h('p', { class: 'erro' }, msgErro(l.error || m.error)))); return; }
    const L = l.data || {}, M = m.data || [];
    const bloco = (titulo, total, itens, dica) => h('details', { class: 'cat-bloco' }, h('summary', {}, `${titulo} (${total})`),
      dica ? h('p', { class: 'dica' }, dica) : null, itens.length ? h('ul', {}, itens) : h('p', { class: 'dica' }, 'Nada a listar.'));
    const nome = (x) => h('li', {}, x.nome, x.marcacoes_90d ? h('span', { class: 'sub-lista' }, ` · ${x.marcacoes_90d} marcações em 90 dias`) : null, h('span', { class: 'sub-lista' }, ` · id ${x.id}`));
    const semAg = L.sem_agenda_vigente || {}, semPreco = L.sem_preco_com_agenda || {}, teste = L.agenda_teste || {};
    const filtro = h('select', { 'aria-label': 'Filtrar mudanças por tipo' }, [['', 'Todas as mudanças'], ...Object.entries(ROTULO_TIPO_CAT)].map(([v, r]) => h('option', { value: v }, r)));
    const corpo = h('tbody', {});
    const quando = (x) => new Date(x).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    const pintar = () => {
      const itens = M.filter((x) => !filtro.value || x.tipo === filtro.value);
      corpo.replaceChildren(...(itens.length ? itens.map((x) => h('tr', {},
        h('td', {}, quando(x.detectada_em)), h('td', {}, ROTULO_TIPO_CAT[x.tipo] || x.tipo), h('td', {}, ROTULO_EVENTO_CAT[x.evento] || x.evento),
        h('td', {}, x.descricao || x.chave), h('td', {}, x.campo ? `${x.campo}: ${x.antes ?? '—'} → ${x.depois ?? '—'}` : ''))) :
        [h('tr', {}, h('td', { colspan: 5 }, 'Nenhuma mudança registrada ainda. A cada noite o sistema compara o Klingo com o catálogo e lista aqui o que entrou, saiu ou mudou de valor.'))]));
    };
    filtro.addEventListener('change', pintar); pintar();
    c.replaceChildren(h('div', { class: 'pagina' }, h('h2', {}, 'Catálogo do Klingo'),
      h('p', { class: 'sub' }, 'O que a IA sabe hoje, o que vale limpar no cadastro do Klingo e o que mudou. Atualizado toda noite, às 03:00.'),
      h('div', { class: 'numeros' },
        h('div', { class: 'num' }, h('b', {}, L.ativos ?? 0), h('span', {}, 'procedimentos ativos')),
        h('div', { class: 'num' }, h('b', {}, L.removidos ?? 0), h('span', {}, 'removidos do Klingo')),
        h('div', { class: 'num' }, h('b', {}, semAg.total ?? 0), h('span', {}, 'sem agenda vigente')),
        h('div', { class: 'num' }, h('b', {}, semPreco.total ?? 0), h('span', {}, 'com agenda e sem preço'))),
      h('h3', {}, 'O que limpar ou completar no Klingo'),
      bloco('Sem agenda vigente', semAg.total ?? 0, (semAg.exemplos || []).map(nome), 'Procedimentos ativos que nenhum profissional atende hoje (mostrando 30). A IA não consegue oferecê-los.'),
      bloco('Com agenda e sem preço confiável', semPreco.total ?? 0, (semPreco.exemplos || []).map(nome), 'Os mais pedidos primeiro (mostrando 30). Cadastre o valor para a IA poder informar.'),
      bloco('Mais pedidos sem preparo', (L.mais_pedidos_sem_preparo || []).length, (L.mais_pedidos_sem_preparo || []).map(nome), `Só ${(L.ativos ?? 0) - (L.sem_preparo ?? 0)} procedimentos têm "Instruções - Paciente" preenchido. Comece pelos mais pedidos.`),
      bloco('Nomes duplicados', (L.nomes_duplicados || []).length, (L.nomes_duplicados || []).map((x) => h('li', {}, x.nome, h('span', { class: 'sub-lista' }, ` · ids ${(x.ids || []).join(', ')}`))), 'Mesmo nome em mais de um cadastro.'),
      bloco('Agenda de teste', teste.linhas ?? 0, (teste.profissionais || []).map((p) => h('li', {}, p)), 'Profissionais de teste na agenda. A IA já ignora, mas dá para apagar no Klingo.'),
      h('p', { class: 'dica' }, `Preços: ${L.precos_cbhpm_sem_valor_em_reais ?? 0} de convênio estão em tabela CBHPM (sem valor em reais) e ${L.precos_particular_confianca_baixa ?? 0} do Particular têm só uma marcação; a IA não usa esses.`),
      h('h3', {}, 'O que mudou'), filtro,
      h('div', { class: 'tabela-wrap', style: 'margin-top:8px' }, h('table', {},
        h('thead', {}, h('tr', {}, ['Quando', 'Tipo', 'O quê', 'Item', 'Detalhe'].map((t) => h('th', {}, t)))), corpo))));
  }

  /* ---------- início ---------- */
  db.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; desligarTempoReal(); telaLoginMostrar(false); } });
  entrar();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
