<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de atendimento</title>
<meta name="theme-color" content="#1e3a5f">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    /* Design system CSI: tokens obrigatórios */
    --csi-primary: #0088cc;
    --csi-primary-hover: #0077b3;
    --csi-sidebar-bg: #1e3a5f;
    --csi-sidebar-hover: #2a4d7a;
    --csi-danger: #e74c3c;
    --csi-danger-bg: #fdf2f0;
    --csi-success: #2ecc71;
    --csi-surface: #ffffff;
    --csi-background: #f8f9fa;
    --csi-border: #eaedf1;
    --csi-text-main: #333333;
    --csi-text-muted: #7f8c8d;
    --font-family: 'Inter', system-ui, sans-serif;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    /* Complementares: o azul e o vermelho obrigatórios não chegam a 4,5:1 com texto pequeno; estes chegam */
    --csi-primary-strong: #006ba1;        /* fundo com texto branco e texto azul sobre branco (5,8:1) */
    --csi-primary-strong-hover: #005a89;
    --csi-primary-soft: #e6f4fb;
    --csi-danger-strong: #b3261e;         /* texto de alerta sobre --csi-danger-bg */
    --csi-success-strong: #167a43;        /* texto de estado positivo */
    --csi-success-soft: #e8f8ef;
    --csi-warning-strong: #8a5a00;
    --csi-warning-soft: #fff4dc;
    --csi-text-secondary: #5a6878;        /* texto secundário legível (5,7:1); o muted fica para o que é só apoio */
    --csi-focus: 0 0 0 3px rgba(0,136,204,.28);
    --csi-border-strong: #cfd6df;         /* borda de campos de formulário */
    --csi-gap: 16px;
    --csi-ease: .15s ease;
    /* Nomes antigos do painel apontam para os tokens novos */
    --verde-escuro: var(--csi-sidebar-bg); --verde: var(--csi-primary-strong); --verde-claro: var(--csi-primary-soft); --fundo: var(--csi-background); --papel: var(--csi-surface);
    --texto: var(--csi-text-main); --suave: var(--csi-text-secondary); --linha: var(--csi-border); --erro: var(--csi-danger-strong); --aviso: var(--csi-warning-strong); --azul: var(--csi-primary-strong);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font-family); font-size: 15px; line-height: 1.4; color: var(--texto); background: var(--fundo); -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--csi-primary); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .btn { border: 1px solid var(--csi-border-strong); background: var(--papel); border-radius: var(--radius-md); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background-color var(--csi-ease), border-color var(--csi-ease), color var(--csi-ease); }
  .btn:hover { background: var(--csi-primary-soft); border-color: var(--csi-primary); }
  .btn.prim { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn.prim:hover { background: var(--csi-primary-strong-hover); border-color: var(--csi-primary-strong-hover); }
  .btn.perigo { color: var(--erro); border-color: var(--csi-danger); }
  .btn.perigo:hover { background: var(--csi-danger-bg); border-color: var(--csi-danger); }
  .anexo-caixa { margin-top: 6px; font-size: 13.5px; }
  .anexo-sub { margin: 8px 0 2px; font-weight: 650; }
  .anexo-lista { margin: 0 0 4px; padding-left: 18px; }
  .anexo-ops { color: var(--suave); font-size: 12.5px; }
  .anexo-tag { margin-left: 6px; border-radius: 999px; padding: 1px 7px; font-size: 11.5px; background: var(--verde-claro); }
  .anexo-tag.duvida, .anexo-tag.nenhum, .anexo-tag.media { background: var(--csi-warning-soft); color: var(--aviso); }
  .conferir { margin-top: 8px; border: 1px solid var(--linha); border-radius: var(--radius-md); padding: 6px 10px; background: var(--papel); }
  .conferir summary { cursor: pointer; font-weight: 650; }
  .conf-linha { border-top: 1px solid var(--linha); padding: 8px 0; display: grid; gap: 6px; }
  .conf-exame { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .conf-res { display: flex; flex-wrap: wrap; gap: 6px; }
  .conf-acoes { display: flex; gap: 8px; justify-content: flex-end; padding-top: 6px; }
  .btn:disabled { opacity: .55; cursor: default; }
  input[type=text], input[type=email], input[type=password], input[type=search], input[type=url], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--csi-border-strong); border-radius: var(--radius-md); background: var(--papel); transition: border-color var(--csi-ease), box-shadow var(--csi-ease);
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--csi-primary); box-shadow: var(--csi-focus); }
  label.rot { display: block; font-weight: 600; font-size: 13.5px; margin: 0 0 4px; }
  .campo { margin-bottom: 14px; }
  .dica { color: var(--suave); font-size: 13px; margin: 4px 0 0; }
  .erro { color: var(--erro); font-size: 14px; min-height: 1.2em; margin: 0 0 10px; }

  /* Login e telas de espera */
  .centro { min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: var(--verde-escuro); }
  .cartao { width: 100%; max-width: 380px; background: var(--papel); border-radius: var(--radius-lg); padding: 26px 24px; box-shadow: var(--shadow-md); }
  .cartao h1 { font-size: 22px; margin: 0 0 4px; }
  .cartao p.sub { margin: 0 0 18px; color: var(--suave); }
  .cartao .btn.prim { width: 100%; padding: 12px; font-size: 15px; }
  .link { background: none; border: 0; color: var(--azul); cursor: pointer; padding: 6px 0; font-size: 14px; text-decoration: underline; }

  /* App */
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); height: 100dvh; height: var(--app-h, 100dvh); }
  .lateral { background: var(--csi-sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; min-height: 0; overflow-y: auto; }
  .marca { font-weight: 700; font-size: 18px; padding: 6px 12px 16px; display: flex; align-items: center; gap: 10px; }
  .marca i { width: 10px; height: 10px; border-radius: 50%; background: #9aa9a3; display: inline-block; }
  .marca i.on { background: var(--csi-success); }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: none; border: 0; color: #dbe6f3; text-align: left; padding: 11px 12px; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 14.5px; transition: background-color var(--csi-ease), color var(--csi-ease); }
  .nav button:hover { background: var(--csi-sidebar-hover); color: #fff; }
  .nav button:focus-visible { outline-color: #fff; outline-offset: -3px; }
  .nav button[aria-current=page], .nav button[aria-current=page]:hover { background: var(--csi-primary-strong); color: #fff; }
  .triagem { background: var(--csi-primary-soft); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .triagem b { margin-right: 8px; }
  .pre { background: var(--csi-warning-soft); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .pre b { margin-right: 8px; }
  .pre .acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pre details { margin-top: 4px; }
  .pre dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0 0; }
  .pre dt { color: var(--suave); }
  .pre dd { margin: 0; overflow-wrap: anywhere; }
  .urg { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--csi-success-soft); color: var(--csi-success-strong); }
  .urg.media { background: var(--csi-warning-soft); color: var(--csi-warning-strong); }
  .urg.alta { background: var(--csi-danger-bg); color: var(--csi-danger-strong); border: 1px solid var(--csi-danger); }
  .selo { background: #f2b84b; color: #3b2a00; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 8px; min-width: 22px; text-align: center; }
  .espaco { flex: 1; }
  .eu { padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.14); font-size: 13.5px; }
  .eu b { display: block; font-size: 14px; }
  .eu span { color: #c9d8ea; }
  .eu .acoes { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .eu .acoes button { background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; font-size: 13px; transition: background-color var(--csi-ease); }
  .eu .acoes button:hover { background: var(--csi-sidebar-hover); }
  .eu .acoes button:focus-visible { outline-color: #fff; }
  /* Dados institucionais no rodapé da sidebar (bloco isolado; some na barra inferior do celular) */
  .inst { padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,.14); font-size: 11.5px; line-height: 1.45; color: #c9d8ea; }
  .inst b { display: block; color: #fff; font-size: 12px; margin-bottom: 6px; }
  .inst p { margin: 0 0 6px; overflow-wrap: anywhere; }
  .inst p:last-child { margin-bottom: 0; }
  .conteudo { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--csi-background); }
  .pagina { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; }
  .pagina h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.25; }
  .pagina p.sub { margin: 0 0 18px; color: var(--suave); }

  /* Atendimento */
  .inbox { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--csi-gap); padding: var(--csi-gap); }
  .lista { border: 1px solid var(--linha); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; background: var(--papel); display: flex; flex-direction: column; min-height: 0; }
  .filtros { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
  .chip { border: 1px solid var(--csi-border-strong); background: var(--papel); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background-color var(--csi-ease), border-color var(--csi-ease), color var(--csi-ease); }
  .chip:hover { border-color: var(--csi-primary); background: var(--csi-primary-soft); }
  .chip[aria-pressed=true] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .itens { overflow-y: auto; flex: 1; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--linha); padding: 12px 16px; cursor: pointer; }
  .item { transition: background-color var(--csi-ease); }
  .item:hover { background: var(--csi-background); }
  .item[aria-current=true] { background: var(--csi-primary-soft); box-shadow: inset 3px 0 0 var(--csi-primary); }
  .item .l1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 650; }
  .item .l1 span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .hora { font-weight: 400; font-size: 12px; color: var(--suave); flex: none; }
  .item .l2 { display: flex; justify-content: space-between; gap: 8px; color: var(--suave); font-size: 13.5px; margin-top: 2px; }
  .item .l2 .prev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .l3 { font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .tag { display: inline-block; border-radius: var(--radius-sm); padding: 1px 8px; font-size: 12px; font-weight: 650; }
  .tag.aguardando { background: var(--csi-warning-soft); color: var(--aviso); }
  .tag.em_atendimento { background: var(--csi-primary-soft); color: var(--csi-primary-strong); }
  .tag.encerrada { background: var(--csi-success-soft); color: var(--csi-success-strong); }
  .nl { background: var(--csi-primary-strong); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; padding: 0 6px; flex: none; }
  .vazio { color: var(--suave); text-align: center; padding: 36px 20px; }
  .vazio b { display: block; color: var(--texto); margin-bottom: 4px; }

  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--csi-background); border: 1px solid var(--linha); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .chat-topo { background: var(--papel); border-bottom: 1px solid var(--linha); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chat-topo .quem { flex: 1; min-width: 160px; }
  .chat-topo .quem b { font-size: 16px; display: block; }
  .chat-topo .quem span { font-size: 13px; color: var(--suave); }
  .chat-topo .quem a { color: var(--azul); }
  .voltar { display: none; }
  /* Quadro: outra forma de ver as conversas (dentro do Atendimento) */
  .modo { display: inline-flex; border: 1px solid var(--csi-border-strong); border-radius: 999px; overflow: hidden; margin-right: 4px; }
  .modo button { border: 0; background: var(--papel); padding: 5px 12px; font-size: 13px; font-weight: 650; cursor: pointer; transition: background-color var(--csi-ease); }
  .modo button:hover { background: var(--csi-primary-soft); }
  .modo button[aria-pressed=true], .modo button[aria-pressed=true]:hover { background: var(--csi-sidebar-bg); color: #fff; }
  #quadro { display: none; flex-direction: column; min-width: 0; min-height: 0; background: var(--fundo); border: 1px solid var(--linha); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .inbox.quadro { grid-template-columns: 1fr; }
  .inbox.quadro .lista, .inbox.quadro .chat { display: none; }
  .inbox.quadro #quadro { display: flex; }
  .inbox.quadro.aberta { grid-template-columns: minmax(0, 1fr) minmax(360px, 42%); }
  .inbox.quadro.aberta .chat { display: flex; }
  .q-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; background: var(--papel); border-bottom: 1px solid var(--linha); }
  .q-topo input { width: 190px; padding: 5px 10px; font-size: 13px; }
  .q-colunas { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; overflow: auto; align-items: flex-start; }
  .q-col { flex: 0 0 260px; background: #eef1f5; border-radius: var(--radius-md); display: flex; flex-direction: column; max-height: 100%; min-height: 0; }
  .q-col.alvo { outline: 2px dashed var(--csi-primary); }
  .q-col h3 { margin: 0; padding: 10px 12px 6px; font-size: 13.5px; display: flex; justify-content: space-between; gap: 6px; }
  .q-col h3 span { color: var(--suave); font-weight: 600; }
  .q-lista { overflow-y: auto; padding: 4px 8px 8px; display: grid; gap: 7px; min-height: 30px; }
  .q-card { text-align: left; background: var(--csi-surface); border: 1px solid var(--csi-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 10px 12px; cursor: pointer; display: block; width: 100%; transition: box-shadow var(--csi-ease), border-color var(--csi-ease), transform var(--csi-ease); }
  /* o leve levantar só vale com o mouse parado: não interfere no arrastar e soltar nem no clique */
  .q-card:hover:not(:active) { border-color: var(--csi-primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .q-card[aria-current=true] { border-color: var(--csi-primary); background: var(--csi-primary-soft); }
  .q-card.p2 { border-left: 4px solid #e08a00; } .q-card.p3 { border-left: 4px solid var(--csi-danger); }
  .q-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-card .q2 { color: var(--suave); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-card .q3 { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; }
  .q-chip { border-radius: var(--radius-sm); padding: 1px 7px; background: #eef1f5; color: var(--suave); font-weight: 650; }
  .q-chip.alerta { background: var(--csi-danger-bg); color: var(--csi-danger-strong); border: 1px solid var(--csi-danger); } .q-chip.aviso { background: var(--csi-warning-soft); color: var(--aviso); }
  #cartaoJ:empty { display: none; }
  .cartaoJ { background: var(--csi-background); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cartaoJ select { width: auto; padding: 5px 8px; font-size: 13px; }
  /* A mesma pessoa em várias conversas, exame em aberto e remarcação */
  #pessoa:empty, #exameAberto:empty { display: none; }
  .pessoa { background: var(--csi-primary-soft); border-bottom: 1px solid var(--linha); padding: 8px 14px; font-size: 13.5px; }
  .pessoa summary { cursor: pointer; font-weight: 650; }
  .pessoa ul { margin: 6px 0 0; padding-left: 18px; } .pessoa li { margin: 5px 0; overflow-wrap: anywhere; }
  .pessoa .btn { padding: 2px 8px; font-size: 12px; margin-left: 4px; }
  .ex-caixa { background: var(--csi-warning-soft); border-bottom: 1px solid #f0dca8; padding: 8px 14px; font-size: 13.5px; }
  .ex-caixa.falta { background: var(--csi-danger-bg); border-color: var(--csi-danger); }
  .ex-acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; } .ex-acoes .btn { padding: 4px 10px; font-size: 13px; }
  .ex-caixa .urg { margin-left: 6px; }
  .sug { background: var(--csi-primary-soft); border: 1px solid #b9dcee; border-radius: var(--radius-md); padding: 8px 10px; margin: 8px; font-size: 13.5px; }
  .sug-acoes { display: flex; gap: 6px; margin-top: 6px; } .sug-acoes .btn { padding: 4px 10px; font-size: 13px; }
  .msg-outra { align-self: center; background: rgba(30,58,95,.06); color: var(--suave); font-size: 12px; padding: 2px 10px; border-radius: 999px; margin: 6px 0 2px; }
  /* Aba Jornada: onde está cada paciente, ao vivo */
  .jornada { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--fundo); }
  .j-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; font-size: 13px; background: var(--papel); border-bottom: 1px solid var(--linha); }
  .j-status h2 { margin: 0 6px 0 0; font-size: 17px; }
  .j-status .ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--csi-success); flex: none; }
  .j-status.aviso .ponto { background: #e08a00; }
  .j-status.ruim { background: var(--csi-danger-bg); color: var(--erro); font-weight: 650; }
  .j-status.ruim .ponto { background: var(--erro); }
  .j-atencao { background: var(--csi-danger-bg); border-bottom: 1px solid var(--csi-danger); padding: 8px 12px; max-height: 32vh; overflow-y: auto; }
  .j-atencao h3 { margin: 0 0 4px; font-size: 14px; color: var(--erro); }
  .j-aviso { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid #f6dcd8; font-size: 13.5px; }
  .j-aviso .quem { flex: 1; min-width: 200px; }
  .j-aviso .quem span { display: block; color: var(--suave); font-size: 12.5px; }
  .j-aviso .btn { padding: 4px 10px; font-size: 13px; }
  .q-card.aviso { border-color: var(--csi-danger); background: var(--csi-danger-bg); }
  .selo.erro { background: var(--csi-danger-strong); color: #fff; }
  .q-topo select { width: auto; padding: 5px 8px; font-size: 13px; }
  dialog.largo { width: min(640px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto; }
  .j-sec { margin: 14px 0 0; } .j-sec h4 { margin: 0 0 4px; font-size: 13px; color: var(--suave); }
  .j-sec ul { margin: 0; padding-left: 18px; font-size: 13.5px; } .j-sec li { margin: 3px 0; overflow-wrap: anywhere; }
  .j-sec li.aberta { color: var(--erro); font-weight: 650; }
  .j-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .j-acoes select { width: auto; padding: 6px 8px; font-size: 13.5px; }
  /* Próximo passo: a única coisa que o atendente precisa decidir agora, sempre visível */
  #proximo:empty { display: none; }
  .proximo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--csi-primary-soft); border-bottom: 1px solid var(--linha); border-left: 5px solid var(--csi-primary); }
  .proximo.media { background: var(--csi-warning-soft); border-left-color: #e08a00; } .proximo.alta { background: var(--csi-danger-bg); border-left-color: var(--csi-danger); }
  .proximo .texto { flex: 1; min-width: 180px; } .proximo .texto b { display: block; font-size: 15px; }
  .proximo .texto span { font-size: 13px; color: var(--suave); }
  /* Os avisos e dados de apoio ficam numa área que rola e se ajusta à altura da tela, para a conversa nunca ficar sem espaço */

  /* ---------- aba Jornada: onde está cada paciente, ao vivo ---------- */
  // O banco lê o Klingo e vigia os prazos sozinho, a cada minuto (jornada_vigiar). O painel só mostra e avisa: não fala com o Klingo.
  const J = { cards: [], colunas: [], trans: [], estado: null, ok: true, lente: 'hoje', filtro: 'todos', unidade: '', busca: '', aberto: null, nAtencao: 0, seq: 0, canal: null, tRecarga: null,
    pessoas: new Map(), junto: new Map(), agrupar: (() => { try { return localStorage.getItem('painel.jagrupar') !== '0'; } catch { return true; } })() };
  const LENTES_J = [['hoje', 'Hoje'], ['perto', 'Ontem a amanhã'], ['todos', 'Próximos 30 dias']];
  const COLS_J = 'id,paciente_nome,coluna,coluna_nome,etapa,origem,ordem,data_ref,unidade,coluna_desde,responsavel,prioridade,versao,conversa_id,primeiro_exame,n_ativos,atrasado,n_tarefas_abertas,n_tarefas_vencidas,proxima_hora,paciente_chave';
  const hojeBR = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  const somaDiasJ = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
  const semAcento = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function duracao(desde) {
    const m = Math.max(0, Math.floor((Date.now() - new Date(desde).getTime()) / 60000));
    if (!Number.isFinite(m)) return 'algum tempo';
    if (m < 1) return 'agora';
    if (m < 60) return m + ' min';
    const hh = Math.floor(m / 60);
    if (hh < 24) return hh + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
    return Math.floor(hh / 24) + ' d';
  }
  function viewJornada(c) {
    c.append(h('div', { class: 'jornada', id: 'jornada' }));
    ligarJornada(); acordarKlingo(); renderJornada(); carregarJornada();
  }
  // Tempo real da tela: qualquer mudança em cartão, exame ou tarefa relê o quadro (com um respiro para juntar rajadas).
  function ligarJornada() {
    sairJornada();
    const recarregar = () => { clearTimeout(J.tRecarga); J.tRecarga = setTimeout(carregarJornada, 400); };
    J.canal = db.channel('painel-jornada')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'jornada_card' }, recarregar)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'jornada_exame' }, recarregar)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'jornada_tarefa' }, recarregar)
      .subscribe();
  }
  function sairJornada() {
    clearTimeout(J.tRecarga);
    if (J.canal) { db.removeChannel(J.canal); J.canal = null; }
  }
  // Painel aberto na Jornada = pede ao banco para ler o Klingo de 1 em 1 minuto, mesmo fora do expediente.
  function acordarKlingo() { db.rpc('jornada_acordar').then(() => {}, () => {}); }
  async function consultaCardsJ() {
    const hoje = hojeBR(), tam = 1000, todas = [];
    for (let de = 0; de < 5000; de += tam) {
      let q = db.from('v_jornada_quadro').select(COLS_J);
      if (J.lente === 'hoje') q = q.or(`data_ref.eq.${hoje},etapa.eq.antes,n_tarefas_vencidas.gt.0`);
      else if (J.lente === 'perto') q = q.or(`and(data_ref.gte.${somaDiasJ(hoje, -1)},data_ref.lte.${somaDiasJ(hoje, 1)}),etapa.eq.antes,n_tarefas_vencidas.gt.0`);
      const r = await q.order('id').range(de, de + tam - 1);
      if (r.error) return { error: r.error };
      todas.push(...(r.data || []));
      if ((r.data || []).length < tam) break;
    }
    return { data: todas };
  }
  async function atualizarAtencao() {
    if (!S.me || !podeAtender()) return;
    try {
      const r = await db.from('v_jornada_quadro').select('id', { count: 'exact', head: true }).gt('n_tarefas_vencidas', 0);
      if (r.error) return;
      J.nAtencao = r.count || 0;
    } catch { return; }
    const s = document.getElementById('seloJornada'); if (s) { s.textContent = J.nAtencao; s.hidden = J.nAtencao === 0; }
    atualizarSelo();
  }
  async function carregarJornada() {
    const minha = ++J.seq;
    try {
      const [cols, trans, cards, est, pess] = await Promise.all([
        db.from('jornada_coluna').select('id,nome,ordem,origem,etapa,sla_min').eq('ativa', true).order('ordem'),

  async function adicionarPessoa(nome, email, senha, papel) {
    /* cliente separado, sem guardar sessão, para não deslogar o administrador */
    const outro = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    /* o cadastro só vira equipe se o e-mail foi convidado antes por um administrador (senão vira conta de paciente) */
    const { error: eConvite } = await db.rpc('equipe_convidar', { p_email: email, p_papel: papel });
    /* banco ainda sem a função (migração não aplicada): segue como antes; com a função, qualquer outro erro interrompe */
    if (eConvite && !/could not find the function|PGRST202|schema cache/i.test(msgErro(eConvite) + ' ' + (eConvite.code || ''))) throw eConvite;
    const { data, error } = await outro.auth.signUp({ email, password: senha, options: { emailRedirectTo: PAINEL_URL, data: { nome, trocar_senha: true } } });
    if (error) throw error;
    if (!data.user || (data.user.identities && !data.user.identities.length)) throw new Error('Este e-mail já está cadastrado.');
    let ok = false;
    for (let i = 0; i < 5 && !ok; i++) {
      const { data: r, error: e2 } = await db.from('agentes').update({ papel, ativo: true }).eq('id', data.user.id).select('id');
      if (e2) throw e2;
      ok = !!(r && r.length); if (!ok) await new Promise((res) => setTimeout(res, 400));
    }
    if (!ok) throw new Error('Conta criada, mas não foi possível liberar o acesso. Libere na lista abaixo.');
  }

      tabela(['Exame', 'Operadora', 'Catálogo', 'Klingo', 'Diferença', 'Amostras'], (P.divergentes || []).map((x) => [x.exame, x.operadora, brl(x.catalogo), brl(x.klingo), (x.dif_pct > 0 ? '+' : '') + x.dif_pct + '%', x.amostras]), 'Nenhuma diferença relevante.'),
      h('h3', {}, 'Casos para melhorar o prompt'),
      h('p', { class: 'dica' }, 'Alertas e cancelamentos recentes, sem dado de paciente. Copie e use para ajustar as instruções da IA no n8n.'),
      h('div', { class: 'acoes' }, h('button', { class: 'btn', type: 'button', disabled: !EX.length, onclick: async () => { try { await navigator.clipboard.writeText(textoExemplos); toast('Casos copiados.'); } catch { toast('Não consegui copiar.'); } } }, 'Copiar casos')),
      tabela(['Quando', 'Caso', 'Exames', 'Plano', 'Etapa', 'Detalhe'], EX.map((x) => [fmtDataHora(x.quando), rotuloCaso(x.caso), (x.exames || []).join('; ') || '—', x.plano || '—', ROTULO_ETAPA[x.etapa] || x.etapa || '—', x.detalhe || '']), 'Nenhum caso no período.'),
      blocoIncidentes()));
  }

  /* ---------- problemas técnicos do chat (Fase 9): o paciente passa o código CSI-... e a equipe acha o caso ---------- */
  const ROTULO_INC = { ORD: 'Mensagens fora de ordem', LNT: 'Resposta demorou', TRV: 'Tela travada', RPC: 'Falha ao falar com o servidor', DES: 'Conversa dessincronizada', JS: 'Erro no aplicativo', DIA: 'Diagnóstico pedido pelo paciente' };
  function blocoIncidentes() {
    const campo = h('input', { type: 'search', placeholder: 'Código do paciente (ex.: CSI-261031-1432-RPC-AB23) ou só o final', 'aria-label': 'Código do incidente', style: 'width:100%;max-width:440px' });
    const saida = h('div', { 'aria-live': 'polite' });
    const buscar = async () => {
      saida.replaceChildren(h('p', { class: 'dica' }, 'Buscando…'));
      const { data, error } = await db.rpc('painel_incidentes', { p_codigo: campo.value.trim() || null, p_dias: 14, p_limite: 50 });
      if (error) { saida.replaceChildren(h('p', { class: 'erro' }, msgErro(error)), h('p', { class: 'dica' }, 'Se a mensagem fala de função inexistente, falta rodar o SQL da Fase 9 (supabase/fase9-sentinela.sql).')); return; }
      const lista = Array.isArray(data) ? data : [];
      if (!lista.length) { saida.replaceChildren(h('p', { class: 'dica' }, campo.value.trim() ? 'Nenhum caso com esse código.' : 'Nenhum problema técnico nos últimos 14 dias.')); return; }
      saida.replaceChildren(...lista.map((x) => {
        const d = x.detalhe || {};
        const resumo = [['Quando', fmtDataHora(x.criado_em)], ['Tipo', ROTULO_INC[x.tipo] || x.rotulo || x.tipo], ['Etapa', x.passo || '—'], ['Versão do chat', x.versao || '—'], ['Conversa', x.conversa_id || '—'],
          ['Chamada', d.detalhe && d.detalhe.chamada ? `${d.detalhe.chamada} (status ${d.detalhe.status ?? '—'}${d.detalhe.erro ? ', ' + d.detalhe.erro : ''})` : '—'], ['Curado sozinho', d.detalhe && d.detalhe.curado === true ? 'sim' : d.detalhe && d.detalhe.curado === false ? 'não' : '—'],
          ['Tela', d.janela || '—'], ['Aparelho', d.ua || '—']];
        return h('details', { class: 'bloco-inc', style: 'border:1px solid var(--linha);border-radius:10px;padding:8px 12px;margin:0 0 8px;background:var(--papel)' },
          h('summary', { style: 'cursor:pointer;font-weight:650' }, `${x.codigo} · ${ROTULO_INC[x.tipo] || x.tipo} · ${fmtDataHora(x.criado_em)}`),
          h('dl', { style: 'display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0' }, resumo.map(([k, v]) => [h('dt', { style: 'color:var(--suave)' }, k), h('dd', { style: 'margin:0;overflow-wrap:anywhere' }, String(v))]).flat()),
          h('p', { class: 'dica' }, 'Últimos eventos e chamadas, do mais antigo ao mais novo (sem texto de mensagens):'),
          h('pre', { style: 'white-space:pre-wrap;font-size:12px;margin:0;max-height:260px;overflow:auto' }, JSON.stringify({ eventos: d.eventos, chamadas: d.chamadas, dom: d.dom, aprendizado: d.aprendizado }, null, 1)));
      }));
    };
    campo.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); buscar(); } });
    setTimeout(buscar, 0);
    return h('div', {}, h('h3', {}, 'Problemas técnicos do chat'),
      h('p', { class: 'dica' }, 'Quando o chat do paciente trava ou erra, ele mostra um código (CSI-...). Digite o código para ver o que aconteceu, ou deixe em branco para ver os últimos 14 dias.'),
      h('div', { class: 'acoes' }, campo, h('button', { class: 'btn', type: 'button', onclick: buscar }, 'Buscar')), saida);
  }

  /* ---------- início ---------- */
  db.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; desligarTempoReal(); telaLoginMostrar(false); } });
  entrar();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();

  // Celular: o navegador às vezes não devolve a altura da tela depois que o teclado fecha e o menu fica no meio da tela.
  // Recalcula a altura real sempre que a tela muda, o teclado fecha ou o app volta ao primeiro plano.
  (function ajustarAltura() {
    const aplicar = () => document.documentElement.style.setProperty('--app-h', (window.visualViewport ? Math.round(window.visualViewport.height) : window.innerHeight) + 'px');
    const depois = () => { aplicar(); setTimeout(aplicar, 150); setTimeout(aplicar, 500); };
    aplicar();
    window.addEventListener('resize', aplicar);
    window.addEventListener('orientationchange', depois);
    window.addEventListener('pageshow', depois);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) depois(); });
    document.addEventListener('focusout', depois);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', aplicar);
  })();
</script>
</body>
</html>
