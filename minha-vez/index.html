<title>Minha vez · CSI - Clínica de Saúde e Imagem</title>
<style>
  /* Padrão visual da CSI (mesmos tokens do painel e do chat) */
  :root { --csi-primary:#0088cc; --csi-primary-strong:#006ba1; --csi-primary-soft:#e6f4fb; --csi-sidebar-bg:#1e3a5f; --csi-danger:#e74c3c; --csi-danger-bg:#fdf2f0; --csi-danger-strong:#b3261e;
    --csi-success:#2ecc71; --csi-success-strong:#167a43; --csi-success-soft:#e8f8ef; --csi-warning-strong:#8a5a00; --csi-warning-soft:#fff4dc;
    --csi-surface:#ffffff; --csi-background:#f8f9fa; --csi-border:#eaedf1; --csi-border-strong:#cfd6df; --csi-text-main:#333333; --csi-text-secondary:#5a6878;
    --font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --radius-md:10px; --radius-lg:16px; --shadow-md:0 4px 12px rgba(0,0,0,.08); --csi-focus:0 0 0 3px rgba(0,136,204,.28);
    --azul-escuro:var(--csi-sidebar-bg); --azul:var(--csi-primary-strong); --azul-claro:var(--csi-primary-soft); --fundo:var(--csi-background); --papel:var(--csi-surface); --texto:var(--csi-text-main);
    --suave:var(--csi-text-secondary); --linha:var(--csi-border); --erro:var(--csi-danger-strong); --ok:var(--csi-success-strong); --ok-claro:var(--csi-success-soft); --aviso:var(--csi-warning-strong); --aviso-claro:var(--csi-warning-soft); }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { font-family:var(--font-family); background:var(--fundo); color:var(--texto); font-size:18px; line-height:1.45; }
  header { background:var(--csi-surface); color:var(--csi-sidebar-bg); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:3px solid var(--csi-primary); }
  .marca-cab { display:flex; align-items:center; gap:10px; min-width:0; } .marca-cab img { height:25px; width:auto; flex:none; }
  header b { font-size:1.05rem; }
  header button { background:transparent; color:inherit; border:1px solid currentColor; border-radius:10px; padding:8px 12px; font-size:.9rem; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  .cartao { background:var(--papel); border:1px solid var(--linha); border-radius:var(--radius-lg); padding:20px; margin-bottom:14px; box-shadow:var(--shadow-md); }
  h1 { font-size:1.35rem; margin:0 0 8px; }
  p { margin:0 0 12px; }
  .suave { color:var(--suave); font-size:.95rem; }
  .campo { margin-bottom:14px; }
  .campo label { display:block; font-weight:600; margin-bottom:4px; }
  .campo input { width:100%; font-size:1rem; padding:12px; border:1px solid var(--linha); border-radius:10px; background:var(--papel); color:var(--texto); }
  button.principal { width:100%; background:var(--azul); color:#fff; border:0; border-radius:12px; padding:16px; font-size:1.1rem; font-weight:700; cursor:pointer; }
  button.principal:disabled { opacity:.6; }
  button.verde { width:100%; background:var(--csi-success-strong); color:#fff; border:0; border-radius:16px; font-size:1.7rem; font-weight:800; padding:28px 16px; cursor:pointer; box-shadow:0 4px 14px rgba(22,122,67,.35); }
  button.verde:disabled { opacity:.6; }
  button.link { background:none; border:0; color:var(--azul); text-decoration:underline; font-size:.95rem; padding:8px 0; cursor:pointer; }
  a { color:var(--azul); }
  .erro { color:var(--erro); font-weight:600; }
  .posicao { text-align:center; }
  .posicao .num { font-size:5.5rem; font-weight:800; line-height:1; color:var(--azul); }
  .posicao .rot { font-size:1.1rem; margin-top:4px; }
  .perto { background:var(--aviso-claro); border-color:var(--aviso); }
  .perto .num { color:var(--aviso); }
  .vez { background:var(--ok-claro); border-color:var(--ok); text-align:center; }
  .vez h1 { color:var(--ok); font-size:2rem; }
  .selo { display:inline-block; padding:4px 10px; border-radius:999px; font-size:.85rem; font-weight:700; background:var(--azul-claro); }
  .selo.ok { background:var(--ok-claro); color:var(--ok); } .selo.mau { background:var(--aviso-claro); color:var(--aviso); }
  .passo { display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
  h2 { font-size:1.15rem; margin:0 0 6px; }
  .barra { height:12px; border-radius:999px; background:var(--csi-border); overflow:hidden; margin:10px 0 6px; }
  .barra > i { display:block; height:100%; background:var(--csi-success-strong); border-radius:999px; transition:width .6s ease; }
  .exame { border-top:1px solid var(--linha); padding:14px 0 4px; }
  .exame:first-of-type { border-top:0; padding-top:6px; }
  .exame b { display:block; font-size:1.02rem; }
  .passos { display:flex; list-style:none; margin:12px 0 8px; padding:0; }
  .passos li { flex:1; text-align:center; position:relative; font-size:.62rem; line-height:1.15; padding:0 1px; overflow-wrap:anywhere; color:var(--suave); }
  .passos li::before { content:''; position:absolute; top:13px; left:-50%; width:100%; height:3px; background:var(--csi-border-strong); z-index:0; }
  .passos li:first-child::before { display:none; }
  .passos .bolha { position:relative; z-index:1; width:28px; height:28px; border-radius:50%; margin:0 auto 4px; display:flex; align-items:center; justify-content:center; background:var(--papel); border:3px solid var(--csi-border-strong); font-weight:800; font-size:.8rem; }
  .passos li.feito { color:var(--texto); } .passos li.feito::before { background:var(--csi-success-strong); }
  .passos li.feito .bolha { background:var(--csi-success-strong); border-color:var(--csi-success-strong); color:#fff; }
  .passos li.agora { color:var(--azul); font-weight:700; } .passos li.agora::before { background:linear-gradient(90deg, var(--csi-success-strong), var(--csi-primary)); }
  .passos li.agora .bolha { border-color:var(--csi-primary); border-top-color:transparent; animation:girar 1.1s linear infinite; }
  .msg { margin:0 0 10px; font-size:.95rem; }
  .excecao { background:var(--aviso-claro); border-radius:var(--radius-md); padding:10px 12px; margin:8px 0 10px; font-size:.95rem; }
  .dia { color:var(--suave); font-size:.9rem; margin:0 0 4px; }
  @keyframes girar { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .passos li.agora .bolha { animation:none; border-top-color:var(--csi-primary); } .barra > i { transition:none; } }

  /* Acompanhe seus pedidos (acesso rápido: login automático pelo aparelho) */
  .pedidos h1 { margin-bottom:4px; } .pedidos .quem { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
  .chip { border:1.5px solid var(--csi-border-strong); background:var(--papel); color:var(--texto); border-radius:999px; padding:9px 16px; font:inherit; font-size:.95rem; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--azul); border-color:var(--azul); color:#fff; }
  .pedido { cursor:pointer; position:relative; } .pedido:focus-visible { outline:3px solid var(--csi-primary); outline-offset:2px; }
  .pedido .topo { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:2px; }
  .pedido .pessoa { font-weight:700; } .pedido .dica { color:var(--suave); font-size:.85rem; margin:8px 0 0; }
  .novo { display:inline-block; background:#e5484d; color:#fff; border-radius:999px; font-size:.75rem; font-weight:800; padding:3px 9px; }
  .quando { color:var(--azul); font-weight:700; margin:4px 0 2px; font-size:.98rem; }
  .voucher { color:var(--suave); font-size:.92rem; margin:2px 0 6px; } .voucher b { display:inline; color:var(--texto); }
  .etapa-hoje { margin:6px 0 4px; }
  .res-box { border-radius:var(--radius-md); padding:10px 12px; margin:8px 0 4px; font-size:.95rem; background:var(--azul-claro); }
  .res-box.disp { background:var(--ok-claro); border:1px solid var(--ok); }
  button.sec { width:100%; background:var(--azul-claro); color:var(--azul); border:0; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:8px; }
  button.perigo { width:100%; background:var(--csi-danger-bg); color:var(--erro); border:0; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:8px; }
  .selo.enc { background:var(--csi-border); color:var(--suave); }
  .enc-box { background:var(--csi-background); border:1px solid var(--linha); border-radius:var(--radius-md); padding:12px; margin:10px 0 4px; font-size:.95rem; }
  .enc-box p { margin:0; } .enc-box .suave { margin-top:4px; font-size:.88rem; }
  .enc-acoes { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; } .enc-acoes button { flex:1 1 140px; margin-top:0; }
  .enc-acoes button.link { flex:1 1 100%; text-align:center; }
  .bom { color:var(--ok); font-weight:600; }
  .aval-grupo { border:0; padding:0; margin:0 0 16px; min-width:0; } .aval-grupo legend { font-weight:700; margin-bottom:8px; padding:0; }
  .aval-notas, .aval-canais { display:flex; flex-wrap:wrap; gap:6px; } .aval-nota, .aval-canal { position:relative; }
  .aval-nota input, .aval-canal input { position:absolute; opacity:0; inset:0; margin:0; width:100%; height:100%; cursor:pointer; }
  .aval-nota span, .aval-canal span { display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:42px; padding:0 14px; border:1.5px solid var(--csi-border-strong); border-radius:10px; font-weight:700; background:var(--papel); }
  .aval-nota input:checked + span, .aval-canal input:checked + span { background:var(--azul); border-color:var(--azul); color:#fff; }
  .aval-nota input:focus-visible + span, .aval-canal input:focus-visible + span { outline:3px solid var(--csi-primary); outline-offset:2px; }
  .folha { position:fixed; inset:0; background:rgba(10,25,40,.55); display:flex; align-items:flex-end; justify-content:center; z-index:30; }
  .folha > div { background:var(--papel); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:18px 16px max(20px,env(safe-area-inset-bottom)); max-height:90vh; overflow:auto; }
  .pin-pontos { display:flex; justify-content:center; gap:16px; margin:18px 0 6px; } .pin-pontos i { width:16px; height:16px; border-radius:50%; border:2px solid var(--azul); } .pin-pontos i.on { background:var(--azul); }
  .pin-teclas { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:300px; margin:14px auto; }
  .pin-teclas button { height:62px; border-radius:50%; border:1px solid var(--linha); background:var(--papel); color:var(--texto); font-size:1.5rem; font-weight:600; cursor:pointer; } .pin-teclas .vazio { visibility:hidden; }
  [hidden] { display:none !important; }
  .vivo { display:inline-block; width:10px; height:10px; border-radius:50%; background:#9aa; margin-right:6px; } .vivo.on { background:#2ecc71; }
</style>

<body>
<header><span class="marca-cab"><img src="../img/logo-csi-simbolo.svg" alt="CSI - Clínica de Saúde e Imagem" width="75" height="25"><b>Minha vez na clínica</b></span><button type="button" id="btnSair" hidden>Sair</button></header>
<main id="raiz"><div class="cartao"><p>Carregando…</p></div></main>
<footer style="text-align:center;padding:12px 16px 24px;font-size:.9rem"><a href="../privacidade.html">Política de Privacidade</a> · <a href="../termos.html">Termos de Serviço</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../nomes-exame.js"></script>
<script>
(() => {
  'use strict';
  const SUPABASE_URL = 'https://nrvuynjwcgwpjdptkiay.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_e2GK1YGEj06STa_ESCevow_nvtATB-y';
  const CHAT_URL = '../';
  const AVISAR_PERTO = 2;   // só para o aviso local de reserva; o servidor decide o aviso real (config.fila_aviso_antes)
  const raiz = document.getElementById('raiz'), btnSair = document.getElementById('btnSair');
  // Mesma chave de sessão do chat: quem já entrou no chat já está logado aqui.
  // O aparelho (código do acesso rápido) vai no cabeçalho x-acesso de TODA chamada ao banco: é com ele que o SERVIDOR confere o PIN (config.app_pin_servidor).
  // Se o servidor recusar com "pin_obrigatorio" (PIN vencido ou aparelho desconhecido), a pessoa volta à porta do PIN. Mesma regra do chat.
  const aparelhoSalvo = () => { try { const j = JSON.parse(localStorage.getItem('csi_acesso_v2') || 'null'); return j && typeof j.dev === 'string' ? j.dev : ''; } catch { return ''; } };
  const fetchComAparelho = async (url, opcoes) => {
    if (!/\/rest\/v1\/rpc\//.test(String(url))) return fetch(url, opcoes);
    const dev = aparelhoSalvo();
    let o = opcoes || {};
    if (dev) { const hs = new Headers(o.headers || {}); hs.set('x-acesso', dev); o = { ...o, headers: hs }; }
    const r = await fetch(url, o);
    if (!r.ok && r.status < 500) { try { if ((await r.clone().text()).includes('pin_obrigatorio')) setTimeout(() => { try { irParaPorta(); } catch { /* ignora */ } }, 0); } catch { /* ignora */ } }
    return r;
  };
  // Mesma chave de sessão do chat: quem já entrou no chat já está logado aqui.
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { fetch: fetchComAparelho }, auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'csi-paciente-auth' } });

  /* ---------- Porta do PIN (mesma regra do chat) ----------
     Com o PIN obrigatório não existe check-in nem entrada por e-mail e senha fora do PIN: quem não tem o aparelho com PIN vai à página /acesso/ (cria o PIN; os cadastros antigos entram uma última vez e criam o PIN)
     e volta aqui. Só o link da fila que a clínica emitiu (ticket) continua mostrando a fila. Se a porta não conseguir terminar, mostra um aviso: NUNCA abre sem PIN. */
  let portaObrig = false;
  function portaRaiz() { return location.pathname.replace(/[^/]*$/, '').replace(/minha-vez\/.*$/, ''); }
  function telaPortaFalhou() {
    btnSair.hidden = true; modo = null;
    mostrar(h('div', { class: 'cartao' }, h('h1', {}, 'Não conseguimos abrir o seu acesso agora.'),
      h('a', { class: 'principal', id: 'portaTentar', href: portaRaiz() + 'acesso/?voltar=acompanhar', onclick: () => { try { sessionStorage.removeItem('csi_mv_tent'); } catch { /* ignora */ } }, style: 'display:block;text-align:center;text-decoration:none' }, 'Tentar de novo'),
      h('p', { class: 'suave' }, 'Se continuar, ligue para (71) 3181-7666 ou chame no WhatsApp (71) 99980-3806.')));
  }
  function irParaPorta() {
    let t = null; try { t = JSON.parse(sessionStorage.getItem('csi_mv_tent') || 'null'); } catch { t = null; }
    t = t && Date.now() - t.t < 60000 ? { n: t.n + 1, t: t.t } : { n: 1, t: Date.now() };
    try { sessionStorage.setItem('csi_mv_tent', JSON.stringify(t)); } catch { /* sem armazenamento: segue */ }
    if (t.n > 3) { telaPortaFalhou(); return false; }   // trava contra laço: não abre sem PIN, mostra o aviso
    location.replace(portaRaiz() + 'acesso/?voltar=acompanhar');
    return true;
  }
  async function lerPorta() {
    try { const { data, error } = await db.rpc('app_porta'); if (!error && data && data.ativo !== undefined) { portaObrig = data.ativo === true && data.obrigatorio === true; return; } } catch { /* sem rede: usa o que o aparelho lembra */ }
    try { portaObrig = localStorage.getItem('csi_porta_v1') === '1'; } catch { portaObrig = false; }   // a pergunta falhou: se o PIN era obrigatório neste aparelho, continua sendo
  }

  function h(tag, props, ...filhos) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else e.setAttribute(k, v === true ? '' : v);
    }
    for (const f of filhos.flat()) if (f != null && f !== false) e.append(f.nodeType ? f : document.createTextNode(String(f)));
    return e;
  }
  const mostrar = (...nos) => raiz.replaceChildren(...nos);
  const pode = 'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const instalado = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  let reg = null, canal = null, tPoll = null, ultimo = null, sessao = null, modo = null, pedirCheckinAoEntrar = false;   // modo: 'conta' (logado) | 'ticket' (check-in sem login) | null

  /* ---------- 1) início: check-in sem login ---------- */
  const TICKET_CHAVE = 'csi-checkin-ticket';
  const guardarTicket = (t) => { try { if (t) localStorage.setItem(TICKET_CHAVE, t); else localStorage.removeItem(TICKET_CHAVE); } catch { /* sem armazenamento: o ticket vale só nesta tela */ memTicket = t || null; } };
  let memTicket = null;
  const lerTicket = () => { try { return localStorage.getItem(TICKET_CHAVE) || memTicket; } catch { return memTicket; } };

  function telaInicio() {
    btnSair.hidden = true; modo = null;
    mostrar(h('div', { class: 'cartao' },
      h('h1', {}, 'Chegou na clínica?'),
      h('button', { class: 'verde', type: 'button', id: 'btnCheckin', onclick: () => telaCheckin() }, 'Fazer check-in'),
      h('p', { class: 'suave', style: 'margin-top:14px' }, 'Ainda não se cadastrou? Sem problema: faça o check-in e você será chamado.'),
      h('p', { style: 'margin-top:18px;margin-bottom:0' }, 'Já tem conta? ', h('button', { class: 'link', type: 'button', id: 'btnJaTenho', onclick: () => telaLogin() }, 'Entrar com e-mail e senha'))),
      h('div', { class: 'cartao', id: 'conviteAcesso' }, h('h2', {}, 'Acompanhe seus pedidos'), h('p', { class: 'suave' }, 'Com o acesso rápido (celular e PIN) você vê o andamento dos seus pedidos e dos seus filhos, remarca, cancela e recebe os laudos em PDF.'),
        h('a', { class: 'link', href: '../acesso/?voltar=acompanhar' }, 'Entrar ou criar o acesso rápido')));
  }

  function campo(id, rotulo, props) { return h('div', { class: 'campo' }, h('label', { for: id }, rotulo), h('input', Object.assign({ id }, props))); }

  function telaCheckin(msg, v) {
    v = v || {}; btnSair.hidden = true; modo = null;
    const nome = campo('cn', 'Nome completo', { type: 'text', autocomplete: 'name', required: true, maxlength: 120, value: v.nome || '' });
    const email = campo('ce', 'E-mail', { type: 'email', autocomplete: 'email', inputmode: 'email', required: true, maxlength: 200, value: v.email || '' });
    const fone = campo('ct', 'Celular com DDD', { type: 'tel', autocomplete: 'tel', inputmode: 'tel', required: true, maxlength: 20, placeholder: '(11) 91234-5678', value: v.fone || '' });
    const erro = h('p', { class: 'erro', role: 'alert' }, msg || '');
    const btn = h('button', { class: 'verde', style: 'font-size:1.3rem;padding:20px 12px', type: 'submit' }, 'Fazer check-in');
    mostrar(h('form', { class: 'cartao', novalidate: true, onsubmit: async (ev) => {
      ev.preventDefault(); erro.textContent = ''; btn.disabled = true;
      const d = { nome: nome.querySelector('input').value.trim(), email: email.querySelector('input').value.trim(), fone: fone.querySelector('input').value.trim() };
      try { await enviarCheckin(d, false); }
      catch (e) { erro.textContent = e.message || 'Não foi possível fazer o check-in. Tente de novo.'; btn.disabled = false; }
    } },
      h('h1', {}, 'Seus dados'), h('p', { class: 'suave' }, 'Só precisamos disto para chamar você.'),
      nome, email, fone, erro, btn,
      h('button', { class: 'link', type: 'button', onclick: () => telaInicio() }, 'Voltar')));
  }

  async function enviarCheckin(d, ajudaSenha) {
    const { data, error } = await db.rpc('checkin_publico', { p_nome: d.nome, p_email: d.email, p_telefone: d.fone, p_ajuda_senha: ajudaSenha });
    if (error) throw new Error(error.code === '22023' || error.code === '54000' ? error.message : 'Não foi possível fazer o check-in agora. Tente de novo ou fale com a recepção.');
    if (data && data.situacao === 'conta_existente') return telaContaExistente(d);
    if (!data || !data.ticket) throw new Error('Não foi possível fazer o check-in agora.');
    guardarTicket(data.ticket); iniciar();
  }

  // Os mesmos dados de uma conta: entrar com a senha (e já avisar a chegada) ou pedir ajuda da recepção.
  function telaContaExistente(d) {
    btnSair.hidden = true; modo = null;
    const senha = h('input', { id: 's', type: 'password', autocomplete: 'current-password', maxlength: 72 });
    const erro = h('p', { class: 'erro', role: 'alert' });
    const btn = h('button', { class: 'principal', type: 'submit' }, 'Entrar e fazer check-in');
    const ajuda = h('button', { class: 'link', type: 'button', id: 'btnEsqueci', onclick: async (e) => {
      e.currentTarget.disabled = true; erro.textContent = '';
      try { await enviarCheckin(d, true); } catch (x) { erro.textContent = x.message; e.currentTarget.disabled = false; }
    } }, 'Não lembro a senha: chamar a recepção');
    mostrar(h('form', { class: 'cartao', novalidate: true, onsubmit: async (ev) => {
      ev.preventDefault(); erro.textContent = ''; btn.disabled = true;
      try { await entrar(d.email, senha.value, true); } catch (x) { erro.textContent = x.message; btn.disabled = false; }
    } },

      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ParaBytes(vapid) });
      const j = sub.toJSON();
      await db.rpc('fila_push_salvar', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
    } catch { /* o portal segue sem push */ }

    const canais = h('fieldset', { class: 'aval-grupo' }, h('legend', {}, 'Por onde você nos conheceu?'),
      h('div', { class: 'aval-canais' }, ['WhatsApp', 'Instagram', 'Google'].map((c) => h('label', { class: 'aval-canal' }, h('input', { type: 'radio', name: 'canal', value: c }), h('span', {}, c)))));
    const estado = h('p', { class: 'erro', role: 'alert', style: 'min-height:1.3em;margin:0 0 8px' });
    const enviar = h('button', { class: 'principal', type: 'submit' }, 'Enviar avaliação');
    const form = h('form', { novalidate: true, onsubmit: async (ev) => {
      ev.preventDefault();
      const v = (n) => { const x = form.querySelector(`input[name="${n}"]:checked`); return x ? x.value : null; };
      const a = v('atendimento'), si = v('site'), c = v('canal');
      if (a === null || si === null || !c) { estado.textContent = 'Escolha uma nota nas duas perguntas e por onde nos conheceu.'; return; }
      enviar.disabled = true; estado.textContent = '';
      const { data, error } = await db.rpc('app_pedido_avaliar', { p_token: app.dev, p_conversa: p.conversa, p_nota_atendimento: Number(a), p_nota_site: Number(si), p_canal: c });
      if (data && data.erro === 'bloqueado') { fecharFolha(); appDesligar(); return telaPin(); }
      if (error || !data || !data.ok) { enviar.disabled = false; estado.textContent = (data && data.mensagem) || 'Não foi possível enviar agora. Suas respostas continuam aqui; toque em Enviar para tentar de novo.'; return; }
      fecharFolha(); appRecarregar('Obrigado pela sua avaliação!', true);
    } },
      h('h2', {}, 'Avaliar o atendimento'), h('p', { class: 'suave' }, 'É rápido e opcional. Não pedimos seu nome nem seu telefone.'),
      grupo('atendimento', 'De 0 a 10, como foi o seu atendimento?'), grupo('site', 'De 0 a 10, como você avalia o nosso site?'), canais, estado, enviar,
      h('button', { class: 'link', type: 'button', style: 'width:100%;text-align:center', onclick: fecharFolha }, 'Agora não'));
    document.body.append(h('div', { class: 'folha', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Avaliar o atendimento', onclick: (ev) => { if (ev.target === ev.currentTarget) fecharFolha(); } }, h('div', {}, form)));
  }
  /* ---------- Meus laudos (16/11/2026) ----------
     Vêm da Edge Function app-laudos: a clínica confirma CPF + nascimento + nome no Klingo, lista as marcações atendidas e diz se o laudo está pronto.
     O PDF NÃO fica guardado em lugar nenhum: cada toque em "Baixar" busca no Klingo de novo. Se a equipe retirou o laudo para ajuste, o download é recusado e o cartão mostra "em revisão". */
  const LAUDOS_URL = SUPABASE_URL + '/functions/v1/app-laudos';
  const laudos = { itens: null, pessoas: [], erro: '', carregando: false, em: 0, baixando: new Set(), abertos: {} };
  async function laudosChamar(corpo) {
    const r = await fetch(LAUDOS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify({ token: app.dev, ...corpo }) });
    return r.json();
  }
  async function laudosCarregar(forcar) {
    if (!app.dev || laudos.carregando) return;
    laudos.carregando = true; if (forcar) redesenhar();
    try {
      const r = await laudosChamar({ acao: 'listar', forcar: !!forcar });
      if (r && r.erro === 'bloqueado') { appDesligar(); laudos.carregando = false; return telaPin(); }
      if (r && r.erro === 'desligado') { laudos.itens = []; laudos.pessoas = []; laudos.erro = ''; }
      else if (!r || !r.ok) laudos.erro = (r && r.mensagem) || 'Não foi possível consultar os laudos agora.';
      else { laudos.itens = Array.isArray(r.itens) ? r.itens : []; laudos.pessoas = Array.isArray(r.pessoas) ? r.pessoas : []; laudos.erro = ''; laudos.em = Date.now(); }
    } catch { laudos.erro = 'Sem conexão para consultar os laudos. Tente de novo.'; }
    laudos.carregando = false;
    if (!document.querySelector('.folha')) redesenhar();
  }
  function laudoArquivo(a) {
    const bytes = Uint8Array.from(atob(a.base64), (c) => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: a.mime || 'application/pdf' }));
    setTimeout(() => URL.revokeObjectURL(url), 5 * 60000);
    return { url, nome: a.nome || 'laudo.pdf' };
  }
  async function laudoBaixar(it, btn) {
    if (laudos.baixando.has(it.id)) return;
    laudos.baixando.add(it.id); btn.disabled = true; btn.textContent = 'Conferindo com a clínica…';
    try {
      const r = await laudosChamar({ acao: 'baixar', id: it.id });
      if (r && (r.erro === 'bloqueado' || r.erro === 'sessao')) { laudos.baixando.delete(it.id); if (r.erro === 'bloqueado') { appDesligar(); return telaPin(); } try { localStorage.removeItem(ACESSO_CHAVE); } catch { /* ignora */ } app.dev = ''; return telaInicio(); }
      if (!r || !r.ok || !Array.isArray(r.arquivos) || !r.arquivos.length) {
        avisoTela((r && r.mensagem) || 'Não foi possível baixar o laudo agora. Tente de novo.');
        if (r && r.erro === 'indisponivel') { laudos.baixando.delete(it.id); laudos.carregando = false; await laudosCarregar(false); }
      } else {
        const arqs = r.arquivos.map(laudoArquivo); laudos.abertos[it.id] = arqs;
        for (const a of arqs) { try { const l = h('a', { href: a.url, download: a.nome }); document.body.append(l); l.click(); l.remove(); } catch { /* o link "Abrir o laudo" abaixo serve de reserva */ } }
        redesenhar();
      }
    } catch { avisoTela('Sem conexão. Tente de novo.'); }
    laudos.baixando.delete(it.id);
    if (!document.querySelector('.folha')) redesenhar();
  }
  const ORDEM_LAUDO = { disponivel: 0, em_revisao: 1, aguardando: 2 };
  function laudosNos() {
    if (!app.dados) return [];
    const varias = app.dados.pessoas.length > 1;
    const itens = (laudos.itens || []).slice().sort((a, b) => (ORDEM_LAUDO[a.estado] - ORDEM_LAUDO[b.estado]) || String(b.data || '').localeCompare(String(a.data || '')));
    const sem = laudos.pessoas.filter((p) => p.situacao === 'sem_cpf'), divergentes = laudos.pessoas.filter((p) => p.situacao === 'divergente'), travados = laudos.pessoas.filter((p) => p.situacao === 'travado');
    if (laudos.itens === null && !laudos.erro) return laudos.carregando ? [h('div', { class: 'cartao', id: 'laudos' }, h('p', { class: 'suave', style: 'margin:0', role: 'status' }, 'Procurando os seus laudos…'))] : [];
    if (!itens.length && !laudos.erro && !sem.length && !divergentes.length && !travados.length) return [];   // nada a mostrar: quem ainda não fez exame não vê cartão vazio
    const laudosDe = (p) => (p.eu ? 'os seus laudos' : 'os laudos de ' + primeiroNome(p.nome)), cadastroDe = (p) => (p.eu ? 'o seu cadastro' : 'o cadastro de ' + primeiroNome(p.nome));
    const aviso = (txt, link) => h('p', { class: 'suave', style: 'margin:8px 0 0' }, txt, link ? [' ', h('a', { href: '../acesso/?ir=dados' }, 'Abrir Meus dados')] : null);
    const lista = itens.map((it) => {
      const rot = (varias ? primeiroNome(it.pessoa) + ' · ' : '') + (it.data ? 'exame de ' + dataBR(it.data) : '') + (it.unidade ? ' · ' + it.unidade : '');
      const filhos = [h('b', {}, tituloExame(it.nome || 'Exame')), h('p', { class: 'dia' }, rot)];
      if (it.estado === 'disponivel') {
        const ocupado = laudos.baixando.has(it.id);
        filhos.push(h('button', { class: 'principal', type: 'button', 'data-laudo': it.id, disabled: ocupado, onclick: (ev) => laudoBaixar(it, ev.currentTarget) }, ocupado ? 'Conferindo com a clínica…' : '📄 Baixar laudo (PDF)'));
        for (const a of laudos.abertos[it.id] || []) filhos.push(h('a', { class: 'abrir-laudo', href: a.url, download: a.nome, target: '_blank', rel: 'noopener', style: 'display:block;margin-top:8px' }, '↗ Abrir o laudo baixado'));
      } else if (it.estado === 'em_revisao') filhos.push(h('div', { class: 'res-box', 'data-estado': 'em_revisao' }, '⚠️ Este laudo está em revisão pela equipe e não pode ser baixado agora. Ele volta a aparecer aqui assim que for liberado.'));
      else filhos.push(h('div', { class: 'res-box', 'data-estado': 'aguardando' }, 'Aguardando a liberação do laudo. Quando estiver pronto, ele aparece aqui.'));
      return h('div', { class: 'exame', 'data-id': it.id }, filhos);
    });
    const cartao = h('div', { class: 'cartao', id: 'laudos' }, h('h2', {}, 'Meus laudos'),
      itens.some((i) => i.estado === 'disponivel') ? h('p', { class: 'suave', style: 'margin:0 0 6px' }, 'Você pode baixar quantas vezes quiser. Antes de cada download conferimos com a clínica se o laudo continua liberado.') : null,
      lista,
      sem.length ? aviso('Para ver ' + sem.map(laudosDe).join(' e ') + ', informe o CPF em', true) : null,
      divergentes.length ? aviso('Não conseguimos confirmar na clínica ' + divergentes.map(cadastroDe).join(' e ') + '. Confira o CPF, a data de nascimento e o nome em', true) : null,
      travados.length ? aviso('Muitas tentativas para ' + travados.map(cadastroDe).join(' e ') + '. Tente de novo mais tarde ou fale com a clínica.') : null,
      laudos.erro ? h('p', { class: 'erro', role: 'alert', style: 'margin:8px 0 0' }, laudos.erro) : null,
      h('button', { class: 'link', type: 'button', id: 'laudosAtualizar', disabled: laudos.carregando, onclick: () => laudosCarregar(true) }, laudos.carregando ? 'Atualizando…' : 'Atualizar laudos'));
    return [cartao];
  }
  function resultadosNos() {
    const lista = (app.dados && app.dados.resultados) || []; if (!lista.length) return [];
    const arquivo = async (r, btn) => {
      btn.disabled = true;
      try {
        const { data } = await db.rpc('app_resultado_arquivo', { p_token: app.dev, p_id: r.id });
        if (!data || !data.ok) { btn.disabled = false; return avisoTela((data && data.mensagem) || 'Não foi possível abrir agora.'); }
        const bin = atob(data.base64), bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bytes], { type: data.mime || 'application/pdf' }));
        window.open(url, '_blank', 'noopener'); setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch { avisoTela('Não foi possível abrir agora.'); }
      btn.disabled = false;
    };
    return [h('div', { class: 'cartao', id: 'resultados' }, h('h2', {}, 'Resultados guardados'),
      h('p', { class: 'suave' }, 'Os resultados entregues ficam aqui, separados dos pedidos em andamento.'),
      lista.map((r) => h('div', { class: 'exame' }, h('b', {}, tituloExame(r.nome || 'Exame')),
        h('p', { class: 'dia' }, (app.dados.pessoas.length > 1 ? primeiroNome(r.pessoa) + ' · ' : '') + (r.data_exame ? 'exame de ' + dataBR(r.data_exame) + ' · ' : '') + 'entregue em ' + dataBR(r.entregue_em)),
        r.tem_arquivo ? h('button', { class: 'sec', type: 'button', onclick: (ev) => arquivo(r, ev.currentTarget) }, '📄 Ver o resultado')
          : (r.conversa ? h('button', { class: 'sec', type: 'button', onclick: (ev) => appAcao(r.conversa, 'conversa', null, ev.currentTarget.closest('.cartao')) }, '💬 Ver na conversa') : null))))];
  }
  function appNos() {
    const d = app.dados; if (!d) return [];
    const varias = d.pessoas.length > 1;
    const filtro = app.pessoa === 'todos' ? null : app.pessoa;
    const lista = d.pedidos.filter((p) => !filtro || primeiroNome(p.pessoa) === filtro || (filtro === 'eu' && p.eu));
    const nos = [h('div', { class: 'cartao pedidos' }, h('h1', {}, 'Acompanhe seus pedidos'),
      h('p', { class: 'suave', style: 'margin:0' }, d.novidades > 0 ? (d.novidades === 1 ? '1 novidade desde a última vez.' : d.novidades + ' novidades desde a última vez.') : 'Tudo em dia. Atualizamos sozinho.'),
      varias ? h('div', { class: 'quem', role: 'group', 'aria-label': 'Quem' }, [h('button', { class: 'chip' + (!filtro ? ' on' : ''), type: 'button', onclick: () => { app.pessoa = 'todos'; desenharApp.atual(); } }, 'Todos'),
        ...d.pessoas.map((p) => { const k = p.eu ? 'eu' : primeiroNome(p.nome); return h('button', { class: 'chip' + (filtro === k ? ' on' : ''), type: 'button', onclick: () => { app.pessoa = k; desenharApp.atual(); } }, p.eu ? 'Eu' : primeiroNome(p.nome)); })]) : null)];
    if (app.aviso) nos.unshift(h('div', { class: 'cartao' }, h('p', { class: app.avisoBom ? 'bom' : 'erro', role: app.avisoBom ? 'status' : 'alert', id: 'avisoTela', style: 'margin:0' }, app.aviso)));
    nos.push(...laudosNos());
    if (!lista.length) nos.push(h('div', { class: 'cartao' }, h('p', { style: 'margin:0' }, 'Nenhum pedido por aqui ainda. Os pedidos feitos neste aparelho aparecem sozinhos.'), h('a', { href: '../', style: 'display:inline-block;margin-top:10px' }, 'Fazer um pedido no chat')));
    for (const p of lista) nos.push(pedidoNo(p, varias));
    nos.push(...resultadosNos());
    return nos;
  }
  // Sem fila (ainda sem check-in hoje): saudação, check-in de um toque e os pedidos
  function desenharApp() {
    desenharApp.atual = desenharApp; btnSair.hidden = true;
    const d = app.dados; if (!d) return telaInicio();
    const nos = [h('div', { class: 'cartao' }, h('h2', {}, 'Olá, ' + primeiroNome(d.nome) + '!'),
      h('p', { class: 'suave' }, 'Chegou na clínica? Faça o check-in com um toque e acompanhe a sua vez aqui.'),
      h('button', { class: 'verde', style: 'font-size:1.4rem;padding:22px 12px', type: 'button', id: 'btnCheckinApp', onclick: (ev) => checkinApp(ev.currentTarget) }, 'Fazer check-in'))];
    nos.push(...appNos());
    nos.push(h('p', { style: 'text-align:center' }, h('a', { href: '../' }, '← Voltar ao chat')));
    mostrar(...nos);
  }
  // Um toque: o PIN já provou quem é, então o SERVIDOR (app_checkin) usa o nome, o e-mail e o celular do cadastro e põe na fila. Nunca pergunta senha nem e-mail.
  async function checkinApp(btn) {
    btn.disabled = true;
    try {
      const { data, error } = await db.rpc('app_checkin', { p_token: app.dev });
      if (error) throw new Error(error.code === '54000' ? error.message : 'Não foi possível fazer o check-in agora. Tente de novo ou fale com a recepção.');
      if (data && data.erro === 'bloqueado') { appDesligar(); return telaPin(); }
      if (data && data.erro) { btn.disabled = false; return avisoTela(data.mensagem || 'Não foi possível fazer o check-in.'); }
      if (!data || !data.ticket) throw new Error('Não foi possível fazer o check-in agora.');
      guardarTicket(data.ticket); iniciar();
    } catch (e) { btn.disabled = false; avisoTela(e.message || 'Não foi possível fazer o check-in.'); }
  }

  btnSair.addEventListener('click', async () => {
    try { if (reg) { const x = await reg.pushManager.getSubscription(); if (x) { await db.rpc('fila_push_remover', { p_endpoint: x.endpoint }); await x.unsubscribe(); } } } catch { /* ignora */ }
    desligar(); sessao = null; guardarTicket(null); await db.auth.signOut({ scope: 'local' });
    if (portaObrig) { irParaPorta(); return; }   // PIN obrigatório: sair leva à porta, nunca ao check-in sem cadastro
    telaInicio();
  });

  async function iniciar() {
    // Sem exigir nada antes: quem chega faz o check-in. Avisos e login são opcionais.
    desligar();
    if ('serviceWorker' in navigator && !reg) { try { reg = await navigator.serviceWorker.register('sw.js', { scope: './' }); await navigator.serviceWorker.ready; } catch { /* sem aviso no celular; o resto funciona */ } }
    await lerPorta();
    if (portaObrig) {
      // PIN obrigatório: nada de check-in sem cadastro nem de entrada por e-mail e senha (mesmo com sessão antiga). Aparelho com PIN entra sozinho; sem ele, vai à porta.
      if (acessoDev()) {
        const abriu = await appIniciar();
        if (abriu && lerTicket()) { modo = 'ticket'; sessao = null; desenhar(null); ligarTempoReal(); atualizarTicket(); return; }
        if (abriu) return;
      }
      if (lerTicket()) { modo = 'ticket'; sessao = null; desenhar(null); ligarTempoReal(); atualizarTicket(); return; }   // link da fila que a clínica emitiu: só mostra a fila
      irParaPorta();
      return;
    }
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      if (acessoDev()) {   // acesso rápido: entra sozinho (celular + PIN); o check-in é de um toque e os pedidos aparecem na hora
        const abriu = await appIniciar();
        if (abriu && lerTicket()) { modo = 'ticket'; sessao = null; desenhar(null); ligarTempoReal(); atualizarTicket(); return; }
        if (abriu) return;
      }
      if (lerTicket()) { modo = 'ticket'; sessao = null; desenhar(null); ligarTempoReal(); atualizarTicket(); return; }
      return telaInicio();
    }
    const { data: conta } = await db.rpc('conta_paciente_resumo');
    if (!conta || !conta.conta) { await db.auth.signOut({ scope: 'local' }); return telaLogin('Essa conta não é de paciente. Entre com a conta que você usa no chat.'); }
    const { data: trocar } = await db.rpc('conta_precisa_trocar_senha');
    if (trocar === true) return telaTrocarSenha();
    sessao = session; modo = 'conta'; desenhar(null);
    assinarPush(); ligarTempoReal(); carregarJornada().then(() => { if (ultimo) desenhar(ultimo); });
    if (pedirCheckinAoEntrar) { pedirCheckinAoEntrar = false; const { data, error } = await db.rpc('fila_cheguei'); if (!error && data) { aoMudar(data); return desenhar(data); } }
    atualizar();
  }
  iniciar();
})();
</script>
